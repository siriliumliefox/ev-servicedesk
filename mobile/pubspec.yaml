name: ev_servicedesk
description: "EV-ServiceDesk — клиентское приложение (Цифровой паспорт автомобиля)"
publish_to: "none"
version: 0.1.0

# Платформы: iOS (iPhone) — основная; Android — сборка в CI (устройства нет); macOS — для разработки (ADR 0022).
# API: --dart-define=API_BASE_URL=http://host:8000 — реальный backend; без него — прототип на фикстурах.

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^11.2.0   # refresh-токен в Keychain/Keystore (Глава 18, ADR 0022)
  shared_preferences: ^2.3.0       # метка первого запуска: очистка Keychain после переустановки
  firebase_core: ^5.0.0            # push: инициализация Firebase (Глава 15, ADR 0019)
  firebase_messaging: ^17.0.0      # push: ≥ 16 — UIScene (iOS), иначе нажатие на push теряется (Глава 20)
  flutter_svg: ^2.3.0              # контур схемы агрегатов — SVG-ассет (Глава 19, ADR 0023)
  image_picker: ^1.2.4             # вложения тикета: камера и галерея (Глава 20, ADR 0024 п. 9)
  web_socket_channel: ^3.0.3       # чат по тикету в реальном времени (Глава 20, ADR 0024 п. 8)
  flutter_markdown_plus: ^1.0.12   # текст статьи базы знаний — CommonMark (Глава 20, ADR 0024 п. 7)
  url_launcher: ^6.3.3             # ссылки статей и видео вложений — во внешнем приложении

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scheme/car_top.svg
  # Inter 4.1 (rsms/inter, OFL — assets/fonts/inter/OFL.txt): начертания темы 400/500/600/700 (ADR 0010, 0022 п. 9).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700

name: backend-poetry
description: >-
  Python 3.12 и poetry-окружение backend (Poetry 2.5.1, как в Dockerfile и poetry.lock; .venv в проекте, кэш по
  poetry.lock) — для сценариев стека (scripts/integration_stack.sh, backend/scripts/e2e_*.py).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Poetry
      shell: bash
      run: |
        pipx install poetry==2.5.1
        poetry config virtualenvs.in-project true

    - uses: actions/cache@v6
      with:
        path: backend/.venv
        key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

    - name: Зависимости backend
      shell: bash
      working-directory: backend
      run: poetry install --no-interaction

name: mobile-e2e

# E2E мобильного клиента на уровне API (Глава 18, ADR 0022 п. 2): настоящий HttpClientRepository
# (test_api_e2e) против стека backend из образа-кандидата — регистрация → авто → карточка → сессия.
# Вызывается из ci.yml при изменениях mobile/ или backend/: изменение backend может сломать клиент.
# UI E2E (integration_test в iOS Simulator) — локально, mobile/scripts/e2e_ui.sh: на macOS-раннерах нет Docker.

on:
  workflow_call:

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry (venv in project)
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Стек backend, сценарий backend и E2E клиента
        run: >-
          scripts/integration_stack.sh backend:integration --
          bash -c 'cd mobile && flutter test test_api_e2e'

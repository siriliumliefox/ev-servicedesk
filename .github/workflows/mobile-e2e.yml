name: mobile-e2e

# E2E мобильного клиента на уровне API (Глава 18, ADR 0022 п. 2): настоящий HttpClientRepository
# (test_api_e2e) против стека backend из образа-кандидата — регистрация → авто → карточка → сессия;
# схема агрегатов (Глава 19, ADR 0023 п. 7) — seed 5 тестовых авто и сверка статусов клиента с таблицей;
# клиентский сценарий (Глава 20, ADR 0024 п. 1) — статьи с деревом решений, тикет с фото в MinIO стека,
# ответ инженера по WebSocket, новости (docs/specs/support_flow.json, backend/scripts/e2e_support.py).
# Вызывается из ci.yml при изменениях mobile/ или backend/: изменение backend может сломать клиент.
# UI E2E (integration_test) — mobile-ui-e2e.yml на Android-эмуляторе (глава 23) и локально в iOS Simulator.

on:
  workflow_call:
    inputs:
      image:
        description: "Образ backend (ghcr.io/…@sha256:…, regression.yml); пусто — собрать из исходников"
        default: ""
        type: string
      ref:
        description: "Коммит для checkout; пусто — коммит события"
        default: ""
        type: string

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry (venv in project)
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - uses: docker/setup-buildx-action@v3
        if: inputs.image == ''

      - uses: docker/build-push-action@v6
        if: inputs.image == ''
        with:
          context: ./backend
          load: true
          tags: backend:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Опубликованный образ backend
        if: inputs.image != ''
        env:
          IMAGE: ${{ inputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          docker tag "$IMAGE" backend:integration

      - name: Стек backend, сценарий backend, 5 тестовых авто, статьи поддержки и E2E клиента
        run: >-
          scripts/integration_stack.sh backend:integration --
          bash -c '(cd backend && poetry run python scripts/seed_scheme_vehicles.py &&
          poetry run python scripts/e2e_support.py seed) &&
          cd mobile && flutter test test_api_e2e'

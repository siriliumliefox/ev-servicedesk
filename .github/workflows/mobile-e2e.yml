name: mobile-e2e

# E2E мобильного клиента на уровне API (Глава 18, ADR 0022 п. 2): настоящий HttpClientRepository
# (test_api_e2e) против стека backend из образа-кандидата — регистрация → авто → карточка → сессия;
# схема агрегатов (Глава 19, ADR 0023 п. 7) — seed 5 тестовых авто и сверка статусов клиента с таблицей;
# клиентский сценарий (Глава 20, ADR 0024 п. 1) — статьи с деревом решений, тикет с фото в MinIO стека,
# ответ инженера по WebSocket, новости (docs/specs/support_flow.json, backend/scripts/e2e_support.py).
# Вызывается из ci.yml при изменениях mobile/ или backend/: изменение backend может сломать клиент.
# UI E2E (integration_test) — mobile-ui-e2e.yml на Android-эмуляторе (глава 23) и локально в iOS Simulator.

on:
  workflow_call:
    inputs:
      image:
        description: "Образ backend (ghcr.io/…@sha256:…, regression.yml); пусто — собрать из исходников"
        default: ""
        type: string
      ref:
        description: "Коммит для checkout; пусто — коммит события"
        default: ""
        type: string

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/backend-poetry

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - uses: ./.github/actions/backend-image
        with:
          image: ${{ inputs.image }}

      - name: Стек backend, сценарий backend, 5 тестовых авто, статьи поддержки и E2E клиента
        run: >-
          scripts/integration_stack.sh backend:integration --
          bash -c '(cd backend && poetry run python scripts/seed_scheme_vehicles.py &&
          poetry run python scripts/e2e_support.py seed) &&
          cd mobile && flutter test test_api_e2e'

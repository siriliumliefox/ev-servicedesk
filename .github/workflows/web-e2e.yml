name: web-e2e

# E2E веб-приложений (Playwright, Chromium) против стека backend из образа-кандидата
# (scripts/integration_stack.sh); приложение — production-сборка (`/v1`, CSP) в `vite preview` с прокси
# на стек. `app` — какое:
# - web-engineer (глава 21, ADR 0025 п. 14): тикет в работу перетаскиванием → быстрый ответ из базы знаний →
#   «Решено» с клавиатуры, клиент получает события по WebSocket не позже 2 с; два инженера берут один тикет.
#   Данные — backend/scripts/e2e_engineer.py seed.
# - web-admin (глава 22, ADR 0026 п. 13–15): пересмотр регламента → статус клиента без деплоя, дашборд =
#   контрольный набор аналитики, пользователи, публикация, статья. Данные — backend/scripts/e2e_admin.py seed.
# Вызывается из ci.yml (матрица по приложениям) при изменениях web-*/ или backend/ — Chromium. Firefox и
# WebKit — локально (<app>/scripts/e2e.sh) или ручным запуском ci.yml с web_browsers="chromium firefox webkit":
# Firefox из Playwright не запускается на macOS 27 («Could not find profile folder»).

on:
  workflow_call:
    inputs:
      app:
        description: "Приложение: web-engineer или web-admin"
        required: true
        type: string
      browsers:
        description: "Браузеры через пробел: chromium firefox webkit"
        default: "chromium"
        type: string

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry (venv in project)
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Браузеры Playwright
        working-directory: ${{ inputs.app }}
        env:
          BROWSERS: ${{ inputs.browsers || 'chromium' }}
        run: |
          [[ "$BROWSERS" =~ ^(chromium|firefox|webkit)( (chromium|firefox|webkit))*$ ]] || {
            echo "browsers: только chromium, firefox, webkit через пробел, получено: '$BROWSERS'"; exit 1; }
          read -ra list <<<"$BROWSERS"
          npx playwright install --with-deps "${list[@]}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Стек backend, данные приложения и Playwright
        env:
          APP: ${{ inputs.app }}
          BROWSERS: ${{ inputs.browsers || 'chromium' }}
          E2E_BACKEND_IMAGE: backend:integration
        run: |
          [[ "$APP" =~ ^web-(engineer|admin)$ ]] || { echo "app: web-engineer или web-admin, получено: '$APP'"; exit 1; }
          read -ra list <<<"$BROWSERS"
          "$APP/scripts/e2e.sh" "${list[@]/#/--project=}"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ inputs.app }}
          path: |
            ${{ inputs.app }}/playwright-report
            ${{ inputs.app }}/test-results
          retention-days: 7

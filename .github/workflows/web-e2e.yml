name: web-e2e

# E2E веб-приложений (Playwright, Chromium) против стека backend из образа-кандидата
# (scripts/integration_stack.sh); приложение — production-сборка (`/v1`, CSP) в `vite preview` с прокси
# на стек. `app` — какое:
# - web-engineer (глава 21, ADR 0025 п. 14): тикет в работу перетаскиванием → быстрый ответ из базы знаний →
#   «Решено» с клавиатуры, клиент получает события по WebSocket не позже 2 с; два инженера берут один тикет.
#   Данные — backend/scripts/e2e_engineer.py seed.
# - web-admin (глава 22, ADR 0026 п. 13–15): пересмотр регламента → статус клиента без деплоя, дашборд =
#   контрольный набор аналитики, пользователи, публикация, статья. Данные — backend/scripts/e2e_admin.py seed.
# - system-e2e (глава 23, ADR 0027 п. 8): межролевые P0 — кабинет инженера и админ-панель на одном стеке, клиент
#   по API (замена агрегата, прошивка по модели, вход по ролям, главный сценарий). Данные — e2e_system.py seed.
# Вызывается из ci.yml (матрица по приложениям) при изменениях web-*/ или backend/ — Chromium. Firefox и
# WebKit — локально (<app>/scripts/e2e.sh) или ручным запуском ci.yml с web_browsers="chromium firefox webkit":
# Firefox из Playwright не запускается на macOS 27 («Could not find profile folder»).
# Regression (глава 23, ADR 0027 п. 5, regression.yml): `image` — опубликованный образ backend по digest, `ref` —
# его коммит, `artifacts_run_id` — прогон cd-staging с артефактами web-*-staging-<ref>: приложения запускаются
# из этих сборок (то, что выкладывается на staging), а не собираются заново.

on:
  workflow_call:
    inputs:
      app:
        description: "Набор: web-engineer, web-admin или system-e2e"
        required: true
        type: string
      browsers:
        description: "Браузеры через пробел: chromium firefox webkit"
        default: "chromium"
        type: string
      image:
        description: "Образ backend (ghcr.io/…@sha256:…); пусто — собрать из исходников"
        default: ""
        type: string
      ref:
        description: "Коммит для checkout; пусто — коммит события"
        default: ""
        type: string
      artifacts_run_id:
        description: "Прогон cd-staging с артефактами web-*-staging-<ref>; пусто — сборка из исходников"
        default: ""
        type: string

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/backend-poetry

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Браузеры Playwright
        working-directory: ${{ inputs.app }}
        env:
          BROWSERS: ${{ inputs.browsers || 'chromium' }}
        run: |
          [[ "$BROWSERS" =~ ^(chromium|firefox|webkit)( (chromium|firefox|webkit))*$ ]] || {
            echo "browsers: только chromium, firefox, webkit через пробел, получено: '$BROWSERS'"; exit 1; }
          read -ra list <<<"$BROWSERS"
          npx playwright install --with-deps "${list[@]}"

      - uses: ./.github/actions/backend-image
        with:
          image: ${{ inputs.image }}

      - name: Сборка кабинета инженера из cd-staging
        if: inputs.artifacts_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: web-engineer-staging-${{ inputs.ref }}
          path: ${{ runner.temp }}/dist/web-engineer
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ github.token }}

      - name: Сборка админ-панели из cd-staging
        if: inputs.artifacts_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: web-admin-staging-${{ inputs.ref }}
          path: ${{ runner.temp }}/dist/web-admin
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ github.token }}

      - name: Стек backend, данные приложения и Playwright
        env:
          APP: ${{ inputs.app }}
          BROWSERS: ${{ inputs.browsers || 'chromium' }}
          E2E_BACKEND_IMAGE: backend:integration
          # Готовые сборки cd-staging; конфиг каждого набора читает только свою.
          E2E_ENGINEER_DIST: ${{ inputs.artifacts_run_id != '' && format('{0}/dist/web-engineer', runner.temp) || '' }}
          E2E_ADMIN_DIST: ${{ inputs.artifacts_run_id != '' && format('{0}/dist/web-admin', runner.temp) || '' }}
        run: |
          [[ "$APP" =~ ^(web-engineer|web-admin|system-e2e)$ ]] || { echo "app: web-engineer, web-admin или system-e2e, получено: '$APP'"; exit 1; }
          read -ra list <<<"$BROWSERS"
          "$APP/scripts/e2e.sh" "${list[@]/#/--project=}"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ inputs.app }}
          path: |
            ${{ inputs.app }}/playwright-report
            ${{ inputs.app }}/test-results
          retention-days: 7

name: web-e2e

# E2E веб-кабинета инженера (Глава 21, ADR 0025 п. 14): Playwright (Chromium) против стека backend из
# образа-кандидата (scripts/integration_stack.sh). Кабинет — production-сборка (`/v1`, CSP) в
# `vite preview` с прокси на стек. Сценарии чек-листа: тикет в работу перетаскиванием → быстрый ответ
# из базы знаний → «Решено» с клавиатуры, клиент получает события по WebSocket не позже 2 с; конкурентный
# доступ — два инженера берут один тикет. Данные — backend/scripts/e2e_engineer.py seed.
# Вызывается из ci.yml при изменениях web-engineer/, web-shared/ или backend/. WebKit и Firefox — локально.

on:
  workflow_call:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry (venv in project)
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Playwright Chromium
        working-directory: web-engineer
        run: npx playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Стек backend, данные кабинета и Playwright
        run: >-
          scripts/integration_stack.sh backend:integration --
          bash -c 'SEED="$(mktemp)" &&
          (cd backend && poetry run python scripts/e2e_engineer.py seed --out "$SEED" --e2e-sets 1) &&
          cd web-engineer && E2E_ENGINEER_SEED="$SEED" npx playwright test --project=chromium'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web-engineer/playwright-report
            web-engineer/test-results
          retention-days: 7

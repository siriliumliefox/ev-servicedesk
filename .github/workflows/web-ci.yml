name: web-ci

# Переиспользуемый workflow: вызывается из ci.yml (job `web`), который решает,
# нужен ли он для данного PR/push. Сам по событиям не запускается.
on:
  workflow_call:

jobs:
  web-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-engineer, web-admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (root — workspaces)
        run: npm ci

      # Контраст WCAG, тап-зоны, сетка, синхронность tokens.css / tokens.g.dart с design/tokens.json
      # (Глава 6, ADR 0010). Не зависит от приложения — один раз на матрицу.
      - name: Design tokens
        if: matrix.app == 'web-engineer'
        run: npm run test:tokens

      # Слой данных и репозиторий прототипа (Глава 8, ADR 0012). Общий для приложений — один раз на матрицу.
      - name: Test web-shared
        if: matrix.app == 'web-engineer'
        run: npm test --workspace web-shared

      - name: Lint
        run: npm run lint --workspace ${{ matrix.app }}

      # Экраны прототипа и подсчёт кликов типовых операций (Vitest + Testing Library, jsdom).
      - name: Test
        run: npm test --workspace ${{ matrix.app }}

      - name: Build
        run: npm run build --workspace ${{ matrix.app }}

name: ci

# Единая точка входа CI (Глава 4, ADR 0008).
# Запускается на КАЖДОМ PR без path-фильтров — иначе обязательная проверка
# «висела» бы в ожидании на PR, который не затронул ни один сервис. Какие
# проверки нужны, решает job `changes`; отдельные workflow (*-ci.yml) —
# переиспользуемые (workflow_call) и сами не запускаются.
# В branch protection `main`/`develop` обязательна только проверка `ci-gate`.

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:   # ручной прогон — все проверки, без фильтра
    inputs:
      web_browsers:
        description: "E2E веб-кабинета инженера и админ-панели: браузеры через пробел (chromium firefox webkit)"
        default: "chromium"
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      mobile: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mobile == 'true' }}
      # E2E клиента (Глава 18): клиент или backend, против которого он проверяется.
      mobile_e2e: >-
        ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mobile == 'true'
        || steps.filter.outputs.backend == 'true' }}
      # E2E веб-кабинета инженера (Глава 21, ADR 0025 п. 14): кабинет, общий web-слой или backend.
      web_e2e: >-
        ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web_e2e == 'true'
        || steps.filter.outputs.backend == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR — изменения относительно базовой ветки; push — относительно
      # предыдущего коммита этой же ветки.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - "backend/**"
              - "docs/EV_ServiceDesk_Glava2_DDL.sql"   # test_ddl_export сверяет с миграциями
              - "docs/ERD_EV_ServiceDesk_Glava2.mermaid"  # test_erd_export сверяет с ORM
              - "docs/specs/**"                        # tests/domain: сценарии и таблицы спецификации
              - "docs/openapi.yaml"                    # tests/contract: OpenAPI ↔ ORM ↔ RBAC
              - "docs/asyncapi.yaml"                   # tests/contract: примеры событий WebSocket ↔ OpenAPI
              - "docs/requirements/RBAC_MATRIX.md"
              - ".github/workflows/backend-ci.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/cd-staging.yml"     # сборка и smoke образа (ADR 0013)
              - "scripts/smoke_backend_image.sh"
              - "scripts/integration_stack.sh"         # интеграционный стек (Глава 17, ADR 0021)
              - "docker-compose.yml"                   # MinIO тестов, smoke образа, интеграционный стек
              - "docker-compose.integration.yml"
            web:
              - "web-engineer/**"
              - "web-admin/**"
              - "web-shared/**"
              - "design/**"                            # tokens.json → tokens.css / tokens.g.dart (Глава 6)
              - "mobile/lib/theme/tokens.g.dart"
              - "scripts/design_tokens.mts"
              - "scripts/design_tokens.test.mts"
              - "system-e2e/**"                        # lint и типы межролевых E2E (глава 23)
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/web-ci.yml"
              - ".github/workflows/ci.yml"
            web_e2e:
              - "web-engineer/**"
              - "web-admin/**"
              - "web-shared/**"
              - "system-e2e/**"
              - "scripts/integration_stack.sh"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/web-e2e.yml"
            mobile:
              - "mobile/**"
              - ".github/workflows/mobile-ci.yml"
              - ".github/workflows/mobile-e2e.yml"
              - ".github/workflows/mobile-ui-e2e.yml"
              - ".github/workflows/ci.yml"
            docs:
              - "docs/**"                              # в т. ч. openapi.yaml и asyncapi.yaml
              - "scripts/sync_swagger_html.py"
              - "scripts/mock_smoke.mts"
              - "scripts/check_api_breaking.sh"
              - ".spectral.yaml"
              - ".spectral-asyncapi.yaml"
              - "web-shared/src/api/**"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/docs-ci.yml"
              - ".github/workflows/ci.yml"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-ci.yml

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-ci.yml

  mobile-e2e:
    needs: changes
    if: needs.changes.outputs.mobile_e2e == 'true'
    uses: ./.github/workflows/mobile-e2e.yml

  # UI E2E клиента на Android-эмуляторе (глава 23, ADR 0027 п. 4, Q19): только при изменениях mobile/ —
  # изменения backend закрывает mobile-e2e на уровне API.
  mobile-ui-e2e:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-ui-e2e.yml

  web-e2e:
    needs: changes
    if: needs.changes.outputs.web_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [web-engineer, web-admin, system-e2e]
    uses: ./.github/workflows/web-e2e.yml
    with:
      app: ${{ matrix.app }}
      browsers: ${{ inputs.web_browsers || 'chromium' }}

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-ci.yml

  # Unicode NFC во всех текстовых файлах — на каждом PR, независимо от изменённых путей.
  unicode-nfc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Text files are Unicode NFC
        run: python3 scripts/check_unicode_nfc.py

  # Матрица сценариев E2E (глава 23, ADR 0027 п. 1) — на каждом PR: переименование или удаление теста,
  # на который ссылается сценарий, и новое Must-требование без сценария ломают проверку.
  e2e-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: PyYAML
        run: pip install "pyyaml==6.0.3"

      - name: Страж матрицы и его тесты
        run: |
          python3 -m unittest scripts/test_check_e2e_matrix.py
          python3 scripts/check_e2e_matrix.py

  # Поиск секретов — на каждом PR, независимо от изменённых путей.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Уязвимые зависимости (Глава 25, ADR 0029 п. 9, OWASP A03) — на каждом PR: база уязвимостей
  # обновляется без изменений в репозитории. Backend — pip-audit по установленному окружению
  # (poetry.lock, включая dev); веб — npm audit пакетов сборки (без dev), High и выше; мобильное
  # приложение и backend — osv-scanner по lock-файлам. Находки инструментов разработки (Prism,
  # Spectral) — отчёт главы 25, S4.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Backend — pip-audit
        working-directory: backend
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root
          poetry run pip install --quiet pip-audit==2.10.1
          poetry run pip-audit --skip-editable --desc

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Веб — npm audit (пакеты сборки, High и выше)
        run: npm audit --omit=dev --audit-level=high

      - name: Mobile и backend — osv-scanner
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner@sha256:f7ba4be68bac8086b1f88fd598fdca1ca67239c79ad2c2b5c78e03a82e5187c4
          scan source --lockfile /src/mobile/pubspec.lock --lockfile /src/backend/poetry.lock

  # Единственная обязательная проверка. Зелёная, только если `changes`,
  # `unicode-nfc`, `e2e-matrix`, `secret-scan` и `dependency-audit` успешны, а каждая проверка сервиса — успешна или не нужна
  # (skipped). Падение, отмена или пропуск из-за упавшей зависимости — красный.
  ci-gate:
    needs: [changes, backend, web, mobile, mobile-e2e, mobile-ui-e2e, web-e2e, docs, unicode-nfc, e2e-matrix, secret-scan, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Результаты проверок
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          must_run = {"changes", "unicode-nfc", "e2e-matrix", "secret-scan", "dependency-audit"}
          failed = False
          for name, job in sorted(needs.items()):
              result = job["result"]
              ok = result == "success" or (result == "skipped" and name not in must_run)
              print(f"{'PASS' if ok else 'FAIL'}  {name}: {result}")
              failed |= not ok
          sys.exit(1 if failed else 0)
          PY

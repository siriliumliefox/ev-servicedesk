name: mobile-ci

# `flutter analyze`/`flutter test` — на ubuntu ("flutter tester", без Xcode и симулятора).
# Сборки (Глава 18, ADR 0022 п. 1): Android — debug APK на ubuntu (устройства нет, проверяется сборкой),
# iOS — без подписи на macos-latest (дороже по CI-минутам, ~10x множитель GitHub).

# Переиспользуемый workflow: вызывается из ci.yml (job `mobile`), который решает,
# нужен ли он для данного PR/push. Сам по событиям не запускается.
on:
  workflow_call:

jobs:
  mobile-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Build APK (debug)
        run: flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Build iOS (без подписи)
        run: flutter build ios --debug --no-codesign

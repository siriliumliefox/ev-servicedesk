name: mobile-ci

# ПРИМЕЧАНИЕ: ubuntu-latest достаточен для `flutter analyze`/`flutter test` —
# оба используют "flutter tester" (headless Dart VM), не требуют Xcode/симулятор.
# Реальная нативная сборка (`flutter build ios`/`flutter build macos`) появится
# в Главах 18–20 вместе с папками ios/macos — тогда этому job понадобится
# отдельный шаг на macos-latest (дороже по CI-минутам, ~10x множитель GitHub).
# Этот workflow НЕ была прогнан вживую (Flutter SDK недоступен в среде
# подготовки проекта) — синтаксис соответствует официальному
# subosito/flutter-action, но реальный зелёный статус проверите сами.

on:
  pull_request:
    branches: [develop, main]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  push:
    branches: [develop]
    paths: ["mobile/**"]

jobs:
  mobile-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

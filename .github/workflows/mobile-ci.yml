name: mobile-ci

# ПРИМЕЧАНИЕ: ubuntu-latest достаточен для `flutter analyze`/`flutter test` —
# оба используют "flutter tester" (headless Dart VM), не требуют Xcode/симулятор.
# Реальная нативная сборка (`flutter build ios`/`flutter build macos`) появится
# в Главах 18–20 вместе с папками ios/macos — тогда этому job понадобится
# отдельный шаг на macos-latest (дороже по CI-минутам, ~10x множитель GitHub).

# Переиспользуемый workflow: вызывается из ci.yml (job `mobile`), который решает,
# нужен ли он для данного PR/push. Сам по событиям не запускается.
on:
  workflow_call:

jobs:
  mobile-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

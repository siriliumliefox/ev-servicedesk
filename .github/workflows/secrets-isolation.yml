name: secrets-isolation

# Проверка изоляции секретов окружений (Глава 4, ADR 0008).
# Запуск: вручную или автоматически при изменении этого файла в develop/main.
#   • из develop — политики окружений, job без окружения, job staging;
#   • из main    — то же для production (после одобрения reviewer'ом).
# push-триггер нужен и потому, что workflow_dispatch доступен только для
# workflow, которые GitHub уже зарегистрировал (есть в main или запускались по событию).
# Отпечатки — переменные JWT_SECRET_FP_<ENV> (scripts/set-environment-secrets.sh):
# первые 16 hex SHA-256 от секрета; сам секрет не выводится.

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths: [".github/workflows/secrets-isolation.yml"]

permissions:
  contents: read
  actions: read

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - name: Политики окружений и секреты вне окружения
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_WITHOUT_ENV: ${{ secrets.JWT_SECRET }}
          FP_STAGING: ${{ vars.JWT_SECRET_FP_STAGING }}
          FP_PRODUCTION: ${{ vars.JWT_SECRET_FP_PRODUCTION }}
        run: |
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "PASS  $1"; else echo "FAIL  $1: ожидалось '$3', получено '$2'"; fail=1; fi; }
          branches() { gh api "repos/$GITHUB_REPOSITORY/environments/$1/deployment-branch-policies" --jq '[.branch_policies[].name] | join(",")'; }
          check "job без окружения не видит JWT_SECRET" "${#SECRET_WITHOUT_ENV}" 0
          check "staging: деплой только из develop" "$(branches staging)" develop
          check "production: деплой только из main" "$(branches production)" main
          check "production: required reviewer задан" \
            "$(gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '[.protection_rules[] | select(.type=="required_reviewers")] | length')" 1
          check "отпечатки staging и production заданы" "$([ -n "$FP_STAGING" ] && [ -n "$FP_PRODUCTION" ] && echo yes)" yes
          check "отпечатки staging и production различаются" "$([ "$FP_STAGING" != "$FP_PRODUCTION" ] && echo yes)" yes
          exit $fail

  staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: JWT_SECRET staging — свой, не production
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FP_OWN: ${{ vars.JWT_SECRET_FP_STAGING }}
          FP_OTHER: ${{ vars.JWT_SECRET_FP_PRODUCTION }}
        run: |
          fp=$(printf '%s' "$JWT_SECRET" | sha256sum | cut -c1-16)
          fail=0
          check() { if [ "$2" = yes ]; then echo "PASS  $1"; else echo "FAIL  $1"; fail=1; fi; }
          check "секрет окружения доступен" "$([ -n "$JWT_SECRET" ] && echo yes)"
          check "отпечаток $fp = отпечаток своего окружения ($FP_OWN)" "$([ "$fp" = "$FP_OWN" ] && echo yes)"
          check "отпечаток $fp ≠ отпечатка другого окружения ($FP_OTHER)" "$([ "$fp" != "$FP_OTHER" ] && echo yes)"
          exit $fail

  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: JWT_SECRET production — свой, не staging
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FP_OWN: ${{ vars.JWT_SECRET_FP_PRODUCTION }}
          FP_OTHER: ${{ vars.JWT_SECRET_FP_STAGING }}
        run: |
          fp=$(printf '%s' "$JWT_SECRET" | sha256sum | cut -c1-16)
          fail=0
          check() { if [ "$2" = yes ]; then echo "PASS  $1"; else echo "FAIL  $1"; fail=1; fi; }
          check "секрет окружения доступен" "$([ -n "$JWT_SECRET" ] && echo yes)"
          check "отпечаток $fp = отпечаток своего окружения ($FP_OWN)" "$([ "$fp" = "$FP_OWN" ] && echo yes)"
          check "отпечаток $fp ≠ отпечатка другого окружения ($FP_OTHER)" "$([ "$fp" != "$FP_OTHER" ] && echo yes)"
          exit $fail

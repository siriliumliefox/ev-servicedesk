name: docs-ci

# Переиспользуемый workflow: вызывается из ci.yml (job `docs`), который решает,
# нужен ли он для данного PR/push. Сам по событиям не запускается.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install "openapi-spec-validator==0.7.*"

      - name: Validate OpenAPI
        run: openapi-spec-validator docs/openapi.yaml

      - name: Swagger UI HTML in sync with openapi.yaml
        run: python3 scripts/sync_swagger_html.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # ≥ 22.18: scripts/mock_smoke.mts запускается без сборки
          cache: "npm"

      - name: Install dependencies (Spectral, Prism, openapi-typescript)
        run: npm ci

      - name: Lint OpenAPI (Spectral)
        run: npm run lint:api

      - name: Generated API types in sync (web-shared/src/api/schema.ts)
        run: |
          npm run gen:api
          git diff --exit-code -- web-shared/src/api/schema.ts

      - name: Mock server smoke test (Prism + web-shared client)
        run: npm run test:mock

      - name: Breaking changes vs base branch (oasdiff, ADR 0007)
        if: github.event_name == 'pull_request'
        run: scripts/check_api_breaking.sh "origin/${{ github.base_ref }}"


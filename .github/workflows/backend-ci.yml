name: backend-ci

# Переиспользуемый workflow: вызывается из ci.yml (job `backend`), который решает,
# нужен ли он для данного PR/push. Сам по событиям не запускается.
on:
  workflow_call:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    # Реальный PostgreSQL 16 для тестов схемы и миграций (Глава 2). Эфемерный контейнер
    # без пароля (trust) — секреты в workflow не нужны.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ev
          POSTGRES_DB: ev_servicedesk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis 7: SMS-коды и rate limiting Auth Service (Глава 10, ADR 0005/0013).
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ev@localhost:5432/ev_servicedesk_test
      REQUIRE_DB: "1"
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_REDIS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry (venv in project)
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Migrations upgrade / downgrade / upgrade
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head
          poetry run alembic check

      - name: DDL in sync with migrations
        run: poetry run python scripts/export_ddl.py --check

      - name: Test (pytest)
        run: poetry run pytest -v

  # Образ проверяется уже на PR (как в cd-staging, но без публикации): fail closed без
  # ENVIRONMENT, Auth Service в режиме staging (ADR 0013).
  image-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-тест образа
        run: scripts/smoke_backend_image.sh backend:smoke

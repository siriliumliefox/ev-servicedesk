name: backend-ci

# Переиспользуемый workflow: вызывается из ci.yml (job `backend`), который решает,
# нужен ли он для данного PR/push. Сам по событиям не запускается.
on:
  workflow_call:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    # Реальный PostgreSQL 16 для тестов схемы и миграций (Глава 2). Эфемерный контейнер
    # без пароля (trust) — секреты в workflow не нужны.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ev
          POSTGRES_DB: ev_servicedesk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis 7: SMS-коды и rate limiting Auth Service (Глава 10, ADR 0005/0013).
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ev@localhost:5432/ev_servicedesk_test
      REQUIRE_DB: "1"
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_REDIS: "1"
      # MinIO (шаг «Start MinIO»): эфемерный контейнер задания, ключи — не секреты, как trust
      # у Postgres. Тестовый бакет создаёт фикстура s3_session (tests/conftest.py).
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: ev-servicedesk-test
      TEST_S3_ACCESS_KEY: ev_ci
      TEST_S3_SECRET_KEY: ev_ci_only
      REQUIRE_S3: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry (venv in project)
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v6
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # S3 API для тестов хранилища вложений (Глава 13, ADR 0017 п. 11) — сервис minio из
      # docker-compose.yml: тот же закреплённый образ, команда и healthcheck (--wait ждёт его).
      # Не service-контейнер: ему нельзя передать команду, а образу MinIO нужен `server /data`.
      - name: Start MinIO
        env:
          S3_ACCESS_KEY: ${{ env.TEST_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ env.TEST_S3_SECRET_KEY }}
        run: |
          docker compose -f ../docker-compose.yml up -d --wait minio || {
            docker compose -f ../docker-compose.yml logs minio
            exit 1
          }

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Migrations upgrade / downgrade / upgrade
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head
          poetry run alembic check

      - name: DDL in sync with migrations
        run: poetry run python scripts/export_ddl.py --check

      # Покрытие строк алгоритма «светофор» и сервиса агрегатов ≥ 90% (DoD главы 12, ADR 0016).
      - name: Test (pytest)
        run: >-
          poetry run pytest -v
          --cov=app/domain/aggregates --cov-report=term-missing --cov-fail-under=90

  # Образ проверяется уже на PR (как в cd-staging, но без публикации): fail closed без
  # ENVIRONMENT и без бакета S3, режим staging — Auth, Vehicle, Aggregates, Tickets/Uploads,
  # WebSocket (ADR 0013, 0017). Redis — service container; MinIO-сайдкар во внутренней
  # docker-сети поднимает и удаляет сам скрипт (ключи — одноразовые, service container не
  # подходит: образу MinIO нужна команда `server /data`).
  image-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-тест образа
        run: scripts/smoke_backend_image.sh backend:smoke

  # Интеграционный стек (Глава 17, ADR 0021 п. 1, 9): все сервисы backend из одного образа в
  # режиме staging — миграции, API, оба worker'а, PostgreSQL, Redis, MinIO; сквозной сценарий
  # «регистрация → авто → уведомление → тикет → аналитика» со сверкой каждого ответа с
  # контрактом и аудит целостности. Секреты стека — одноразовые (scripts/integration_stack.sh).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry (venv in project)
        run: poetry config virtualenvs.in-project true

      - name: Cache venv
        uses: actions/cache@v6
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Интеграционный стек и сквозной сценарий
        run: scripts/integration_stack.sh backend:integration

name: cd-staging

# Сборка, публикация и перетегирование образов backend и PostgreSQL (ghcr.io), сборка статики и выкладка
# на ВМ staging (глава 26, ADR 0030 п. 7: deploy-server.yml по SSH; пока сервер не заказан — «сервер не
# настроен», ADR 0030 п. 2).
#
# Два режима:
#   • push в develop / ручной запуск без git_sha — сборка образа
#     backend:staging-<sha> и перевод на него тега backend:staging;
#   • ручной запуск с git_sha — ОТКАТ без пересборки: существующий
#     backend:staging-<git_sha> перетегируется в backend:staging
#     (scripts/rollback-staging.sh).
# Запуск разрешён только из develop (и окружение staging принимает только develop).
# После сборки — полный regression-набор на опубликованном образе и артефактах web (глава 23, ADR 0027 п. 5,
# regression.yml); на откате не запускается — откатываются на коммит, уже прошедший regression.

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "web-engineer/**"
      - "web-admin/**"
      - "web-shared/**"
      - "scripts/smoke_backend_image.sh"
      - "scripts/rollback_compat.sh"     # страж плана отката (глава 26, ADR 0030 п. 16)
      - "deploy/**"                      # конфигурации ВМ и образ PostgreSQL (глава 26)
      - "scripts/integration_stack.sh"   # интеграционный стек (Глава 17, ADR 0021)
      - "docker-compose.yml"   # образ MinIO smoke-теста (x-minio-image), интеграционный стек
      - "docker-compose.integration.yml"
      - ".github/workflows/cd-staging.yml"
      # Regression (глава 23): каждый коммит develop с клиентом или тестами получает образ staging-<sha>.
      - "mobile/**"
      - "system-e2e/**"
      - ".github/workflows/regression.yml"
      - ".github/workflows/web-e2e.yml"
      - ".github/workflows/mobile-e2e.yml"
      - ".github/workflows/mobile-ui-e2e.yml"
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Полный SHA коммита для отката (образ backend:staging-<sha> должен существовать). Пусто — сборка HEAD develop"
        required: false

permissions:
  contents: read
  packages: write
  actions: read   # regression.yml: артефакты web этого прогона

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  ROLLBACK_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.git_sha || '' }}

jobs:
  build-backend-image:
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.git_sha == '')
    runs-on: ubuntu-latest
    # Redis для smoke-теста образа (Auth Service, Глава 10); MinIO-сайдкар (Глава 13)
    # поднимает и удаляет сам скрипт во внутренней docker-сети.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Имя образа
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сначала собрать локально и проверить: сломанный образ в backend:staging не попадает.
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend:smoke
          cache-from: type=gha

      - name: Smoke-тест образа (ENVIRONMENT=staging, ADR 0013, 0017)
        run: scripts/smoke_backend_image.sh backend:smoke

      # Интеграционный стек того же образа до публикации тега staging (ADR 0021 п. 1):
      # сквозной сценарий и аудит целостности. Python и poetry — для сценария на хосте.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry и зависимости сценария
        working-directory: backend
        run: |
          pipx install poetry==2.5.1
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Интеграционный стек и сквозной сценарий (ADR 0021)
        run: scripts/integration_stack.sh backend:smoke

      # План отката (ADR 0030 п. 16): текущий backend:staging (предыдущий выпуск) стартует на схеме
      # кандидата и читает все таблицы. FAIL — миграция несовместима, откат потребует downgrade.
      - name: Страж отката — предыдущий выпуск на схеме кандидата
        run: |
          if docker pull -q "$IMAGE:staging" >/dev/null 2>&1; then
            scripts/rollback_compat.sh backend:smoke "$IMAGE:staging"
          else
            echo "::notice::Предыдущего выпуска backend:staging нет — страж пропущен"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PostgreSQL 16 + pgBackRest (deploy/postgres, ADR 0030 п. 9) — образ ВМ, по digest в bundle деплоя.
  build-postgres-image:
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.git_sha == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./deploy/postgres
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/postgres:staging
            ghcr.io/${{ github.repository }}/postgres:staging-${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

  build-web:
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.git_sha == '')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-engineer, web-admin]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Оба приложения — реальный API на том же origin (`/v1`, ADR 0025 п. 2, 14; ADR 0026 п. 16); фото и
      # видео вложений кабинета инженера — origin S3 из переменной окружения staging (до главы 26 пусто).
      - run: npm run build --workspace ${{ matrix.app }}
        env:
          VITE_API_BASE_URL: /v1
          VITE_MEDIA_ORIGIN: ${{ vars.STAGING_MEDIA_ORIGIN }}

      - name: Режим API и CSP в сборке
        working-directory: ${{ matrix.app }}/dist
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' index.html
          grep -qE "[\"'\`]/v1[\"'\`]" assets/*.js

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-staging-${{ github.sha }}
          path: ${{ matrix.app }}/dist
          retention-days: 14

  rollback-backend-image:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' && inputs.git_sha != ''
    runs-on: ubuntu-latest
    steps:
      - name: Проверить формат SHA
        run: |
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "git_sha должен быть полным SHA (40 hex), получено: '$ROLLBACK_SHA'"; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Перетегировать staging-<sha> → staging (без пересборки)
        run: |
          # digest = sha256 исходных байтов манифеста (индекса) в реестре
          digest() { set -o pipefail
                     docker buildx imagetools inspect --raw "$1" | sha256sum | sed 's/^/sha256:/; s/ .*//'; }
          src="$IMAGE:staging-$ROLLBACK_SHA"
          want=$(digest "$src") || {
            echo "FAIL  образ $src не найден в ghcr.io — откатиться можно только на собранный ранее коммит"; exit 1; }
          before=$(digest "$IMAGE:staging")
          docker buildx imagetools create --tag "$IMAGE:staging" "$src@$want"
          after=$(digest "$IMAGE:staging")
          echo "staging до отката:         $before"
          echo "staging-$ROLLBACK_SHA: $want"
          echo "staging после отката:      $after"
          if [ "$after" = "$want" ]; then
            echo "PASS  digest backend:staging совпадает с backend:staging-$ROLLBACK_SHA"
          else
            echo "FAIL  digest backend:staging не совпадает"; exit 1
          fi

  deploy-staging:
    needs: [build-backend-image, build-postgres-image, build-web, rollback-backend-image]
    # Ровно один из режимов выполнен успешно, остальные пропущены.
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/deploy-server.yml
    with:
      environment: staging
      sha: ${{ inputs.git_sha || github.sha }}
      mode: ${{ inputs.git_sha && 'rollback' || 'deploy' }}
    secrets: inherit

  regression:
    needs: [build-backend-image, build-web]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || inputs.git_sha == '')
    uses: ./.github/workflows/regression.yml
    with:
      git_sha: ${{ github.sha }}
      artifacts_run_id: ${{ github.run_id }}

name: cd-staging

# Граница честности: сборка и публикация образа/статики — РЕАЛЬНЫ и рабочие
# (используют ghcr.io, который уже существует вместе с репозиторием).
# Финальный шаг "выкатить на сервер" — заглушка: сервера ещё нет, это
# Глава 26. Как только появится — меняется только job `deploy-staging`,
# всё остальное (образы, теги, окружение) уже готово и трогать не придётся.

on:
  push:
    branches: [develop]
    paths: ["backend/**", "web-engineer/**", "web-admin/**", "web-shared/**"]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "SHA коммита для (пере)деплоя — оставить пустым для HEAD develop"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:staging
            ghcr.io/${{ github.repository }}/backend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-engineer, web-admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build --workspace ${{ matrix.app }}
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-staging-${{ github.sha }}
          path: ${{ matrix.app }}/dist
          retention-days: 14

  deploy-staging:
    needs: [build-backend-image, build-web]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Деплой на staging (заглушка — реальная инфраструктура в Главе 26)
        run: |
          SHA="${{ github.event.inputs.git_sha || github.sha }}"
          echo "TODO (Глава 26): здесь будет реальный вызов к staging-хостингу —"
          echo "SSH-команда / webhook / API вызов PaaS, который:"
          echo "  1) подтянет ghcr.io/${{ github.repository }}/backend:staging-$SHA"
          echo "  2) перезапустит backend-сервис"
          echo "  3) выложит web-engineer-staging-$SHA / web-admin-staging-$SHA (артефакты выше)"
          echo ""
          echo "Пока это единственный шаг всего пайплайна без реального эффекта —"
          echo "сборка и публикация образа/статики выше — настоящие и рабочие."

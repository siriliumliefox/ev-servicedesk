# EV-ServiceDesk — локальное окружение (Глава 4, шаг 3)
#
# Поднимает ТОЛЬКО инфраструктуру (Postgres, Redis, MinIO, Adminer) — backend/web
# запускаются нативно на хосте (poetry run / npm run dev) для быстрого
# hot-reload. Контейнеризация самого backend — опциональный профиль "full",
# пригодится для симуляции prod-подобного окружения перед Главой 26.
#
# Запуск:
#   cp .env.example .env      # один раз, значения по умолчанию уже local-safe
#   docker compose up -d
#
# Протестировано на: описание сборки образов ниже совместимо с arm64
# (MacBook Pro M5 Pro, Apple Silicon) — postgres/redis/adminer официальные
# образы мультиархитектурные. Реально не запускала — в этой среде нет
# доступа к Docker registry (см. ограничения сети), проверила только
# структуру и синтаксис файла.

# S3-хранилище вложений тикетов (Глава 13, ADR 0004, ADR 0017 п. 11). Официальные образы
# minio/minio и minio/mc больше не публикуются — сборка сообщества pgsty/minio (тот же
# MinIO, AGPLv3; внутри есть mc и curl). Версия закреплена тегом и digest — только здесь:
# backend-ci поднимает сервис minio этого файла, smoke-тест образа берёт образ отсюда же.
# Обновлять осознанно.
x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372

# Общее у сервисов приложения (профиль full): один образ backend — API, worker'ы, миграции.
# BACKEND_IMAGE — образ-кандидат (интеграционный стек главы 17, ADR 0021 п. 1); без него
# образ собирается из ./backend. Образ по умолчанию — production (fail closed); локальный
# профиль — явно local. BACKEND_ENV_FILE — файл переменных вместо .env (секреты стека).
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ev}:${POSTGRES_PASSWORD:-ev_local_only}@postgres:5432/${POSTGRES_DB:-ev_servicedesk}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-ev-servicedesk-local}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ev_local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-ev_local_only}

x-backend-app: &backend-app
  image: ${BACKEND_IMAGE:-ev-servicedesk-backend:local}
  build:
    context: ./backend
  env_file:
    - path: ${BACKEND_ENV_FILE:-.env}
      required: false   # не падать, если .env ещё не создан (cp .env.example .env)
  environment: *backend-env
  profiles: ["full"]   # docker compose --profile full up — прод-подобный прогон

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ev_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-ev_servicedesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d: без него pg_isready идёт в БД с именем пользователя — в логе FATAL «database does not exist».
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ev} -d ${POSTGRES_DB:-ev_servicedesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 (образ — x-minio-image выше). API — http://localhost:9000, веб-консоль —
  # http://localhost:9001 (логин/пароль — S3_* из .env).
  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ev_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ev_local_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Однократная настройка (идемпотентна): бакет и правило жизненного цикла — загрузки
  # uploads/ старше суток удаляются («сиротские» объекты, ADR 0017 п. 10). Тот же образ:
  # mc в нём есть, второй сторонний образ не нужен.
  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ev_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ev_local_only}
      S3_BUCKET: ${S3_BUCKET:-ev-servicedesk-local}
    entrypoint: ["/bin/sh", "-ec"]
    # $$ — подстановка внутри контейнера, а не docker compose.
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo '{"Rules":[{"ID":"expire-uploads","Status":"Enabled","Filter":{"Prefix":"uploads/"},"Expiration":{"Days":1}}]}' \
          | mc ilm import "local/$$S3_BUCKET"
        mc ilm rule ls "local/$$S3_BUCKET"
    restart: "no"

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles: ["tools"]   # docker compose --profile tools up

  # Схема БД — разовый сервис перед API и worker'ами (Глава 17, ADR 0021 п. 1).
  migrate:
    <<: *backend-app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-app
    environment:
      <<: *backend-env
      # Backend ходит в MinIO по сети compose, а presigned URL подписываются для адреса,
      # доступного клиентам на хосте (подпись включает хост).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "8000:8000"
    healthcheck:
      # В slim-образе нет curl — проверка стандартной библиотекой Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Worker уведомлений (Глава 15, ADR 0019): очередь push, напоминания о ТО в 10:00 по Минску,
  # push по событиям тикетов. Тот же образ, что у backend; без FCM-ключа — фейковый push.
  notifications-worker:
    <<: *backend-app
    command: ["python", "-m", "app.workers.notifications"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker аналитики (Глава 16, ADR 0020): обновление витрины фактов дашборда раз в
  # ANALYTICS_REFRESH_SECONDS (300). Тот же образ, что у backend; отдельно от уведомлений.
  analytics-worker:
    <<: *backend-app
    command: ["python", "-m", "app.workers.analytics"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

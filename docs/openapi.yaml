          description: Список типов агрегатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateTypeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:

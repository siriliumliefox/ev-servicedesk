openapi: 3.0.3
info:
  title: EV-ServiceDesk API
  version: "1.1.0"
  description: >
    API дипломного проекта «EV-ServiceDesk» (ООО «ЕТСавтоГомель»).
    Контракты сервисов: Auth, Vehicle, Aggregates & Maintenance, Tickets,
    Knowledge Base, Notifications, Analytics.
  contact:
    name: Sirilium / EV-ServiceDesk
    email: dev@ev-servicedesk.example.com

servers:
  - url: https://api.ev-servicedesk.example.com/v1
    description: Production
  - url: https://staging-api.ev-servicedesk.example.com/v1
    description: Staging
  - url: http://localhost:4010
    description: Local mock (Prism, `npm run mock`) — параллельная разработка клиентов
  - url: http://localhost:8000/v1
    description: Local backend (uvicorn)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Vehicle
  - name: Aggregates
    description: >
      Aggregates & Maintenance Service: справочник агрегатов, регламенты ТО, пороги и
      статусы «светофор». Спецификация алгоритма и таблица тестовых сценариев (Глава 5,
      ADR 0009): docs/specs/AGGREGATE_STATUS_ALGORITHM.md,
      docs/specs/aggregate_status_scenarios.yaml.
    externalDocs:
      description: Спецификация алгоритма «светофор» и тестовые сценарии (Глава 5)
      url: https://github.com/siriliumliefox/ev-servicedesk/blob/develop/docs/specs/AGGREGATE_STATUS_ALGORITHM.md
  - name: Uploads
  - name: Tickets
  - name: KnowledgeBase
  - name: Notifications
  - name: Users
  - name: Analytics

paths:
  # ===================== AUTH SERVICE (шаг 2) =====================
  # Регистрация и логин объединены в единый passwordless-флоу по телефону:
  # request-code -> verify-code. Отдельного /auth/register нет намеренно —
  # verify-code сам создаёт User при первом входе (is_new_user в ответе).
  /auth/phone/request-code:
    post:
      tags: [Auth]
      summary: Запросить SMS-код для входа/регистрации по телефону
      operationId: requestPhoneCode
      description: Отправляет SMS с одноразовым кодом на указанный номер.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneRequestCode' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttl_seconds: { type: integer, example: 120 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/phone/verify-code:
    post:
      tags: [Auth]
      summary: Подтвердить SMS-код — вход или создание аккаунта (role=client)
      operationId: verifyPhoneCode
      description: >
        Проверяет код; создаёт пользователя при первом обращении.
        422 PD_CONSENT_REQUIRED — нет действующего согласия на обработку ПД и не передан pd_policy_version (99-З, ст. 5); либо иная ошибка валидации.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthTokens'
                  - type: object
                    properties:
                      is_new_user: { type: boolean }
                      user: { $ref: '#/components/schemas/UserPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить access-токен по refresh-токену
      operationId: refreshToken
      description: Выдаёт новую пару токенов взамен истекающего access-токена.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Отозвать refresh-токен (выход с устройства)
      operationId: logout
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Регистрация/авторизация (свой аккаунт)"]
      description: Инвалидирует refresh-токен текущего устройства.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Токен отозван }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/pd-consent:
    delete:
      tags: [Auth]
      summary: Отозвать согласие на обработку персональных данных
      operationId: withdrawPdConsent
      x-required-roles: [client]
      x-rbac-action: ["Отзыв согласия на обработку ПД"]
      description: >
        99-З, ст. 10: отзыв в любое время и в той же форме, в которой дано согласие
        (в приложении). Фиксирует pd_consent.withdrawn_at, отзывает все refresh-токены и
        ставит пользователя в очередь анонимизации: удаление ПД и уведомление
        субъекта не позднее 15 дней, если нет иных правовых оснований.
        409 PD_CONSENT_NOT_ACTIVE — действующего согласия нет (уже отозвано).
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '202': { description: "Согласие отозвано, удаление ПД запланировано" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/staff/login:
    post:
      tags: [Auth]
      summary: Логин по паролю для Инженера/Администратора
      operationId: staffLogin
      description: >
        Отдельный флоу от клиентского SMS-логина. Учётные записи engineer/admin
        создаются администратором вручную (Глава 22), клиент этим эндпоинтом
        не пользуется.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthTokens'
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/telegram/link:
    post:
      tags: [Auth]
      summary: Привязать Telegram к текущему аккаунту
      operationId: linkTelegram
      description: Сохраняет telegram_id для уже авторизованного пользователя.
      x-required-roles: [client]
      x-rbac-action: ["Регистрация/авторизация (свой аккаунт)"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramLinkRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Telegram привязан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== VEHICLE SERVICE (шаг 3) =====================
  # VIN-декодер вызывается ВНУТРИ POST /vehicles (серверная интеграция/мок),
  # отдельного публичного эндпоинта декодера нет. Fallback на случай, если
  # декодер недоступен/не распознал VIN: клиент передаёт vehicle_model_id
  # явно, выбрав модель через GET /vehicle-models.
  /vehicle-models:
    get:
      tags: [Vehicle]
      summary: Поиск моделей авто (fallback, если VIN-декодер не распознал VIN)
      operationId: searchVehicleModels
      description: Возвращает модели по подстроке бренда/модели для ручного выбора.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Добавление авто (VIN)", "CRUD регламентов ТО", "Публикация новостей/акций/прошивок"]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Подстрока по бренду/модели
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список моделей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vehicles:
    get:
      tags: [Vehicle]
      summary: Список авто текущего клиента (поддержка нескольких авто на аккаунт)
      operationId: listVehicles
      description: Возвращает все автомобили, привязанные к текущему клиенту.
      x-required-roles: [client]
      x-rbac-action: ["Просмотр авто (карточка)"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список авто
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Vehicle]
      summary: Добавить автомобиль по VIN
      operationId: createVehicle
      x-required-roles: [client]
      x-rbac-action: ["Добавление авто (VIN)"]
      description: >
        Марка/модель/комплектация определяются через VIN-декодер (или мок).
        Если декодер не смог распознать VIN — 422 с кодом VIN_DECODE_FAILED,
        и клиент должен передать vehicle_model_id вручную повторным запросом
        (Vehicle без VehicleModel создать нельзя — FK NOT NULL, Глава 2).
        409 — VIN уже привязан к другому аккаунту.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Автомобиль добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vehicles/{vehicleId}:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicle]
      summary: Карточка автомобиля (марка/модель/пробег)
      operationId: getVehicle
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр авто (карточка)"]
      description: >
        Не включает статусы агрегатов — зона ответственности Aggregates
        Service (шаг 4). RBAC-роль сама по себе не даёт доступа к ЛЮБОМУ
        авто: client видит только свои (owner-check), engineer — только
        авто, связанное с тикетом в его работе (object-level check поверх
        роли, не только middleware RBAC) — иначе IDOR (см. Глава 25).
        admin — без ограничений.
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Карточка автомобиля
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Vehicle]
      summary: Удалить авто из аккаунта (soft-delete, история сохраняется)
      operationId: deleteVehicle
      description: Помечает автомобиль неактивным, не удаляя связанные записи.
      x-required-roles: [client, admin]
      x-rbac-action: ["Удаление авто (soft-delete)"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicleId}/mileage:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Vehicle]
      summary: Обновить пробег
      operationId: updateVehicleMileage
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Обновление пробега авто"]
      description: >
        Отдельный узкий эндпоинт вместо общего PATCH /vehicles/{id} — VIN и
        модель после создания не редактируются, менять можно только пробег.
        Уменьшение пробега запрещено (Глава 2) → 409, а не 422: это конфликт
        с текущим состоянием ресурса, не ошибка формата входных данных.
        Object-level (RBAC-01): client — только свой автомобиль; engineer — только
        автомобиль из назначенного ему тикета; admin — любой. Иначе 403.
        409 — Новый пробег меньше текущего.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MileageUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пробег обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }


  /vehicles/{vehicleId}/mileage-corrections:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vehicle]
      summary: Исправить ошибочно введённый пробег (вниз)
      operationId: correctVehicleMileage
      x-required-roles: [admin]
      x-rbac-action: ["Исправление пробега вниз (с причиной, аудит)"]
      description: >
        Единственный способ уменьшить пробег (ADR 0006). Создаёт запись в append-only
        журнале VehicleMileageCorrection с причиной и автором; пробег меняется атомарно
        триггером БД. 409 — expected_current_mileage не совпал с текущим или mileage не меньше
        текущего (для увеличения — updateVehicleMileage).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MileageCorrectionRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Пробег исправлен, запись аудита создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /vehicles/{vehicleId}/maintenance-records:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicle]
      summary: История выполненных работ
      operationId: listMaintenanceRecords
      description: Постраничная история работ по автомобилю.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр авто (карточка)"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница истории ТО
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRecordList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Vehicle]
      summary: Зафиксировать выполненную работу
      operationId: createMaintenanceRecord
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Фиксация замены агрегата"]
      description: Клиент этим эндпоинтом не пользуется — история заполняется инженером/админом.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRecordCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Запись добавлена в историю
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== AGGREGATES & MAINTENANCE SERVICE (шаг 4) =====================
  /aggregate-types:
    get:
      tags: [Aggregates]
      summary: Справочник типов агрегатов
      operationId: listAggregateTypes
      description: Возвращает все типы агрегатов, включая добавленные администратором.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр справочника агрегатов"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список типов агрегатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateTypeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Aggregates]
      summary: Добавить тип агрегата в справочник
      operationId: createAggregateType
      x-required-roles: [admin]
      x-rbac-action: ["Изменение справочника агрегатов"]
      description: Расширение набора агрегатов на схеме без релиза кода (ТЗ, раздел 5).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AggregateTypeCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Тип добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /maintenance-regulations:
    get:
      tags: [Aggregates]
      summary: Регламенты ТО (по модели авто)
      operationId: listMaintenanceRegulations
      description: Возвращает активные (или все, если include_archived) регламенты.
      x-required-roles: [engineer, admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      parameters:
        - name: vehicle_model_id
          in: query
          required: false
          schema: { type: integer }
        - name: include_archived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список регламентов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRegulationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Aggregates]
      summary: Создать/пересмотреть регламент (upsert по модели+агрегату)
      operationId: reviseMaintenanceRegulation
      x-required-roles: [admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      description: >
        Не PATCH: если для пары (vehicle_model_id, aggregate_type_code) уже
        есть активный регламент, сервер атомарно архивирует его
        (is_archived=true) и создаёт новый активный — это и есть
        "удаление/изменение регламента не ломает историю" (Глава 2/12).
        Прямое редактирование интервала в старой записи не предусмотрено
        намеренно, чтобы не потерять исторические пороги для прошлых расчётов.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRegulationCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Новая активная версия регламента
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRegulation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /maintenance-regulations/{regulationId}:
    parameters:
      - { name: regulationId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Aggregates]
      summary: Архивировать регламент (без замены)
      operationId: archiveMaintenanceRegulation
      x-required-roles: [admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      description: Прекращает отслеживание пары модель+агрегат; история расчётов по прошлым авто не затрагивается.
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Архивирован }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicleId}/aggregate-statuses:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Aggregates]
      summary: Статусы всех агрегатов авто (для интерактивной схемы)
      operationId: listAggregateStatuses
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр статусов агрегатов"]
      description: >
        Алгоритм — docs/specs/AGGREGATE_STATUS_ALGORITHM.md (Глава 5, ADR 0009),
        сценарии — docs/specs/aggregate_status_scenarios.yaml. Возвращаются только
        агрегаты, для которых у модели авто есть активный регламент ТО. Отдельное
        значение status=unknown (не ошибка) — для агрегата без истории замены:
        edge-case "новый авто без истории" явно предусмотрен, а не считается сбоем.
        Статус вычисляется при каждом запросе по текущему регламенту и порогам
        (getAggregateStatusThresholds).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Статусы агрегатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatusList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vehicles/{vehicleId}/aggregate-statuses/{aggregateTypeCode}/replace:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
      - { name: aggregateTypeCode, in: path, required: true, schema: { type: string } }
    post:
      tags: [Aggregates]
      summary: Зафиксировать замену агрегата (сброс счётчика)
      operationId: replaceAggregateStatus
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Фиксация замены агрегата"]
      description: >
        Единственная точка входа для инженера при замене: сбрасывает счётчик
        (обновляет VehicleAggregateStatus) И создаёт соответствующую запись
        в истории ТО (MaintenanceRecord, Vehicle Service) одним вызовом —
        межсервисная синхронизация статуса и истории, чтобы инженер не
        забыл вызвать второй эндпоинт и данные не разошлись (реализация
        сцепки — Глава 17). Публичный POST .../maintenance-records
        (Vehicle Service, шаг 3) остаётся для работ БЕЗ привязки к
        конкретному отслеживаемому агрегату.
        Правила (docs/specs/AGGREGATE_STATUS_ALGORITHM.md, §3–4): replaced_at в будущем →
        422; mileage_at_replacement больше текущего пробега авто → 409 (сначала
        updateVehicleMileage). Счётчик сбрасывается, только если дата замены не раньше
        текущей последней замены; замена задним числом попадает лишь в историю ТО,
        а ответ содержит прежний статус.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AggregateReplaceRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Статус сброшен на 🟢
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /aggregate-status-thresholds:
    get:
      tags: [Aggregates]
      summary: Пороги статусов «светофор»
      operationId: getAggregateStatusThresholds
      description: >
        Глобальные пороги (ADR 0009): green — меньше yellow_from_percent, yellow — от
        yellow_from_percent до red_above_percent включительно, red — больше
        red_above_percent. Клиенту не нужны: статус вычисляет сервер.
      x-required-roles: [engineer, admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Текущие пороги
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatusThresholds' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Aggregates]
      summary: Изменить пороги статусов «светофор»
      operationId: updateAggregateStatusThresholds
      description: >
        Заменяет оба порога. 422 — нарушено 1 ≤ yellow_from_percent < red_above_percent ≤ 200.
        Новые пороги сразу применяются ко всем статусам; история прошлых порогов не ведётся.
      x-required-roles: [admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AggregateStatusThresholdsUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пороги обновлены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatusThresholds' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== UPLOADS (общая утилита для Tickets/KB) =====================
  /uploads/presign:
    post:
      tags: [Uploads]
      summary: Получить presigned URL для прямой загрузки файла в S3
      operationId: createPresignedUpload
      x-required-roles: [client, engineer]
      x-rbac-action: ["Создание тикета", "Сообщения в чате тикета"]
      description: >
        Клиент загружает файл напрямую в S3 по upload_url, минуя API-сервер
        (не гоняем бинарные данные через backend). file_url затем передаётся
        в теле создания тикета/сообщения как ссылка на вложение.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: URL для загрузки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== TICKETS SERVICE (шаг 5) =====================
  /tickets:
    get:
      tags: [Tickets]
      summary: Список тикетов (канбан-доска инженера / история клиента)
      operationId: listTickets
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр тикета"]
      description: >
        client — только свои тикеты. engineer/admin — фильтры по

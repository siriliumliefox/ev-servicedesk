          description: Учётная запись создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Users]
      summary: Карточка пользователя
      operationId: getUser
      description: Просмотр любого пользователя администратором.
      x-required-roles: [admin]
      x-rbac-action: ["Управление пользователями и ролями"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Сменить роль или заблокировать/разблокировать пользователя
      operationId: updateUser
      description: >
        Смена роли client ↔ staff не поддерживается (у клиента нет пароля) — 409 ROLE_CHANGE_NOT_ALLOWED;
        допустимо engineer ↔ admin. is_active=false блокирует вход и отзывает refresh-токены.
        409 LAST_ADMIN — нельзя понизить или заблокировать последнего активного администратора.
      x-required-roles: [admin]
      x-rbac-action: ["Управление пользователями и ролями"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== ANALYTICS SERVICE (A-05, A-06; реализация — Глава 16) =====================
  /analytics/ticket-resolution:
    get:
      tags: [Analytics]
      summary: Время реакции и закрытия тикетов (A-05)
      operationId: getTicketResolutionStats
      description: >
        Считается по ticket.created_at, first_response_at, resolved_at за период [date_from, date_to]
        (по дате создания тикета, включительно). 422 — date_from > date_to или период длиннее 366 дней.
      x-required-roles: [admin]
      x-rbac-action: ["Просмотр аналитики (дашборд)"]
      parameters:
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - name: vehicle_model_id
          in: query
          schema: { type: integer }
        - name: category
          in: query
          schema: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Показатели за период
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResolutionStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/problem-models:
    get:
      tags: [Analytics]
      summary: Проблемные модели — тикеты по моделям и категориям (A-06)
      operationId: listProblemModels
      description: Модели, отсортированные по убыванию tickets_total за период. Модели без тикетов не включаются.
      x-required-roles: [admin]
      x-rbac-action: ["Просмотр аналитики (дашборд)"]
      parameters:
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница моделей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemModelStatsList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/maintenance-conversion:
    get:
      tags: [Analytics]
      summary: Конверсия в ТО (A-06)
      operationId: getMaintenanceConversionStats
      description: >
        Две воронки за период: тикеты → работы ТО (maintenance_record.ticket_id) и уведомления
        type=maintenance → открытие push (notification_delivery.opened_at) → работа ТО по авто
        получателя в течение 30 дней после уведомления. Rate = null, если знаменатель 0.
      x-required-roles: [admin]
      x-rbac-action: ["Просмотр аналитики (дашборд)"]
      parameters:
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - name: vehicle_model_id
          in: query
          schema: { type: integer }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Показатели конверсии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceConversionStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DateFromParam:
      name: date_from
      in: query
      required: true
      schema: { type: string, format: date }
      description: Начало периода (включительно)
    DateToParam:
      name: date_to
      in: query
      required: true
      schema: { type: string, format: date }
      description: Конец периода (включительно)

  schemas:
    # --- Единый формат ошибок (шаг 6, материализован в шаге 1) ---
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машиночитаемый код ошибки, напр. VALIDATION_ERROR, NOT_FOUND
              example: VALIDATION_ERROR
            message:
              type: string
              description: Человекочитаемое сообщение (для логов/поддержки, не для UI напрямую)
            details:
              type: object
              nullable: true
              description: Доп. контекст (напр. какое поле не прошло валидацию)

    # --- Единый формат пагинации (шаг 6) ---
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }

    # --- Auth (шаг 2) ---
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      maxLength: 16
      example: "+375291234567"
      description: Телефон в формате E.164 (CHECK ck_app_user_phone_e164, Глава 2). ПД по N-07.

    PhoneRequestCode:
      type: object
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }

    VerifyCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }
        code: { type: string, example: "1234" }
        pd_policy_version:
          type: string
          maxLength: 20
          nullable: true
          example: "2026-10"
          description: >-
            Редакция политики обработки ПД, с которой пользователь согласился в приложении.
            Обязательна при первой регистрации и при отсутствии действующего согласия;
            фиксируется в pd_consent с датой (99-З, ст. 5). Без согласия — 422 PD_CONSENT_REQUIRED.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    StaffLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }
        password: { type: string, format: password }

    TelegramLinkRequest:
      type: object
      required: [telegram_id]
      properties:
        telegram_id: { type: string }

    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: "TTL access-токена, сек." }

    UserPublic:
      type: object
      required: [id, phone, role, is_active, created_at]
      properties:
        id: { type: integer }
        # Формат PhoneE164 — без allOf: в OpenAPI 3.0 nullable рядом с allOf не допускает null.
        phone:
          type: string
          nullable: true
          pattern: '^\+[1-9][0-9]{7,14}$'
          maxLength: 16
          example: "+375291234567"
          description: >-
            E.164 (как PhoneE164); null — анонимизирован (ПД удалены по 99-З, ADR 0006) или скрыт
            от клиента: автор-сотрудник в TicketMessage.author (ADR 0017 п. 12). Уточнено в 1.4.0.
        role: { type: string, enum: [client, engineer, admin] }
        is_active: { type: boolean, description: "false — вход заблокирован администратором" }
        telegram_id:
          type: string
          nullable: true
          description: >-
            null — не привязан, анонимизирован или скрыт от клиента: автор-сотрудник в
            TicketMessage.author (ADR 0017 п. 12). Уточнено в 1.4.0.
        created_at: { type: string, format: date-time }

    # --- Vehicle (шаг 3) ---
    # VehicleModel — с id, для поиска/выбора модели вручную (fallback VIN-декодера).
    VehicleModel:
      type: object
      required: [id, brand, model]
      properties:
        id: { type: integer }
        brand: { type: string, example: "Zeekr" }
        model: { type: string, example: "001" }
        trim: { type: string, nullable: true }

    # VehicleModelInfo — без id, только для отображения внутри карточки Vehicle
    # (после создания клиенту не нужно повторно ссылаться на модель по id).
    VehicleModelInfo:
      type: object
      required: [brand, model]
      properties:
        brand: { type: string }
        model: { type: string }
        trim: { type: string, nullable: true }

    VehicleCreateRequest:
      type: object
      required: [vin]
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
          pattern: '^[A-HJ-NPR-Z0-9]{17}$'
          example: "LSVAU2183R2100001"
        vehicle_model_id:
          type: integer
          nullable: true
          description: Явное указание модели, если VIN-декодер не смог распознать авто

    Vehicle:
      type: object
      required: [id, vin, mileage, vehicle_model, is_active, created_at]
      properties:
        id: { type: integer }
        vin: { type: string, minLength: 17, maxLength: 17 }
        mileage: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        vehicle_model: { $ref: '#/components/schemas/VehicleModelInfo' }
        current_firmware_version:
          type: string
          nullable: true
          description: Версия прошивки из последнего зафиксированного FirmwareRelease (см. PATCH /vehicles/{id}/firmware)
        created_at: { type: string, format: date-time }

    MileageUpdateRequest:
      type: object
      required: [mileage]
      properties:
        mileage: { type: integer, minimum: 0 }

    MileageCorrectionRequest:
      type: object
      required: [expected_current_mileage, mileage, reason]
      properties:
        expected_current_mileage:
          type: integer
          minimum: 0
          description: Пробег, который видел администратор (защита от гонки → 409 при расхождении).
        mileage: { type: integer, minimum: 0, description: "Новое значение, строго меньше текущего" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    # aggregate_type_code (не id) — публичный контракт ссылается на стабильный
    # бизнес-ключ справочника AggregateType, а не на внутренний surrogate id (Глава 2).
    MaintenanceRecord:
      type: object
      required: [id, performed_at, mileage_at_service]
      properties:
        id: { type: integer }
        aggregate_type_code: { type: string, nullable: true }
        performed_by: { $ref: '#/components/schemas/UserPublic' }
        performed_at: { type: string, format: date }
        mileage_at_service: { type: integer }
        description: { type: string, nullable: true }

    MaintenanceRecordCreateRequest:
      type: object
      required: [performed_at, mileage_at_service]
      properties:
        aggregate_type_code:
          type: string
          nullable: true
          description: Код агрегата (справочник AggregateType), либо null для общей работы
        performed_at: { type: string, format: date }
        mileage_at_service: { type: integer, minimum: 0 }
        description: { type: string, nullable: true, maxLength: 255 }

    MaintenanceRecordList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceRecord' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- Aggregates & Maintenance (шаг 4) ---
    AggregateType:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: "engine_oil" }
        name: { type: string, example: "Масло в двигателе" }

    AggregateTypeCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 50, pattern: '^[a-z][a-z0-9_]{1,49}$', example: "brake_fluid" }
        name: { type: string, minLength: 1, maxLength: 100, example: "Тормозная жидкость" }

    MaintenanceRegulation:
      type: object
      required: [id, vehicle_model_id, aggregate_type_code, is_archived]
      properties:
        id: { type: integer }
        vehicle_model_id: { type: integer }
        aggregate_type_code: { type: string }
        interval_km: { type: integer, nullable: true }
        interval_months: { type: integer, nullable: true }
        is_archived: { type: boolean }

    MaintenanceRegulationCreateRequest:
      type: object
      required: [vehicle_model_id, aggregate_type_code]
      description: Нужно указать interval_km и/или interval_months — хотя бы одно.
      properties:
        vehicle_model_id: { type: integer }
        aggregate_type_code: { type: string }
        interval_km: { type: integer, nullable: true, minimum: 1 }
        interval_months: { type: integer, nullable: true, minimum: 1 }

    AggregateStatus:
      type: object
      required: [aggregate_type_code, aggregate_type_name, status]
      properties:
        aggregate_type_code: { type: string }
        aggregate_type_name: { type: string }
        status:
          type: string
          enum: [green, yellow, red, unknown]
          description: >
            По точному проценту выработки p и порогам (по умолчанию 70/100):
            green p < 70, yellow 70 ≤ p ≤ 100, red p > 100;
            unknown — нет истории замены (не ошибка, Глава 5) или, только в ответе
            replaceAggregateStatus, нет активного регламента (1.3.2, ADR 0016).
            Правила — docs/specs/AGGREGATE_STATUS_ALGORITHM.md.
        percentage:
          type: number
          nullable: true
          description: >
            % выработки интервала — худший из пробега и времени, усечён вниз до 0.1
            (только для показа, цвет определяет status). null при status=unknown.
        last_replaced_at: { type: string, format: date, nullable: true }
        last_replaced_mileage: { type: integer, nullable: true }
        remaining_km:
          type: integer
          nullable: true
          description: Остаток до конца интервала по пробегу; < 0 — перепробег; null — нет интервала/данных.
        remaining_days:
          type: integer
          nullable: true
          description: >
            Остаток до конца интервала по времени в днях; < 0 — просрочено; null — нет
            интервала/данных. Добавлено в 1.1.0.

    AggregateStatusThresholds:
      type: object
      required: [yellow_from_percent, red_above_percent, updated_at]
      properties:
        yellow_from_percent: { type: integer, minimum: 1, maximum: 199, example: 70 }
        red_above_percent: { type: integer, minimum: 2, maximum: 200, example: 100 }
        updated_at: { type: string, format: date-time }
        updated_by_user_id:
          type: integer
          nullable: true
          description: Кто изменил последним; null — значения по умолчанию из миграции.
        reminder_before_km:
          type: integer
          minimum: 1
          maximum: 100000
          example: 1000
          description: >-
            Напоминание о ТО, когда до порога «требуется замена» осталось не больше N км
            (N-10). Добавлено в 1.6.0 (ADR 0019 п. 5).
        reminder_before_days:
          type: integer
          minimum: 1
          maximum: 365
          example: 14
          description: То же по времени — не больше N дней. Добавлено в 1.6.0.

    AggregateStatusThresholdsUpdateRequest:
      type: object
      required: [yellow_from_percent, red_above_percent]
      description: >-
        1 ≤ yellow_from_percent < red_above_percent ≤ 200, иначе 422. reminder_before_km и
        reminder_before_days необязательны (не переданы — не меняются), добавлены в 1.6.0.
      properties:
        yellow_from_percent: { type: integer, minimum: 1, maximum: 199 }
        red_above_percent: { type: integer, minimum: 2, maximum: 200 }
        reminder_before_km: { type: integer, minimum: 1, maximum: 100000 }
        reminder_before_days: { type: integer, minimum: 1, maximum: 365 }

    AggregateReplaceRequest:
      type: object
      required: [replaced_at, mileage_at_replacement]
      properties:
        replaced_at: { type: string, format: date }
        mileage_at_replacement: { type: integer, minimum: 0 }
        description:
          type: string
          nullable: true
          description: Пробрасывается в связанную запись MaintenanceRecord

    # --- Uploads ---
    PresignRequest:
      type: object
      required: [file_name, file_type]
      properties:
        file_name:
          type: string
          example: "photo.jpg"
          description: >-
            Используется только расширение — ключ объекта uploads/{user_id}/{uuid}{расширение};
            имя может содержать ПД и не хранится (ADR 0017). Уточнено в 1.4.0.
        file_type: { type: string, enum: [photo, video] }

    PresignResponse:
      type: object
      required: [upload_url, file_url, expires_at]
      properties:
        upload_url:
          type: string
          description: >-
            PUT сюда бинарные данные напрямую в S3. Presigned PUT, действует до expires_at
            (15 минут); MIME к подписи не привязан (уточнено в 1.4.0).
        file_url:
          type: string
          description: >-
            Идентификатор загруженного объекта — передать в attachments. Не публичная ссылка:
            backend хранит ключ объекта S3 (ticket_attachment.object_key) и выдаёт
            presigned URL при чтении (ADR 0004).
        expires_at: { type: string, format: date-time, description: "Срок действия upload_url — 15 минут" }

    # --- Tickets (шаг 5) ---
    TicketAttachmentInput:
      type: object
      required: [file_url, file_type]
      properties:
        file_url:
          type: string
          description: >-
            file_url из PresignResponse. Backend проверяет, что объект загружен текущим
            пользователем, и сохраняет ключ объекта, MIME и размер (ADR 0004).
            В ответах (TicketDetail, TicketMessage) — presigned GET URL на 15 минут (ADR 0017,
            уточнено в 1.4.0).
        file_type: { type: string, enum: [photo, video] }

    TicketCreateRequest:
      type: object
      required: [vehicle_id, category, description]
      properties:
        vehicle_id: { type: integer }
        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        description:
          type: string
          description: >-
            1…4000 символов после обрезки пробелов по краям, иначе 422 (проверяет сервер,
            ADR 0017 п. 13). Уточнено в 1.4.0.
        source_article_id: { type: integer, nullable: true }
        source_node_id: { type: integer, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/TicketAttachmentInput' }

    Ticket:
      type: object
      description: >-
        Элемент списка тикетов. vehicle_model (модель авто тикета) и summary — для карточки
        канбана и списка клиента; добавлены в 1.4.0 (ADR 0017, закрывает ADR 0012 п. 5).
      required: [id, category, status, sla_due_at, is_overdue, created_at, vehicle_model, summary]
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        vehicle_model: { $ref: '#/components/schemas/VehicleModelInfo' }
        summary:
          type: string
          maxLength: 140
          description: Первые 140 символов описания тикета (description). Добавлено в 1.4.0.
        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        status: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }
        assigned_engineer_id: { type: integer, nullable: true }
        sla_due_at:
          type: string
          format: date-time
          description: >-
            Срок решения: created_at + норматив категории (тег Tickets); вычисляется при
            создании и не меняется (ADR 0017). Уточнено в 1.4.0.
        is_overdue: { type: boolean, description: "Вычисляемое поле: now() > sla_due_at и status != resolved" }
        created_at: { type: string, format: date-time }
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Заполнено тогда и только тогда, когда status = resolved (A-05).

    VehicleContext:
      type: object
      description: Автопривязанный контекст авто на момент открытия карточки тикета.
      properties:
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        aggregate_statuses:
          type: array
          items: { $ref: '#/components/schemas/AggregateStatus' }

    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [firmware_version_at_creation, source_article]
          properties:
            description: { type: string }
            firmware_version_at_creation:
              type: string
              nullable: true
              description: >-
                Версия прошивки авто на момент создания тикета (снимок, N-09); null — прошивка
                не была зафиксирована. Текущая прошивка — vehicle_context.vehicle.current_firmware_version.
                Добавлено в 1.4.0 (ADR 0017).
            source_article:
              type: object
              nullable: true
              description: >-
                «Пометка» эскалации из дерева решений: статья в версии на момент эскалации
                (ADR 0018 п. 11); null — тикет создан не из базы знаний. Добавлено в 1.5.0.
              required: [id, title, version]
              properties:
                id: { type: integer }
                title: { type: string, description: Заголовок в этой версии. }
                version: { type: integer }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/TicketAttachmentInput' }
            vehicle_context: { $ref: '#/components/schemas/VehicleContext' }

    TicketList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TicketMessageCreateRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: >-
            1…4000 символов после обрезки пробелов по краям, иначе 422 (проверяет сервер,
            ADR 0017 п. 13). Уточнено в 1.4.0.
        attachments:
          type: array
          items: { $ref: '#/components/schemas/TicketAttachmentInput' }

    TicketMessage:
      type: object
      description: >-
        Сообщение чата тикета. Клиенту автор-сотрудник (engineer/admin) отдаётся с phone и
        telegram_id = null (ADR 0017 п. 12). Уточнено в 1.4.0.
      required: [id, author, body, created_at]
      properties:
        id: { type: integer }
        author: { $ref: '#/components/schemas/UserPublic' }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/TicketAttachmentInput' }
        created_at: { type: string, format: date-time }

    TicketMessageList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TicketMessage' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- Knowledge Base (шаг 5) ---
    KnowledgeArticleCreateRequest:
      type: object
      required: [article_type, title, content]
      properties:
        vehicle_model_id: { type: integer, nullable: true }
        firmware_release_id:
          type: integer
          nullable: true
          description: Статья под версию прошивки (C-06); требует vehicle_model_id той же модели.
        article_type: { type: string, enum: [guide, troubleshooting] }
        category:
          type: string
          nullable: true
          enum: [navigation, audio, sim, app_crash, maintenance, null]
          description: Обязательна для troubleshooting (иначе 422). Добавлено в 1.5.0.
        title: { type: string, maxLength: 200 }
        content:
          type: string
          description: Markdown (CommonMark) без HTML, до 50 000 символов (проверяет сервер, 1.5.0).

    KnowledgeArticleUpdateRequest:
      type: object
      description: Меняются только переданные поля. Расширено в 1.5.0.
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string }
        category:
          type: string
          nullable: true
          enum: [navigation, audio, sim, app_crash, maintenance, null]
          description: У troubleshooting не может быть null. Добавлено в 1.5.0.
        vehicle_model_id: { type: integer, nullable: true, description: Добавлено в 1.5.0. }
        firmware_release_id: { type: integer, nullable: true, description: Добавлено в 1.5.0. }
        is_published: { type: boolean }

    KnowledgeArticleRevisionSummary:
      type: object
      description: Опубликованная редакция статьи в истории версий. Добавлено в 1.5.0.
      required: [version, title, published_at]
      properties:
        version: { type: integer }
        title: { type: string }
        published_at: { type: string, format: date-time }

    KnowledgeArticleRevision:
      description: >-
        Снимок опубликованной редакции: содержание и дерево решений на момент публикации.
        Добавлено в 1.5.0 (ADR 0018 п. 1).
      allOf:
        - $ref: '#/components/schemas/KnowledgeArticleRevisionSummary'
        - type: object
          required:
            [article_id, content, category, vehicle_model_id, firmware_release_id, decision_tree]
          properties:
            article_id: { type: integer }
            content: { type: string }
            category:
              type: string
              nullable: true
              enum: [navigation, audio, sim, app_crash, maintenance, null]
            vehicle_model_id: { type: integer, nullable: true }
            firmware_release_id: { type: integer, nullable: true }
            decision_tree:
              type: array
              items: { $ref: '#/components/schemas/DecisionTreeNode' }

    KnowledgeArticleRevisionList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeArticleRevisionSummary' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    KnowledgeArticle:
      type: object
      required: [id, article_type, category, title, version, is_published, updated_at]
      properties:
        id: { type: integer }
        vehicle_model_id: { type: integer, nullable: true }
        firmware_release_id:
          type: integer
          nullable: true
          description: Статья под версию прошивки (C-06); требует vehicle_model_id той же модели.
        article_type: { type: string, enum: [guide, troubleshooting] }
        category:
          type: string
          nullable: true
          enum: [navigation, audio, sim, app_crash, maintenance, null]
          description: >-
            Категория ошибки (= категория тикета при эскалации); у troubleshooting всегда
            задана. Добавлено в 1.5.0.
        title: { type: string }
        content: { type: string, description: Markdown (CommonMark) без HTML. }
        version:
          type: integer
          description: >-
            Номер последней опубликованной редакции; у черновика без публикаций — 1.
            Уточнено в 1.5.0 (ADR 0018).
        is_published: { type: boolean }
        updated_at: { type: string, format: date-time, description: Добавлено в 1.5.0. }

    KnowledgeArticleList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeArticle' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    DecisionTreeOption:
      type: object
      required: [label, next_node_id]
      properties:
        label: { type: string, example: "Экран всё ещё завис" }
        next_node_id:
          type: integer
          nullable: true
          description: >-
            Узел этой же статьи. Уточнено в 1.5.0 (ADR 0018 п. 3): null сервер отклоняет (422) —
            узел эскалации — финал с кнопкой «Создать обращение», его варианты ведут к узлам;
            в ответах null не бывает.

    DecisionTreeNodeCreateRequest:
      type: object
      required: [question_text, is_root, is_escalation]
      properties:
        question_text: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/DecisionTreeOption' }
        is_root: { type: boolean }
        is_escalation: { type: boolean }

    DecisionTreeNode:
      allOf:
        - $ref: '#/components/schemas/DecisionTreeNodeCreateRequest'
        - type: object
          required: [id, article_id]
          properties:
            id: { type: integer }
            article_id: { type: integer }

    DecisionTreeValidationResult:
      type: object
      required: [is_valid, issues]
      properties:
        is_valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [problem]
            properties:
              node_id:
                type: integer
                description: Отсутствует у проблем дерева целиком (NO_ROOT, NO_ESCALATION).
              problem:
                type: string
                enum:
                  [DEAD_END, UNREACHABLE, MULTIPLE_ROOTS, BROKEN_REFERENCE, NO_ROOT, NO_ESCALATION]
                description: NO_ROOT и NO_ESCALATION добавлены в 1.5.0 (ADR 0018 п. 4).

    # --- Notifications & Firmware (шаг 5) ---
    NotificationCreateRequest:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [firmware, maintenance, news, promo] }
        target_vehicle_model_id: { type: integer, nullable: true, description: "null = все модели" }
        firmware_release_id: { type: integer, nullable: true }
        message: { type: string }

    Notification:
      type: object
      required: [id, type, message, created_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [firmware, maintenance, news, promo] }
        target_vehicle_model_id: { type: integer, nullable: true }
        firmware_release_id: { type: integer, nullable: true }
        vehicle_id:
          type: integer
          nullable: true
          description: Авто напоминания о ТО (type=maintenance), иначе null. Добавлено в 1.6.0.
        aggregate_type_id:
          type: integer
          nullable: true
          description: Агрегат напоминания о ТО (type=maintenance), иначе null. Добавлено в 1.6.0.
        message: { type: string }
        created_at: { type: string, format: date-time }

    NotificationListItem:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            read_at: { type: string, format: date-time, nullable: true, description: "NotificationRecipient.read_at" }

    NotificationList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationListItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    NotificationOpenedRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096, description: "FCM-токен устройства, на котором открыт push" }

    NotificationDeliveryStats:
      type: object
      required: [recipients, delivered, failed, opened, read]
      description: Добавлено в 1.6.0 (ADR 0019 п. 12).
      properties:
        recipients: { type: integer, description: Клиентов в аудитории }
        delivered: { type: integer, description: "Доставок, принятых FCM" }
        failed: { type: integer, description: Доставок с окончательной ошибкой }
        opened: { type: integer, description: "Доставок, открытых на устройстве" }
        read: { type: integer, description: "Клиентов, прочитавших уведомление" }

    PublishedNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          required: [stats]
          properties:
            stats: { $ref: '#/components/schemas/NotificationDeliveryStats' }

    PublishedNotificationList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublishedNotification' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    NotificationAudiencePreview:
      type: object
      required: [recipients, devices]
      description: Добавлено в 1.6.0 (ADR 0019 п. 12, U-45).
      properties:
        recipients: { type: integer, description: Клиентов получат уведомление в ленту }
        devices: { type: integer, description: Активных push-токенов этих клиентов }

    FirmwareReleaseCreateRequest:
      type: object
      required: [vehicle_model_id, version, released_at]
      properties:
        vehicle_model_id: { type: integer }
        version: { type: string, minLength: 1, maxLength: 50, example: "2.4.1" }
        released_at: { type: string, format: date }

    FirmwareRelease:
      type: object
      required: [id, vehicle_model_id, version, released_at]
      properties:
        id: { type: integer }
        vehicle_model_id: { type: integer }
        version: { type: string }
        released_at: { type: string, format: date }

    # --- Коллекции с единой пагинацией (Глава 3: пагинация на всех коллекциях) ---
    VehicleModelList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VehicleModel' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    VehicleList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AggregateTypeList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AggregateType' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    MaintenanceRegulationList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceRegulation' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AggregateStatusList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AggregateStatus' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    DecisionTreeNodeList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DecisionTreeNode' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    FirmwareReleaseList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FirmwareRelease' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    UserList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserPublic' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- Тела запросов, ранее описанные inline ---
    TicketStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }

    TicketAssignRequest:
      type: object
      required: [assigned_engineer_id]
      properties:
        assigned_engineer_id: { type: integer, nullable: true, description: "null — снять инженера" }

    PushTokenRegisterRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096 }

    VehicleFirmwareUpdateRequest:
      type: object
      required: [firmware_release_id]
      properties:
        firmware_release_id: { type: integer, description: "Релиз той же модели, что и авто (иначе 422)" }

    # --- Users (A-04) ---
    StaffUserCreateRequest:
      type: object
      required: [phone, role, password]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }
        role: { type: string, enum: [engineer, admin] }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }

    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        role: { type: string, enum: [engineer, admin] }
        is_active: { type: boolean }

    # --- Analytics (A-05, A-06) ---
    TicketResolutionStats:
      type: object
      required: [date_from, date_to, tickets_created, tickets_resolved, tickets_resolved_overdue,
                 avg_first_response_hours, avg_resolution_hours, median_resolution_hours]
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        tickets_created: { type: integer, minimum: 0 }
        tickets_resolved: { type: integer, minimum: 0 }
        tickets_resolved_overdue: { type: integer, minimum: 0, description: "resolved_at > sla_due_at" }
        avg_first_response_hours: { type: number, nullable: true }
        avg_resolution_hours: { type: number, nullable: true, description: "Среднее resolved_at − created_at (A-05)" }
        median_resolution_hours: { type: number, nullable: true }

    TicketCategoryCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        count: { type: integer, minimum: 0 }

    ProblemModelStats:
      type: object
      required: [vehicle_model, tickets_total, vehicles_total, by_category]
      properties:
        vehicle_model: { $ref: '#/components/schemas/VehicleModel' }
        tickets_total: { type: integer, minimum: 0 }
        vehicles_total: { type: integer, minimum: 0, description: "Активные авто модели — для нормирования" }
        by_category:
          type: array
          items: { $ref: '#/components/schemas/TicketCategoryCount' }

    ProblemModelStatsList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProblemModelStats' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    MaintenanceConversionStats:
      type: object
      required: [date_from, date_to, tickets_total, tickets_with_maintenance, ticket_to_maintenance_rate,
                 notifications_recipients, notifications_opened, recipients_with_maintenance,
                 notification_to_maintenance_rate]
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        tickets_total: { type: integer, minimum: 0 }
        tickets_with_maintenance: { type: integer, minimum: 0 }
        ticket_to_maintenance_rate: { type: number, minimum: 0, maximum: 1, nullable: true }
        notifications_recipients: { type: integer, minimum: 0, description: "Получатели уведомлений type=maintenance" }
        notifications_opened: { type: integer, minimum: 0 }
        recipients_with_maintenance: { type: integer, minimum: 0 }
        notification_to_maintenance_rate: { type: number, minimum: 0, maximum: 1, nullable: true }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Не авторизован (нет/просрочен токен)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Нет доступа (RBAC)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Конфликт состояния (напр. VIN уже привязан)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Превышен лимит запросов (напр. попытки SMS-кода)
      headers:
        Retry-After:
          description: Секунд до повторной попытки (добавлено в 1.2.0)
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

          description: Тип добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /maintenance-regulations:
    get:
      tags: [Aggregates]
      summary: Регламенты ТО (по модели авто)
      operationId: listMaintenanceRegulations
      description: Возвращает активные (или все, если include_archived) регламенты.
      x-required-roles: [engineer, admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      parameters:
        - name: vehicle_model_id
          in: query
          required: false
          schema: { type: integer }
        - name: include_archived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список регламентов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRegulationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Aggregates]
      summary: Создать/пересмотреть регламент (upsert по модели+агрегату)
      operationId: reviseMaintenanceRegulation
      x-required-roles: [admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      description: >
        Не PATCH: если для пары (vehicle_model_id, aggregate_type_code) уже
        есть активный регламент, сервер атомарно архивирует его
        (is_archived=true) и создаёт новый активный — это и есть
        "удаление/изменение регламента не ломает историю" (Глава 2/12).
        Прямое редактирование интервала в старой записи не предусмотрено
        намеренно, чтобы не потерять исторические пороги для прошлых расчётов.
        Новая версия создаётся всегда, даже с теми же интервалами; одновременные
        пересмотры выполняются по очереди, побеждает последний. 422:
        VEHICLE_MODEL_NOT_FOUND, AGGREGATE_TYPE_NOT_FOUND, нет ни одного интервала,
        interval_months > 1200. Уточнено в 1.3.2 (ADR 0016).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRegulationCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Новая активная версия регламента
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRegulation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /maintenance-regulations/{regulationId}:
    parameters:
      - { name: regulationId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Aggregates]
      summary: Архивировать регламент (без замены)
      operationId: archiveMaintenanceRegulation
      x-required-roles: [admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      description: >
        Прекращает отслеживание пары модель+агрегат; история расчётов по прошлым авто
        не затрагивается. Архивный или несуществующий регламент — 404
        REGULATION_NOT_FOUND. Уточнено в 1.3.2 (ADR 0016).
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Архивирован }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicleId}/aggregate-statuses:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Aggregates]
      summary: Статусы всех агрегатов авто (для интерактивной схемы)
      operationId: listAggregateStatuses
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр статусов агрегатов"]
      description: >
        Алгоритм — docs/specs/AGGREGATE_STATUS_ALGORITHM.md (Глава 5, ADR 0009),
        сценарии — docs/specs/aggregate_status_scenarios.yaml. Возвращаются только
        агрегаты, для которых у модели авто есть активный регламент ТО. Отдельное
        значение status=unknown (не ошибка) — для агрегата без истории замены:
        edge-case "новый авто без истории" явно предусмотрен, а не считается сбоем.
        Статус вычисляется при каждом запросе по текущему регламенту и порогам
        (getAggregateStatusThresholds).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Статусы агрегатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatusList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vehicles/{vehicleId}/aggregate-statuses/{aggregateTypeCode}/replace:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
      - { name: aggregateTypeCode, in: path, required: true, schema: { type: string } }
    post:
      tags: [Aggregates]
      summary: Зафиксировать замену агрегата (сброс счётчика)
      operationId: replaceAggregateStatus
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Фиксация замены агрегата"]
      description: >
        Единственная точка входа для инженера при замене: сбрасывает счётчик
        (обновляет VehicleAggregateStatus) И создаёт соответствующую запись
        в истории ТО (MaintenanceRecord, Vehicle Service) одним вызовом —
        межсервисная синхронизация статуса и истории, чтобы инженер не
        забыл вызвать второй эндпоинт и данные не разошлись (реализация
        сцепки — Глава 17). Публичный POST .../maintenance-records
        (Vehicle Service, шаг 3) остаётся для работ БЕЗ привязки к
        конкретному отслеживаемому агрегату.
        Правила (docs/specs/AGGREGATE_STATUS_ALGORITHM.md, §3–4): replaced_at в будущем →
        422; mileage_at_replacement больше текущего пробега авто → 409 (сначала
        updateVehicleMileage). Счётчик сбрасывается, только если дата замены не раньше
        текущей последней замены; замена задним числом попадает лишь в историю ТО,
        а ответ содержит прежний статус.
        Уточнено в 1.3.2 (ADR 0016): 422 REPLACED_AT_IN_FUTURE (дата позже сегодняшней
        по Europe/Minsk); 409 MILEAGE_AHEAD_OF_VEHICLE (details.current_mileage), пробег
        авто не поднимается; 404 AGGREGATE_TYPE_NOT_FOUND — неизвестный код агрегата.
        Без активного регламента замена всё равно фиксируется: 200 со status=unknown
        (percentage и остатки null, last_replaced_* заполнены). Доступ — как у изменения
        авто: engineer — по своему тикету не в resolved, удалённое авто — 403/404.
        Повтор того же запроса создаёт ещё одну запись в истории ТО.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AggregateReplaceRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Статус сброшен на 🟢
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /aggregate-status-thresholds:
    get:
      tags: [Aggregates]
      summary: Пороги статусов «светофор»
      operationId: getAggregateStatusThresholds
      description: >
        Глобальные пороги (ADR 0009): green — меньше yellow_from_percent, yellow — от
        yellow_from_percent до red_above_percent включительно, red — больше
        red_above_percent. Клиенту не нужны: статус вычисляет сервер.
      x-required-roles: [engineer, admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Текущие пороги
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatusThresholds' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Aggregates]
      summary: Изменить пороги статусов «светофор»
      operationId: updateAggregateStatusThresholds
      description: >
        Заменяет оба порога. 422 — нарушено 1 ≤ yellow_from_percent < red_above_percent ≤ 200.
        Новые пороги сразу применяются ко всем статусам; история прошлых порогов не ведётся.
      x-required-roles: [admin]
      x-rbac-action: ["CRUD регламентов ТО"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AggregateStatusThresholdsUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пороги обновлены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregateStatusThresholds' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== UPLOADS (общая утилита для Tickets/KB) =====================
  /uploads/presign:
    post:
      tags: [Uploads]
      summary: Получить presigned URL для прямой загрузки файла в S3
      operationId: createPresignedUpload
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Создание тикета", "Сообщения в чате тикета"]
      description: >
        Клиент загружает файл напрямую в S3 по upload_url, минуя API-сервер
        (не гоняем бинарные данные через backend). file_url затем передаётся
        в теле создания тикета/сообщения как ссылка на вложение.
        Уточнено в 1.4.0 (ADR 0017): upload_url — presigned PUT на 15 минут (expires_at) в
        uploads/{user_id}/{uuid}{расширение}; из file_name берётся только расширение (имя может
        содержать ПД и не хранится); MIME к подписи не привязан. admin загружает вложения для
        сообщений в чате любого тикета (RBAC-04). При привязке к тикету или
        сообщению backend проверяет объект в S3 (HEAD): загружен текущим пользователем, MIME и
        размер — из S3, а не со слов клиента; затем копирует в хранилище тикета ровно
        проверенную версию объекта (ETag) с проверенным MIME. Допустимо:
        photo — image/jpeg, image/png, image/heic, image/webp до 20 МБ; video — video/mp4,
        video/quicktime до 200 МБ; до 10 вложений на тикет или сообщение. Ошибки привязки (422
        у createTicket и createTicketMessage): ATTACHMENT_NOT_FOUND — объект не найден среди
        загрузок текущего пользователя или перезаписан после проверки; ATTACHMENT_ALREADY_USED —
        объект уже привязан (одновременный запрос, проигравший привязку, получает этот код или
        ATTACHMENT_NOT_FOUND, если исходный объект уже удалён после привязки);
        ATTACHMENT_TYPE_NOT_ALLOWED — MIME не из списка или не соответствует file_type;
        ATTACHMENT_TOO_LARGE — размер больше лимита; TOO_MANY_ATTACHMENTS — больше 10 вложений.
        Непривязанные загрузки удаляются через 24 ч. При чтении file_url вложения — presigned GET
        на 15 минут; Content-Type ответа — проверенный MIME вложения (входит в подпись).
        429 RATE_LIMITED — больше 60 запросов в час на пользователя, заголовок Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: URL для загрузки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ===================== TICKETS SERVICE (шаг 5) =====================
  /tickets:
    get:
      tags: [Tickets]
      summary: Список тикетов (канбан-доска инженера / история клиента)
      operationId: listTickets
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр тикета"]
      description: >
        client — только свои тикеты. engineer/admin — фильтры по
        status/category/overdue для канбана (Глава 21).
        Уточнено в 1.4.0 (ADR 0017, RBAC-04): client — тикеты своих авто; engineer — очередь
        (status=new без исполнителя) и тикеты, назначенные ему; admin — все. Фильтры сужают
        видимую выборку. Порядок: engineer/admin — по sla_due_at по возрастанию (приоритет
        следует из категории через срок SLA), client — по created_at по убыванию. Просрочка
        (is_overdue, фильтр overdue) вычисляется при чтении: now() > sla_due_at и статус не
        resolved. Элемент списка содержит vehicle_model и summary — для карточки канбана
        (закрывает ADR 0012 п. 5).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }
        - name: category
          in: query
          schema: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        - name: assigned_engineer_id
          in: query
          schema: { type: integer }
        - name: overdue
          in: query
          schema: { type: boolean }
          description: Только тикеты с просроченным SLA
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница тикетов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Tickets]
      summary: Создать тикет
      operationId: createTicket
      x-required-roles: [client]
      x-rbac-action: ["Создание тикета"]
      description: >
        source_article_id/source_node_id — при эскалации из дерева решений
        (Knowledge Base), иначе null. Вложения — через /uploads/presign
        заранее.
        Уточнено в 1.4.0 (ADR 0017): только на своё активное авто, иначе 404. Тикет создаётся в
        статусе new без исполнителя (очередь); sla_due_at = created_at + норматив категории (тег
        Tickets); firmware_version_at_creation — снимок текущей прошивки авто (N-09).
        description — 1…4000 символов после обрезки пробелов по краям. Статья и узел должны
        существовать, узел — принадлежать статье, узел без статьи запрещён — иначе
        422 INVALID_SOURCE_REFERENCE. Уточнено в 1.5.0 (ADR 0018 п. 11): у статьи должна быть
        опубликованная версия (сейчас может быть снята с публикации), source_node_id — узел
        эскалации (is_escalation=true); удалённый узел — 422, повторите без source_node_id.
        В тикете сохраняется версия статьи — TicketDetail.source_article. Вложения — до 10, правила и коды ошибок 422 —
        createPresignedUpload. 429 RATE_LIMITED — больше 10 тикетов в час на клиента, заголовок
        Retry-After. Ограничения на число открытых тикетов нет.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Тикет создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tickets/{ticketId}:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Tickets]
      summary: Карточка тикета с автопривязанным контекстом авто
      operationId: getTicket
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр тикета"]
      description: >
        vehicle_context собирается из Vehicle Service и Aggregates Service
        (модель, текущая прошивка, статусы агрегатов на момент обращения) —
        межсервисная агрегация на уровне Tickets Service (Глава 17).
        Уточнено в 1.4.0 (ADR 0017, RBAC-04): client — тикеты своих авто; engineer — очередь
        (status=new без исполнителя) и тикеты, назначенные ему; admin — все. Невидимый тикет —
        404 (как доступ к авто, минимизация ПД). firmware_version_at_creation — прошивка на
        момент создания тикета (снимок, N-09), в отличие от текущей
        vehicle_context.vehicle.current_firmware_version. file_url вложений — presigned GET на
        15 минут.
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Детали тикета
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/status:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Tickets]
      summary: Сменить статус тикета
      operationId: updateTicketStatus
      description: >
        Валидирует допустимость перехода между статусами на сервере.
        Уточнено в 1.4.0 (ADR 0017). Граф: new → in_progress — только claimTicket или
        assignTicket, не этим методом; in_progress ↔ waiting_vendor; in_progress |
        waiting_vendor → resolved (resolved_at = now()); resolved → in_progress — переоткрытие
        (resolved_at = null, срок SLA не продлевается). В new тикет возвращает только
        assignTicket с null. Статус меняет назначенный инженер или admin (по тому же графу);
        тикет, видимый инженеру, но не назначенный ему (очередь), — 403; невидимый — 404.
        Переход вне графа — 409 INVALID_STATUS_TRANSITION; запрос текущего статуса — 200 без
        изменений. Подписчики WebSocket получают ticket.updated (docs/asyncapi.yaml).
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Смена статуса тикета"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketStatusUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Статус изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tickets/{ticketId}/claim:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Tickets]
      summary: Инженер берёт тикет в работу (самоназначение)
      operationId: claimTicket
      x-required-roles: [engineer]
      x-rbac-action: ["Назначение тикета инженеру"]
      description: >
        Оптимистичная блокировка: если тикет уже назначен другим инженером —
        409, а не тихая перезапись (тест конкурентного доступа, Глава 21).
        Уточнено в 1.4.0 (ADR 0017): claim атомарен — тикет из очереди (status=new без
        исполнителя) назначается текущему инженеру и переходит в in_progress. Тикет уже у
        другого инженера (в т. ч. проигрыш в гонке) — 409 TICKET_ALREADY_CLAIMED; повторный
        claim своего тикета — 200 без изменений. Подписчики WebSocket получают ticket.updated.
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Тикет назначен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{ticketId}/assign:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Tickets]
      summary: Переназначить тикет (административно, в обход claim)
      operationId: assignTicket
      description: >
        Позволяет администратору назначить или снять инженера с тикета.
        Уточнено в 1.4.0 (ADR 0017): назначить можно только активного пользователя с ролью
        engineer, иначе 422 ASSIGNEE_NOT_ENGINEER. Назначение на тикет в статусе new переводит
        его в in_progress; переназначение статус не меняет; null возвращает нерешённый тикет в
        new (в очередь). Решённый тикет (status=resolved) — 409 TICKET_RESOLVED. Подписчики
        WebSocket получают ticket.updated; открытые подключения, потерявшие доступ к тикету,
        закрываются с кодом 4403 (docs/asyncapi.yaml).
      x-required-roles: [admin]
      x-rbac-action: ["Назначение тикета инженеру"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketAssignRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Переназначено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tickets/{ticketId}/messages:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Tickets]
      summary: История чата тикета
      operationId: listTicketMessages
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Сообщения в чате тикета"]
      description: >
        REST — персистентная история и fallback (long-polling). Реал-тайм
        доставка — по WebSocket /v1/tickets/{ticketId}/ws (только сервер → клиент),
        описание — docs/asyncapi.yaml (AsyncAPI 3.0, Глава 13).
        Уточнено в 1.4.0 (ADR 0017): история — по id по возрастанию; after_id — только сообщения
        с id > after_id (догрузка после переподключения WebSocket), page/page_size — к
        отфильтрованной выборке. Доступ — как у getTicket (engineer читает и тикет из очереди),
        невидимый тикет — 404. Клиенту автор-сотрудник отдаётся с phone и telegram_id = null
        (ADR 0017 п. 12). file_url вложений — presigned GET на 15 минут.
      parameters:
        - name: after_id
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: >-
            Только сообщения с id > after_id, по возрастанию id — догрузка пропущенного после
            переподключения WebSocket. Добавлено в 1.4.0.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница сообщений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketMessageList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Tickets]
      summary: Отправить сообщение в тикет
      operationId: createTicketMessage
      description: >
        Добавляет сообщение в чат тикета; доступно всем сторонам диалога.
        Уточнено в 1.4.0 (ADR 0017): единственный способ отправки (WebSocket — только доставка).
        client — в тикет своего авто (в т. ч. в статусе new); engineer — только в назначенный
        ему тикет (тикет из очереди — сначала claimTicket, иначе 403); admin — в любой.
        Невидимый тикет — 404. В решённый тикет (status=resolved) не пишет никто —
        409 TICKET_RESOLVED; продолжить диалог можно после переоткрытия (updateTicketStatus).
        body — 1…4000 символов после обрезки пробелов по краям; вложения — до 10, правила и
        коды ошибок 422 — createPresignedUpload. Первое сообщение engineer/admin фиксирует
        первичный ответ (метрика аналитики). Подписчики WebSocket получают message.created
        (docs/asyncapi.yaml). 429 RATE_LIMITED — больше 30 сообщений в минуту на пользователя,
        заголовок Retry-After.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Сообщения в чате тикета"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketMessageCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Сообщение отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ===================== KNOWLEDGE BASE SERVICE (шаг 5) =====================
  /knowledge-articles:
    get:
      tags: [KnowledgeBase]
      summary: Список/поиск статей
      operationId: listKnowledgeArticles
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр статей / дерева решений"]
      description: >
        client и engineer видят только is_published=true, admin — все, включая черновики
        (уточнено в 1.5.0, RBAC-05: инженер не отправит черновик клиенту «быстрым ответом»).
        vehicle_model_id — статьи модели и общие (без модели). search — полнотекстовый поиск
        (русская морфология, заголовок важнее текста), до 200 символов, иначе 422; с search —
        по релевантности, без — по updated_at, новые первыми (ADR 0018 п. 9).
      parameters:
        - name: vehicle_model_id
          in: query
          description: Статьи этой модели и общие (vehicle_model_id = null). Уточнено в 1.5.0.
          schema: { type: integer }
        - name: article_type
          in: query
          schema: { type: string, enum: [guide, troubleshooting] }
        - name: category
          in: query
          description: Категория ошибки. Добавлено в 1.5.0.
          schema: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        - name: is_published
          in: query
          description: >-
            Только для engineer/admin (client — игнорируется); engineer видит только
            опубликованные. Добавлено в 1.5.0.
          schema: { type: boolean }
        - name: search
          in: query
          description: >-
            Полнотекстовый поиск по заголовку и тексту, до 200 символов, без управляющих
            символов (иначе 422). Добавлено в 1.5.0.
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница статей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeArticleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [KnowledgeBase]
      summary: Создать статью (черновик)
      operationId: createKnowledgeArticle
      description: >
        Создаёт неопубликованную статью (черновик, версий нет, version = 1). Уточнено в 1.5.0
        (ADR 0018): category обязательна для troubleshooting — иначе 422 CATEGORY_REQUIRED;
        vehicle_model_id — существующая модель (422 VEHICLE_MODEL_NOT_FOUND); firmware_release_id —
        прошивка этой модели (422 FIRMWARE_RELEASE_NOT_FOUND). title — 1…200 символов после
        обрезки пробелов, content — до 50 000 символов, иначе 422.
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeArticleCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /knowledge-articles/{articleId}:
    parameters:
      - { name: articleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [KnowledgeBase]
      summary: Детали статьи
      operationId: getKnowledgeArticle
      description: >
        Возвращает статью по идентификатору. Черновик для client и engineer — 404
        (уточнено в 1.5.0, RBAC-05).
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр статей / дерева решений"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Статья
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [KnowledgeBase]
      summary: Редактировать/опубликовать статью
      operationId: updateKnowledgeArticle
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      description: >
        Меняются только переданные поля; null у category, vehicle_model_id,
        firmware_release_id снимает значение. Изменено в 1.5.0 (ADR 0018): version — номер
        последней опубликованной редакции. Если после записи статья опубликована и её
        содержание (title, content, category, привязка, дерево) отличается от последней
        версии — version + 1 и снимок (listKnowledgeArticleRevisions); правки черновика
        версий не создают. Публикация troubleshooting — только с валидным деревом, иначе
        409 DECISION_TREE_INVALID (details.issues — как у validateDecisionTree). Ошибки 422 —
        как у createKnowledgeArticle. Отката к прошлой версии нет.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeArticleUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [KnowledgeBase]
      summary: Снять статью с публикации
      operationId: unpublishKnowledgeArticle
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      description: >
        Soft — is_published=false; повторный вызов — тоже 204. Жёсткое удаление не
        предусмотрено (Ticket.source_article_id ссылается на статьи). Версии сохраняются;
        эскалация из статьи, у которой есть опубликованная версия, остаётся возможной
        (уточнено в 1.5.0, ADR 0018 п. 11).
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Снято с публикации }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /knowledge-articles/{articleId}/revisions:
    parameters:
      - { name: articleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [KnowledgeBase]
      summary: История версий статьи
      operationId: listKnowledgeArticleRevisions
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Просмотр статей / дерева решений"]
      description: >
        Опубликованные редакции статьи, новые первыми. Доступны у статьи с хотя бы одной
        опубликованной версией — в т. ч. снятой с публикации (на неё может ссылаться тикет,
        TicketDetail.source_article); черновик без версий для engineer — 404, admin видит все.
        Добавлено в 1.5.0 (ADR 0018 п. 1, RBAC-05).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница версий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeArticleRevisionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /knowledge-articles/{articleId}/revisions/{version}:
    parameters:
      - { name: articleId, in: path, required: true, schema: { type: integer } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [KnowledgeBase]
      summary: Версия статьи (снимок)
      operationId: getKnowledgeArticleRevision
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Просмотр статей / дерева решений"]
      description: >
        Снимок опубликованной редакции: заголовок, текст, категория, привязка и дерево решений
        на момент публикации. Добавлено в 1.5.0 (ADR 0018 п. 1).
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Версия статьи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeArticleRevision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /knowledge-articles/{articleId}/decision-tree:
    parameters:
      - { name: articleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [KnowledgeBase]
      summary: Дерево решений статьи (все узлы)
      operationId: listDecisionTreeNodes
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр статей / дерева решений"]
      description: >
        Клиент проходит от узла с is_root=true, следуя options[].next_node_id. Дерево
        черновика для client и engineer — 404 (уточнено в 1.5.0). Узлы — по порядку создания;
        в дереве не больше 100 узлов (page_size=100 — всё дерево).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Узлы дерева
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTreeNodeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [KnowledgeBase]
      summary: Добавить узел дерева решений
      operationId: createDecisionTreeNode
      description: >
        Создаёт узел; сервер проверяет уникальность is_root=true для статьи.
        409 — Нарушение инварианта (напр. второй is_root=true).
        Уточнено в 1.5.0 (ADR 0018 п. 3, 5, 6): 409 ARTICLE_TYPE_HAS_NO_TREE — у guide дерева
        нет; 409 ARTICLE_PUBLISHED — дерево опубликованной статьи не меняется (снять с
        публикации → править → опубликовать); 409 DECISION_TREE_ROOT_EXISTS — второй корень.
        422: INVALID_NEXT_NODE — вариант ведёт не на узел этой статьи; DECISION_TREE_TOO_LARGE —
        больше 100 узлов; question_text — 1…1000 символов, label — 1…100, не больше 10
        вариантов, метки вариантов узла не повторяются.
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionTreeNodeCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Узел создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTreeNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /knowledge-articles/{articleId}/decision-tree/validate:
    parameters:
      - { name: articleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [KnowledgeBase]
      summary: Проверить дерево на тупики перед публикацией
      operationId: validateDecisionTree
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      description: >
        Операционализация теста из чек-листа Главы 14 ("отсутствие тупиков в
        дереве решений") — админ прогоняет проверку сам, не дожидаясь QA.
        Уточнено в 1.5.0 (ADR 0018 п. 4): NO_ROOT — нет корня; MULTIPLE_ROOTS; BROKEN_REFERENCE —
        переход на отсутствующий узел; UNREACHABLE — узел недостижим из корня; DEAD_END — из
        узла не достижим ни один финал (решение или эскалация), в том числе замкнутый цикл;
        NO_ESCALATION — из корня не достижим ни один узел эскалации. У guide дерева нет —
        is_valid=true без проблем.
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTreeValidationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decision-tree-nodes/{nodeId}:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [KnowledgeBase]
      summary: Редактировать узел
      operationId: updateDecisionTreeNode
      description: >
        Обновляет текст вопроса и варианты переходов узла дерева решений (узел заменяется
        целиком). Ошибки 409 и 422 — как у createDecisionTreeNode (добавлено в 1.5.0).
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionTreeNodeCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTreeNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [KnowledgeBase]
      summary: Удалить узел
      operationId: deleteDecisionTreeNode
      description: >
        Отклоняется с 409, если на узел ссылаются другие узлы.
        409 — На узел ссылаются другие узлы — сначала обновите их options.
        Уточнено в 1.5.0: 409 DECISION_TREE_NODE_REFERENCED (details.referenced_by — id узлов),
        409 ARTICLE_PUBLISHED — дерево опубликованной статьи не меняется. Ссылка тикета на
        удалённый узел обнуляется.
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ===================== NOTIFICATIONS SERVICE (шаг 5) =====================
  /push-tokens:
    post:
      tags: [Notifications]
      summary: Зарегистрировать FCM push-токен устройства
      operationId: registerPushToken
      description: >-
        Сохраняет токен устройства для последующей push-рассылки. Повторная регистрация своего
        токена — 201; токен, привязанный к другому пользователю (сменили аккаунт на телефоне),
        перепривязывается к текущему — 201, 409 не возвращается. Токен длиннее 1024 символов —
        422. Уточнено в 1.6.0 (ADR 0019 п. 8).
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenRegisterRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201': { description: Токен зарегистрирован }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /push-tokens/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Notifications]
      summary: Удалить push-токен (логаут с устройства/отключение уведомлений)
      operationId: deletePushToken
      description: >-
        Прекращает отправку push-уведомлений на данное устройство (токен отзывается, журнал
        доставок сохраняется). 404 — нет активного токена с этим значением у текущего
        пользователя. Уточнено в 1.6.0 (ADR 0019 п. 8).
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [Notifications]
      summary: Центр уведомлений клиента
      operationId: listNotifications
      description: >-
        Постраничная лента уведомлений (прошивки/ТО/новости/акции), новые первыми. В ленте —
        только уведомления, в аудиторию которых клиент вошёл в момент публикации (ADR 0019 п. 3).
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница уведомлений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Notifications]
      summary: Опубликовать уведомление (новости/акции/ручная рассылка)
      operationId: createNotification
      x-required-roles: [admin]
      x-rbac-action: ["Публикация новостей/акций/прошивок"]
      description: >
        target_vehicle_model_id — единственный источник таргетинга (Глава 2,
        3НФ). Для type=firmware обычно создаётся автоматически через
        POST /firmware-releases, но ручная публикация тоже разрешена: релиз той же модели
        обязателен, аудитория — владельцы авто модели с более ранней или неизвестной прошивкой.
        Уточнено в 1.6.0 (ADR 0019): type=maintenance — только системные напоминания о ТО
        (422 NOTIFICATION_TYPE_RESERVED); message — 1–1000 символов после обрезки пробелов (422);
        аудитория — активные клиенты с действующим согласием ПД и неудалёнными авто модели
        (null — все клиенты). Перед отправкой — previewNotificationAudience.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Уведомление поставлено в очередь на рассылку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications/{notificationId}/read:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Notifications]
      summary: Отметить уведомление прочитанным
      operationId: markNotificationRead
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      description: >-
        Пишет read_at в NotificationRecipient (лента пользователя, C-13) независимо от push-токенов.
        Открытие push фиксируется отдельно в NotificationDelivery.opened_at (аналитика, Глава 16).
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Отмечено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/{notificationId}/opened:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Notifications]
      summary: Отметить открытие push-уведомления
      operationId: markNotificationOpened
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      description: >-
        Вызывается приложением при нажатии на push: пишет NotificationDelivery.opened_at доставки
        на устройство с этим токеном (аналитика открываемости, Глава 16) и read_at, если
        уведомление ещё не прочитано. Токен без доставки этого уведомления — только read_at.
        404 — уведомления нет в ленте текущего пользователя. Добавлено в 1.6.0 (ADR 0019 п. 12).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationOpenedRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Отмечено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications/published:
    get:
      tags: [Notifications]
      summary: Лента публикаций (админ-панель)
      operationId: listPublishedNotifications
      x-required-roles: [admin]
      x-rbac-action: ["Публикация новостей/акций/прошивок"]
      description: >-
        Публикации администратора (firmware, news, promo; напоминания о ТО не входят), новые
        первыми, со счётчиками аудитории, доставки и открытий. Добавлено в 1.6.0 (ADR 0019 п. 12,
        закрывает ADR 0012 п. 5).
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [firmware, news, promo] }
        - name: target_vehicle_model_id
          in: query
          schema: { type: integer }
          description: Публикации для этой модели (без публикаций «для всех моделей»).
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница публикаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedNotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications/audience-preview:
    post:
      tags: [Notifications]
      summary: Проверить аудиторию публикации без отправки
      operationId: previewNotificationAudience
      x-required-roles: [admin]
      x-rbac-action: ["Публикация новостей/акций/прошивок"]
      description: >-
        Число клиентов и устройств, которые получат публикацию с таким телом, по тем же правилам,
        что createNotification (включая его проверки и 422). Ничего не создаёт и не отправляет.
        Добавлено в 1.6.0 (ADR 0019 п. 12, U-45).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Размер аудитории
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationAudiencePreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /firmware-releases:
    get:
      tags: [Notifications]
      summary: Список релизов прошивок
      operationId: listFirmwareReleases
      description: >-
        Возвращает релизы, опционально отфильтрованные по модели авто; новые первыми
        (released_at, затем id по убыванию).
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Получение push-уведомлений", "Фиксация текущей прошивки авто", "Публикация новостей/акций/прошивок"]
      parameters:
        - name: vehicle_model_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список релизов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareReleaseList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Notifications]
      summary: Опубликовать релиз прошивки
      operationId: createFirmwareRelease
      x-required-roles: [admin]
      x-rbac-action: ["Публикация новостей/акций/прошивок"]
      description: >-
        Атомарно создаёт FirmwareRelease и триггерит Notification(type=firmware) с targeting по
        vehicle_model_id. Уточнено в 1.6.0 (ADR 0019 п. 4): текст уведомления формирует сервер;
        аудитория — владельцы авто модели, у которых прошивка не указана или выпущена раньше
        (released_at, при равенстве — id). Неизвестная модель, повтор версии модели, дата в
        будущем — 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirmwareReleaseCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Релиз опубликован, уведомление поставлено в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vehicles/{vehicleId}/firmware:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Notifications]
      summary: Зафиксировать текущую прошивку авто (после русификации/визита)
      operationId: setVehicleFirmware
      description: >-
        Обновляет current_firmware_release_id автомобиля; уведомлений не создаёт. Доступ — как у
        записи работ по авто (инженер — по своему тикету в работе, ADR 0014). Уточнено в 1.6.0.
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Фиксация текущей прошивки авто"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleFirmwareUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== USERS (A-04, профиль) =====================
  /me:
    get:
      tags: [Users]
      summary: Профиль текущего пользователя
      operationId: getCurrentUser
      description: Возвращает пользователя, которому выдан access-токен. Доступно всем ролям.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр своего профиля"]

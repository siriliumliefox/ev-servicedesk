              schema: { $ref: '#/components/schemas/DecisionTreeNodeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [KnowledgeBase]
      summary: Добавить узел дерева решений
      operationId: createDecisionTreeNode
      description: >
        Создаёт узел; сервер проверяет уникальность is_root=true для статьи.
        409 — Нарушение инварианта (напр. второй is_root=true).
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionTreeNodeCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Узел создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTreeNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /knowledge-articles/{articleId}/decision-tree/validate:
    parameters:
      - { name: articleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [KnowledgeBase]
      summary: Проверить дерево на тупики перед публикацией
      operationId: validateDecisionTree
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      description: >
        Операционализация теста из чек-листа Главы 14 ("отсутствие тупиков в
        дереве решений") — админ прогоняет проверку сам, не дожидаясь QA.
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTreeValidationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decision-tree-nodes/{nodeId}:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [KnowledgeBase]
      summary: Редактировать узел
      operationId: updateDecisionTreeNode
      description: Обновляет текст вопроса и варианты переходов узла дерева решений.
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionTreeNodeCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTreeNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [KnowledgeBase]
      summary: Удалить узел
      operationId: deleteDecisionTreeNode
      description: >
        Отклоняется с 409, если на узел ссылаются другие узлы.
        409 — На узел ссылаются другие узлы — сначала обновите их options.
      x-required-roles: [admin]
      x-rbac-action: ["CRUD статей базы знаний"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ===================== NOTIFICATIONS SERVICE (шаг 5) =====================
  /push-tokens:
    post:
      tags: [Notifications]
      summary: Зарегистрировать FCM push-токен устройства
      operationId: registerPushToken
      description: Сохраняет токен устройства для последующей push-рассылки.
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenRegisterRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201': { description: Токен зарегистрирован }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /push-tokens/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Notifications]
      summary: Удалить push-токен (логаут с устройства/отключение уведомлений)
      operationId: deletePushToken
      description: Прекращает отправку push-уведомлений на данное устройство.
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [Notifications]
      summary: Центр уведомлений клиента
      operationId: listNotifications
      description: Постраничная лента уведомлений (прошивки/ТО/новости/акции).
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница уведомлений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Notifications]
      summary: Опубликовать уведомление (новости/акции/ручная рассылка)
      operationId: createNotification
      x-required-roles: [admin]
      x-rbac-action: ["Публикация новостей/акций/прошивок"]
      description: >
        target_vehicle_model_id — единственный источник таргетинга (Глава 2,
        3НФ). Для type=firmware обычно создаётся автоматически через
        POST /firmware-releases, но ручная публикация тоже разрешена.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Уведомление поставлено в очередь на рассылку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications/{notificationId}/read:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Notifications]
      summary: Отметить уведомление прочитанным
      operationId: markNotificationRead
      x-required-roles: [client]
      x-rbac-action: ["Получение push-уведомлений"]
      description: >-
        Пишет read_at в NotificationRecipient (лента пользователя, C-13) независимо от push-токенов.
        Открытие push фиксируется отдельно в NotificationDelivery.opened_at (аналитика, Глава 16).
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Отмечено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /firmware-releases:
    get:
      tags: [Notifications]
      summary: Список релизов прошивок
      operationId: listFirmwareReleases
      description: Возвращает релизы, опционально отфильтрованные по модели авто.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Получение push-уведомлений", "Фиксация текущей прошивки авто", "Публикация новостей/акций/прошивок"]
      parameters:
        - name: vehicle_model_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список релизов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareReleaseList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Notifications]
      summary: Опубликовать релиз прошивки
      operationId: createFirmwareRelease
      x-required-roles: [admin]
      x-rbac-action: ["Публикация новостей/акций/прошивок"]
      description: Атомарно создаёт FirmwareRelease и триггерит Notification(type=firmware) с targeting по vehicle_model_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirmwareReleaseCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Релиз опубликован, уведомление поставлено в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirmwareRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vehicles/{vehicleId}/firmware:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Notifications]
      summary: Зафиксировать текущую прошивку авто (после русификации/визита)
      operationId: setVehicleFirmware
      description: Обновляет current_firmware_release_id автомобиля.
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Фиксация текущей прошивки авто"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleFirmwareUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== USERS (A-04, профиль) =====================
  /me:
    get:
      tags: [Users]
      summary: Профиль текущего пользователя
      operationId: getCurrentUser
      description: Возвращает пользователя, которому выдан access-токен. Доступно всем ролям.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр своего профиля"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      summary: Список пользователей (админ-панель)
      operationId: listUsers
      description: Фильтры по роли, активности и подстроке телефона. Анонимизированные (phone = null) включаются.
      x-required-roles: [admin]
      x-rbac-action: ["Управление пользователями и ролями"]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [client, engineer, admin] }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string, maxLength: 16 }
          description: Подстрока телефона (E.164)
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Users]
      summary: Создать учётную запись инженера/администратора
      operationId: createStaffUser
      description: >
        Клиенты регистрируются сами (verifyPhoneCode). Персонал создаёт только admin;
        пароль хранится как password_hash (N-08, ADR 0005). 409 — телефон уже занят.
      x-required-roles: [admin]
      x-rbac-action: ["Управление пользователями и ролями"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffUserCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Учётная запись создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Users]
      summary: Карточка пользователя
      operationId: getUser
      description: Просмотр любого пользователя администратором.
      x-required-roles: [admin]
      x-rbac-action: ["Управление пользователями и ролями"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Сменить роль или заблокировать/разблокировать пользователя
      operationId: updateUser
      description: >
        Смена роли client ↔ staff не поддерживается (у клиента нет пароля) — 409 ROLE_CHANGE_NOT_ALLOWED;
        допустимо engineer ↔ admin. is_active=false блокирует вход и отзывает refresh-токены.
        409 LAST_ADMIN — нельзя понизить или заблокировать последнего активного администратора.
      x-required-roles: [admin]
      x-rbac-action: ["Управление пользователями и ролями"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== ANALYTICS SERVICE (A-05, A-06; реализация — Глава 16) =====================
  /analytics/ticket-resolution:
    get:
      tags: [Analytics]
      summary: Время реакции и закрытия тикетов (A-05)
      operationId: getTicketResolutionStats
      description: >
        Считается по ticket.created_at, first_response_at, resolved_at за период [date_from, date_to]
        (по дате создания тикета, включительно). 422 — date_from > date_to или период длиннее 366 дней.
      x-required-roles: [admin]
      x-rbac-action: ["Просмотр аналитики (дашборд)"]
      parameters:
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - name: vehicle_model_id
          in: query
          schema: { type: integer }
        - name: category
          in: query
          schema: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Показатели за период
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResolutionStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/problem-models:
    get:
      tags: [Analytics]
      summary: Проблемные модели — тикеты по моделям и категориям (A-06)
      operationId: listProblemModels
      description: Модели, отсортированные по убыванию tickets_total за период. Модели без тикетов не включаются.
      x-required-roles: [admin]
      x-rbac-action: ["Просмотр аналитики (дашборд)"]
      parameters:
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница моделей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemModelStatsList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/maintenance-conversion:
    get:
      tags: [Analytics]
      summary: Конверсия в ТО (A-06)
      operationId: getMaintenanceConversionStats
      description: >
        Две воронки за период: тикеты → работы ТО (maintenance_record.ticket_id) и уведомления
        type=maintenance → открытие push (notification_delivery.opened_at) → работа ТО по авто
        получателя в течение 30 дней после уведомления. Rate = null, если знаменатель 0.
      x-required-roles: [admin]
      x-rbac-action: ["Просмотр аналитики (дашборд)"]
      parameters:
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - name: vehicle_model_id
          in: query
          schema: { type: integer }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Показатели конверсии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceConversionStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DateFromParam:
      name: date_from
      in: query
      required: true
      schema: { type: string, format: date }
      description: Начало периода (включительно)
    DateToParam:
      name: date_to
      in: query
      required: true
      schema: { type: string, format: date }
      description: Конец периода (включительно)

  schemas:
    # --- Единый формат ошибок (шаг 6, материализован в шаге 1) ---
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машиночитаемый код ошибки, напр. VALIDATION_ERROR, NOT_FOUND
              example: VALIDATION_ERROR
            message:
              type: string
              description: Человекочитаемое сообщение (для логов/поддержки, не для UI напрямую)
            details:
              type: object
              nullable: true
              description: Доп. контекст (напр. какое поле не прошло валидацию)

    # --- Единый формат пагинации (шаг 6) ---
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }

    # --- Auth (шаг 2) ---
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      maxLength: 16
      example: "+375291234567"
      description: Телефон в формате E.164 (CHECK ck_app_user_phone_e164, Глава 2). ПД по N-07.

    PhoneRequestCode:
      type: object
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }

    VerifyCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }
        code: { type: string, example: "1234" }
        pd_policy_version:
          type: string
          maxLength: 20
          nullable: true
          example: "2026-10"
          description: >-
            Редакция политики обработки ПД, с которой пользователь согласился в приложении.
            Обязательна при первой регистрации и при отсутствии действующего согласия;
            фиксируется в pd_consent с датой (99-З, ст. 5). Без согласия — 422 PD_CONSENT_REQUIRED.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    StaffLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }
        password: { type: string, format: password }

    TelegramLinkRequest:
      type: object
      required: [telegram_id]
      properties:
        telegram_id: { type: string }

    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: "TTL access-токена, сек." }

    UserPublic:
      type: object
      required: [id, phone, role, is_active, created_at]
      properties:
        id: { type: integer }
        phone:
          allOf:
            - $ref: '#/components/schemas/PhoneE164'
          nullable: true
          description: E.164; null — пользователь анонимизирован (ПД удалены по 99-З, ADR 0006).
        role: { type: string, enum: [client, engineer, admin] }
        is_active: { type: boolean, description: "false — вход заблокирован администратором" }
        telegram_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # --- Vehicle (шаг 3) ---
    # VehicleModel — с id, для поиска/выбора модели вручную (fallback VIN-декодера).
    VehicleModel:
      type: object
      required: [id, brand, model]
      properties:
        id: { type: integer }
        brand: { type: string, example: "Zeekr" }
        model: { type: string, example: "001" }
        trim: { type: string, nullable: true }

    # VehicleModelInfo — без id, только для отображения внутри карточки Vehicle
    # (после создания клиенту не нужно повторно ссылаться на модель по id).
    VehicleModelInfo:
      type: object
      required: [brand, model]
      properties:
        brand: { type: string }
        model: { type: string }
        trim: { type: string, nullable: true }

    VehicleCreateRequest:
      type: object
      required: [vin]
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
          pattern: '^[A-HJ-NPR-Z0-9]{17}$'
          example: "LSVAU2183R2100001"
        vehicle_model_id:
          type: integer
          nullable: true
          description: Явное указание модели, если VIN-декодер не смог распознать авто

    Vehicle:
      type: object
      required: [id, vin, mileage, vehicle_model, is_active, created_at]
      properties:
        id: { type: integer }
        vin: { type: string, minLength: 17, maxLength: 17 }
        mileage: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        vehicle_model: { $ref: '#/components/schemas/VehicleModelInfo' }
        current_firmware_version:
          type: string
          nullable: true
          description: Версия прошивки из последнего зафиксированного FirmwareRelease (см. PATCH /vehicles/{id}/firmware)
        created_at: { type: string, format: date-time }

    MileageUpdateRequest:
      type: object
      required: [mileage]
      properties:
        mileage: { type: integer, minimum: 0 }

    MileageCorrectionRequest:
      type: object
      required: [expected_current_mileage, mileage, reason]
      properties:
        expected_current_mileage:
          type: integer
          minimum: 0
          description: Пробег, который видел администратор (защита от гонки → 409 при расхождении).
        mileage: { type: integer, minimum: 0, description: "Новое значение, строго меньше текущего" }
        reason: { type: string, minLength: 1, maxLength: 500 }

    # aggregate_type_code (не id) — публичный контракт ссылается на стабильный
    # бизнес-ключ справочника AggregateType, а не на внутренний surrogate id (Глава 2).
    MaintenanceRecord:
      type: object
      required: [id, performed_at, mileage_at_service]
      properties:
        id: { type: integer }
        aggregate_type_code: { type: string, nullable: true }
        performed_by: { $ref: '#/components/schemas/UserPublic' }
        performed_at: { type: string, format: date }
        mileage_at_service: { type: integer }
        description: { type: string, nullable: true }

    MaintenanceRecordCreateRequest:
      type: object
      required: [performed_at, mileage_at_service]
      properties:
        aggregate_type_code:
          type: string
          nullable: true
          description: Код агрегата (справочник AggregateType), либо null для общей работы
        performed_at: { type: string, format: date }
        mileage_at_service: { type: integer, minimum: 0 }
        description: { type: string, nullable: true, maxLength: 255 }

    MaintenanceRecordList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceRecord' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- Aggregates & Maintenance (шаг 4) ---
    AggregateType:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: "engine_oil" }
        name: { type: string, example: "Масло в двигателе" }

    AggregateTypeCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 50, pattern: '^[a-z][a-z0-9_]{1,49}$', example: "brake_fluid" }
        name: { type: string, minLength: 1, maxLength: 100, example: "Тормозная жидкость" }

    MaintenanceRegulation:
      type: object
      required: [id, vehicle_model_id, aggregate_type_code, is_archived]
      properties:
        id: { type: integer }
        vehicle_model_id: { type: integer }
        aggregate_type_code: { type: string }
        interval_km: { type: integer, nullable: true }
        interval_months: { type: integer, nullable: true }
        is_archived: { type: boolean }

    MaintenanceRegulationCreateRequest:
      type: object
      required: [vehicle_model_id, aggregate_type_code]
      description: Нужно указать interval_km и/или interval_months — хотя бы одно.
      properties:
        vehicle_model_id: { type: integer }
        aggregate_type_code: { type: string }
        interval_km: { type: integer, nullable: true, minimum: 1 }
        interval_months: { type: integer, nullable: true, minimum: 1 }

    AggregateStatus:
      type: object
      required: [aggregate_type_code, aggregate_type_name, status]
      properties:
        aggregate_type_code: { type: string }
        aggregate_type_name: { type: string }
        status:
          type: string
          enum: [green, yellow, red, unknown]
          description: >
            По точному проценту выработки p и порогам (по умолчанию 70/100):
            green p < 70, yellow 70 ≤ p ≤ 100, red p > 100;
            unknown — нет истории замены (не ошибка, Глава 5).
            Правила — docs/specs/AGGREGATE_STATUS_ALGORITHM.md.
        percentage:
          type: number
          nullable: true
          description: >
            % выработки интервала — худший из пробега и времени, усечён вниз до 0.1
            (только для показа, цвет определяет status). null при status=unknown.
        last_replaced_at: { type: string, format: date, nullable: true }
        last_replaced_mileage: { type: integer, nullable: true }
        remaining_km:
          type: integer
          nullable: true
          description: Остаток до конца интервала по пробегу; < 0 — перепробег; null — нет интервала/данных.
        remaining_days:
          type: integer
          nullable: true
          description: >
            Остаток до конца интервала по времени в днях; < 0 — просрочено; null — нет
            интервала/данных. Добавлено в 1.1.0.

    AggregateStatusThresholds:
      type: object
      required: [yellow_from_percent, red_above_percent, updated_at]
      properties:
        yellow_from_percent: { type: integer, minimum: 1, maximum: 199, example: 70 }
        red_above_percent: { type: integer, minimum: 2, maximum: 200, example: 100 }
        updated_at: { type: string, format: date-time }
        updated_by_user_id:
          type: integer
          nullable: true
          description: Кто изменил последним; null — значения по умолчанию из миграции.

    AggregateStatusThresholdsUpdateRequest:
      type: object
      required: [yellow_from_percent, red_above_percent]
      description: 1 ≤ yellow_from_percent < red_above_percent ≤ 200, иначе 422.
      properties:
        yellow_from_percent: { type: integer, minimum: 1, maximum: 199 }
        red_above_percent: { type: integer, minimum: 2, maximum: 200 }

    AggregateReplaceRequest:
      type: object
      required: [replaced_at, mileage_at_replacement]
      properties:
        replaced_at: { type: string, format: date }
        mileage_at_replacement: { type: integer, minimum: 0 }
        description:
          type: string
          nullable: true
          description: Пробрасывается в связанную запись MaintenanceRecord

    # --- Uploads ---
    PresignRequest:
      type: object
      required: [file_name, file_type]
      properties:
        file_name: { type: string, example: "photo.jpg" }
        file_type: { type: string, enum: [photo, video] }

    PresignResponse:
      type: object
      required: [upload_url, file_url, expires_at]
      properties:
        upload_url: { type: string, description: "PUT сюда бинарные данные напрямую в S3" }
        file_url:
          type: string
          description: >-
            Идентификатор загруженного объекта — передать в attachments. Не публичная ссылка:
            backend хранит ключ объекта S3 (ticket_attachment.object_key) и выдаёт
            presigned URL при чтении (ADR 0004).
        expires_at: { type: string, format: date-time }

    # --- Tickets (шаг 5) ---
    TicketAttachmentInput:
      type: object
      required: [file_url, file_type]
      properties:
        file_url:
          type: string
          description: >-
            file_url из PresignResponse. Backend проверяет, что объект загружен текущим
            пользователем, и сохраняет ключ объекта, MIME и размер (ADR 0004).
        file_type: { type: string, enum: [photo, video] }

    TicketCreateRequest:
      type: object
      required: [vehicle_id, category, description]
      properties:
        vehicle_id: { type: integer }
        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        description: { type: string }
        source_article_id: { type: integer, nullable: true }
        source_node_id: { type: integer, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/TicketAttachmentInput' }

    Ticket:
      type: object
      required: [id, category, status, sla_due_at, is_overdue, created_at]
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        status: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }
        assigned_engineer_id: { type: integer, nullable: true }
        sla_due_at: { type: string, format: date-time }
        is_overdue: { type: boolean, description: "Вычисляемое поле: now() > sla_due_at и status != resolved" }
        created_at: { type: string, format: date-time }
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Заполнено тогда и только тогда, когда status = resolved (A-05).

    VehicleContext:
      type: object
      description: Автопривязанный контекст авто на момент открытия карточки тикета.
      properties:
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        aggregate_statuses:
          type: array
          items: { $ref: '#/components/schemas/AggregateStatus' }

    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          properties:
            description: { type: string }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/TicketAttachmentInput' }
            vehicle_context: { $ref: '#/components/schemas/VehicleContext' }

    TicketList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TicketMessageCreateRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/TicketAttachmentInput' }

    TicketMessage:
      type: object
      required: [id, author, body, created_at]
      properties:
        id: { type: integer }
        author: { $ref: '#/components/schemas/UserPublic' }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/TicketAttachmentInput' }
        created_at: { type: string, format: date-time }

    TicketMessageList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TicketMessage' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- Knowledge Base (шаг 5) ---
    KnowledgeArticleCreateRequest:
      type: object
      required: [article_type, title, content]
      properties:
        vehicle_model_id: { type: integer, nullable: true }
        firmware_release_id:
          type: integer
          nullable: true
          description: Статья под версию прошивки (C-06); требует vehicle_model_id той же модели.
        article_type: { type: string, enum: [guide, troubleshooting] }
        title: { type: string, maxLength: 200 }
        content: { type: string }

    KnowledgeArticleUpdateRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string }
        is_published: { type: boolean }

    KnowledgeArticle:
      type: object
      required: [id, article_type, title, version, is_published]
      properties:
        id: { type: integer }
        vehicle_model_id: { type: integer, nullable: true }
        firmware_release_id:
          type: integer
          nullable: true
          description: Статья под версию прошивки (C-06); требует vehicle_model_id той же модели.
        article_type: { type: string, enum: [guide, troubleshooting] }
        title: { type: string }
        content: { type: string }
        version: { type: integer }
        is_published: { type: boolean }

    KnowledgeArticleList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeArticle' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    DecisionTreeOption:
      type: object
      required: [label, next_node_id]
      properties:
        label: { type: string, example: "Экран всё ещё завис" }
        next_node_id: { type: integer, nullable: true, description: "null допустим только если is_escalation=true на текущем узле" }

    DecisionTreeNodeCreateRequest:
      type: object
      required: [question_text, is_root, is_escalation]
      properties:
        question_text: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/DecisionTreeOption' }
        is_root: { type: boolean }
        is_escalation: { type: boolean }

    DecisionTreeNode:
      allOf:
        - $ref: '#/components/schemas/DecisionTreeNodeCreateRequest'
        - type: object
          required: [id, article_id]
          properties:
            id: { type: integer }
            article_id: { type: integer }

    DecisionTreeValidationResult:
      type: object
      required: [is_valid, issues]
      properties:
        is_valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            properties:
              node_id: { type: integer }
              problem:
                type: string
                enum: [DEAD_END, UNREACHABLE, MULTIPLE_ROOTS, BROKEN_REFERENCE]

    # --- Notifications & Firmware (шаг 5) ---
    NotificationCreateRequest:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [firmware, maintenance, news, promo] }
        target_vehicle_model_id: { type: integer, nullable: true, description: "null = все модели" }
        firmware_release_id: { type: integer, nullable: true }
        message: { type: string }

    Notification:
      type: object
      required: [id, type, message, created_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [firmware, maintenance, news, promo] }
        target_vehicle_model_id: { type: integer, nullable: true }
        firmware_release_id: { type: integer, nullable: true }
        message: { type: string }
        created_at: { type: string, format: date-time }

    NotificationListItem:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            read_at: { type: string, format: date-time, nullable: true, description: "NotificationRecipient.read_at" }

    NotificationList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationListItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    FirmwareReleaseCreateRequest:
      type: object
      required: [vehicle_model_id, version, released_at]
      properties:
        vehicle_model_id: { type: integer }
        version: { type: string, minLength: 1, maxLength: 50, example: "2.4.1" }
        released_at: { type: string, format: date }

    FirmwareRelease:
      type: object
      required: [id, vehicle_model_id, version, released_at]
      properties:
        id: { type: integer }
        vehicle_model_id: { type: integer }
        version: { type: string }
        released_at: { type: string, format: date }

    # --- Коллекции с единой пагинацией (Глава 3: пагинация на всех коллекциях) ---
    VehicleModelList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VehicleModel' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    VehicleList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AggregateTypeList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AggregateType' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    MaintenanceRegulationList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceRegulation' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AggregateStatusList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AggregateStatus' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    DecisionTreeNodeList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DecisionTreeNode' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    FirmwareReleaseList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FirmwareRelease' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    UserList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserPublic' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    # --- Тела запросов, ранее описанные inline ---
    TicketStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }

    TicketAssignRequest:
      type: object
      required: [assigned_engineer_id]
      properties:
        assigned_engineer_id: { type: integer, nullable: true, description: "null — снять инженера" }

    PushTokenRegisterRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096 }

    VehicleFirmwareUpdateRequest:
      type: object
      required: [firmware_release_id]
      properties:
        firmware_release_id: { type: integer, description: "Релиз той же модели, что и авто (иначе 422)" }

    # --- Users (A-04) ---
    StaffUserCreateRequest:
      type: object
      required: [phone, role, password]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }
        role: { type: string, enum: [engineer, admin] }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }

    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        role: { type: string, enum: [engineer, admin] }
        is_active: { type: boolean }

    # --- Analytics (A-05, A-06) ---
    TicketResolutionStats:
      type: object
      required: [date_from, date_to, tickets_created, tickets_resolved, tickets_resolved_overdue,
                 avg_first_response_hours, avg_resolution_hours, median_resolution_hours]
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        tickets_created: { type: integer, minimum: 0 }
        tickets_resolved: { type: integer, minimum: 0 }
        tickets_resolved_overdue: { type: integer, minimum: 0, description: "resolved_at > sla_due_at" }
        avg_first_response_hours: { type: number, nullable: true }
        avg_resolution_hours: { type: number, nullable: true, description: "Среднее resolved_at − created_at (A-05)" }
        median_resolution_hours: { type: number, nullable: true }

    TicketCategoryCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }
        count: { type: integer, minimum: 0 }

    ProblemModelStats:
      type: object
      required: [vehicle_model, tickets_total, vehicles_total, by_category]
      properties:
        vehicle_model: { $ref: '#/components/schemas/VehicleModel' }
        tickets_total: { type: integer, minimum: 0 }
        vehicles_total: { type: integer, minimum: 0, description: "Активные авто модели — для нормирования" }
        by_category:
          type: array
          items: { $ref: '#/components/schemas/TicketCategoryCount' }

    ProblemModelStatsList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProblemModelStats' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    MaintenanceConversionStats:
      type: object
      required: [date_from, date_to, tickets_total, tickets_with_maintenance, ticket_to_maintenance_rate,
                 notifications_recipients, notifications_opened, recipients_with_maintenance,
                 notification_to_maintenance_rate]
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        tickets_total: { type: integer, minimum: 0 }
        tickets_with_maintenance: { type: integer, minimum: 0 }
        ticket_to_maintenance_rate: { type: number, minimum: 0, maximum: 1, nullable: true }
        notifications_recipients: { type: integer, minimum: 0, description: "Получатели уведомлений type=maintenance" }
        notifications_opened: { type: integer, minimum: 0 }
        recipients_with_maintenance: { type: integer, minimum: 0 }
        notification_to_maintenance_rate: { type: number, minimum: 0, maximum: 1, nullable: true }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Не авторизован (нет/просрочен токен)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Нет доступа (RBAC)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Конфликт состояния (напр. VIN уже привязан)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Превышен лимит запросов (напр. попытки SMS-кода)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

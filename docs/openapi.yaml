        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/status:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Tickets]
      summary: Сменить статус тикета
      operationId: updateTicketStatus
      description: Валидирует допустимость перехода между статусами на сервере.
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Смена статуса тикета"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketStatusUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Статус изменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tickets/{ticketId}/claim:
    parameters:
      - { name: ticketId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Tickets]
      summary: Инженер берёт тикет в работу (самоназначение)
      operationId: claimTicket

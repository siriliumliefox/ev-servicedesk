openapi: 3.0.3
info:
  title: EV-ServiceDesk API
  version: "1.6.0"
  description: >
    API дипломного проекта «EV-ServiceDesk» (ООО «ЕТСавтоГомель»).
    Контракты сервисов: Auth, Vehicle, Aggregates & Maintenance, Tickets,
    Knowledge Base, Notifications, Analytics.
  contact:
    name: Sirilium / EV-ServiceDesk
    email: dev@ev-servicedesk.example.com

servers:
  - url: https://api.ev-servicedesk.example.com/v1
    description: Production
  - url: https://staging-api.ev-servicedesk.example.com/v1
    description: Staging
  - url: http://localhost:4010
    description: Local mock (Prism, `npm run mock`) — параллельная разработка клиентов
  - url: http://localhost:8000/v1
    description: Local backend (uvicorn)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Vehicle
  - name: Aggregates
    description: >
      Aggregates & Maintenance Service: справочник агрегатов, регламенты ТО, пороги и
      статусы «светофор». Спецификация алгоритма и таблица тестовых сценариев (Глава 5,
      ADR 0009): docs/specs/AGGREGATE_STATUS_ALGORITHM.md,
      docs/specs/aggregate_status_scenarios.yaml.
    externalDocs:
      description: Спецификация алгоритма «светофор» и тестовые сценарии (Глава 5)
      url: https://github.com/siriliumliefox/ev-servicedesk/blob/develop/docs/specs/AGGREGATE_STATUS_ALGORITHM.md
  - name: Uploads
    description: >
      Вложения тикетов и сообщений: presigned PUT в S3 и привязка по file_url (ADR 0004, ADR 0017).
  - name: Tickets
    description: >
      Tickets Service (Глава 13, ADR 0017). SLA — срок решения тикета: sla_due_at = created_at +
      норматив категории (app_crash — 4 ч, navigation — 8 ч, sim — 8 ч, audio — 24 ч, maintenance —
      48 ч; календарное время 24/7); вычисляется один раз при создании и не меняется (ни
      переоткрытием, ни ожиданием вендора). Первичный ответ — метрика аналитики, не срок.
      Граф статусов — updateTicketStatus, видимость тикетов — getTicket. Реал-тайм доставка
      событий тикета — WebSocket /v1/tickets/{ticketId}/ws, описание — docs/asyncapi.yaml
      (AsyncAPI 3.0).
    externalDocs:
      description: События тикета по WebSocket — AsyncAPI 3.0 (Глава 13, ADR 0017)
      url: https://github.com/siriliumliefox/ev-servicedesk/blob/develop/docs/asyncapi.yaml
  - name: KnowledgeBase
    description: >
      Knowledge Base Service (Глава 14, ADR 0018). Статья — «руководство» (guide) или
      «устранение неполадок» (troubleshooting) с деревом решений и категорией ошибки (= категория
      тикета). Версия — опубликованная редакция: снимок заголовка, текста, привязки и дерева
      (listKnowledgeArticleRevisions); черновик до первой публикации версий не имеет. Клиент и
      инженер видят только опубликованные статьи (черновик — 404), admin — все (RBAC-05).
      Узлы дерева: вопрос (от 1 варианта), решение (без вариантов, is_escalation=false),
      эскалация (is_escalation=true, «Создать обращение» — createTicket с source_article_id и
      source_node_id). Content — Markdown (CommonMark) без HTML.
  - name: Notifications
    description: >
      Уведомления клиента: прошивки, напоминания о ТО, новости и акции (ADR 0019). Аудитория
      фиксируется в момент публикации; push — доставка через FCM из исходящей очереди
      (notification_delivery), открытие push — markNotificationOpened. Тексты push без ПД.
  - name: Users
  - name: Analytics

paths:
  # ===================== AUTH SERVICE (шаг 2) =====================
  # Регистрация и логин объединены в единый passwordless-флоу по телефону:
  # request-code -> verify-code. Отдельного /auth/register нет намеренно —
  # verify-code сам создаёт User при первом входе (is_new_user в ответе).
  /auth/phone/request-code:
    post:
      tags: [Auth]
      summary: Запросить SMS-код для входа/регистрации по телефону
      operationId: requestPhoneCode
      description: >
        Отправляет SMS с одноразовым кодом на указанный номер (код 4–8 цифр, по умолчанию 4;
        TTL — ttl_seconds). 429 RATE_LIMITED — пауза между запросами и лимиты на номер и
        адрес (заголовок Retry-After); 422 PHONE_NOT_SUPPORTED — SMS на номер не доставляется;
        503 SMS_UNAVAILABLE (через default) — провайдер недоступен. Коды ошибок уточнены в 1.2.0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneRequestCode' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttl_seconds: { type: integer, example: 120 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/phone/verify-code:
    post:
      tags: [Auth]
      summary: Подтвердить SMS-код — вход или создание аккаунта (role=client)
      operationId: verifyPhoneCode
      description: >
        Проверяет код; создаёт пользователя при первом обращении.
        422 PD_CONSENT_REQUIRED — нет действующего согласия на обработку ПД и не передан pd_policy_version (99-З, ст. 5); либо иная ошибка валидации.
        Код не расходуется при 422 — запрос можно повторить с согласием.
        Сервер принимает code только из 4–8 цифр; pd_policy_version обрезается по краям,
        пустое значение равно отсутствию согласия, управляющие символы — 422.
        400: CODE_INVALID (details.attempts_left), CODE_EXPIRED (истёк, не запрашивался или
        уже использован), STAFF_PASSWORD_LOGIN (сотрудник — вход по паролю), ACCOUNT_DISABLED.
        429 RATE_LIMITED — исчерпаны попытки ввода кода или суточный лимит, заголовок Retry-After.
        Коды ошибок уточнены в 1.2.0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthTokens'
                  - type: object
                    properties:
                      is_new_user: { type: boolean }
                      user: { $ref: '#/components/schemas/UserPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить access-токен по refresh-токену
      operationId: refreshToken
      description: >
        Выдаёт новую пару токенов взамен истекающего access-токена; предъявленный
        refresh-токен отзывается (ротация). Повторное предъявление уже использованного
        токена отзывает все сессии пользователя (401). Сервер принимает refresh_token
        длиной до 512 символов. Уточнено в 1.2.0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Отозвать refresh-токен (выход с устройства)
      operationId: logout
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Регистрация/авторизация (свой аккаунт)"]
      description: Инвалидирует refresh-токен текущего устройства.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Токен отозван }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/pd-consent:
    delete:
      tags: [Auth]
      summary: Отозвать согласие на обработку персональных данных
      operationId: withdrawPdConsent
      x-required-roles: [client]
      x-rbac-action: ["Отзыв согласия на обработку ПД"]
      description: >
        99-З, ст. 10: отзыв в любое время и в той же форме, в которой дано согласие
        (в приложении). Фиксирует pd_consent.withdrawn_at, отзывает все refresh-токены и
        ставит пользователя в очередь анонимизации: удаление ПД и уведомление
        субъекта не позднее 15 дней, если нет иных правовых оснований.
        409 PD_CONSENT_NOT_ACTIVE — действующего согласия нет (уже отозвано).
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '202': { description: "Согласие отозвано, удаление ПД запланировано" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/staff/login:
    post:
      tags: [Auth]
      summary: Логин по паролю для Инженера/Администратора
      operationId: staffLogin
      description: >
        Отдельный флоу от клиентского SMS-логина. Учётные записи engineer/admin
        создаются администратором вручную (Глава 22), клиент этим эндпоинтом
        не пользуется.
        429 — превышен лимит неудачных попыток входа по номеру или адресу (N-06),
        заголовок Retry-After. Добавлено в 1.2.0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthTokens'
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/telegram/link:
    post:
      tags: [Auth]
      summary: Привязать Telegram к текущему аккаунту
      operationId: linkTelegram
      description: >
        Сохраняет telegram_id для уже авторизованного пользователя. Сервер принимает
        telegram_id длиной до 50 символов без управляющих символов (иначе 422);
        409 TELEGRAM_ALREADY_LINKED — привязан к другому аккаунту. Уточнено в 1.2.0.
      x-required-roles: [client]
      x-rbac-action: ["Регистрация/авторизация (свой аккаунт)"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramLinkRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Telegram привязан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== VEHICLE SERVICE (шаг 3) =====================
  # VIN-декодер вызывается ВНУТРИ POST /vehicles (серверная интеграция/мок),
  # отдельного публичного эндпоинта декодера нет. Fallback на случай, если
  # декодер недоступен/не распознал VIN: клиент передаёт vehicle_model_id
  # явно, выбрав модель через GET /vehicle-models.
  /vehicle-models:
    get:
      tags: [Vehicle]
      summary: Поиск моделей авто (fallback, если VIN-декодер не распознал VIN)
      operationId: searchVehicleModels
      description: Возвращает модели по подстроке бренда/модели для ручного выбора.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Добавление авто (VIN)", "CRUD регламентов ТО", "Публикация новостей/акций/прошивок"]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Подстрока по бренду/модели
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список моделей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /vehicles:
    get:
      tags: [Vehicle]
      summary: Список авто текущего клиента (поддержка нескольких авто на аккаунт)
      operationId: listVehicles
      description: Возвращает активные (не удалённые) автомобили текущего клиента.
      x-required-roles: [client]
      x-rbac-action: ["Просмотр авто (карточка)"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Список авто
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Vehicle]
      summary: Добавить автомобиль по VIN
      operationId: createVehicle
      x-required-roles: [client]
      x-rbac-action: ["Добавление авто (VIN)"]
      description: >
        Марка/модель/комплектация определяются через VIN-декодер (или мок).
        Если декодер не смог распознать VIN — 422 с кодом VIN_DECODE_FAILED,
        и клиент должен передать vehicle_model_id вручную повторным запросом
        (Vehicle без VehicleModel создать нельзя — FK NOT NULL, Глава 2);
        несуществующий vehicle_model_id — 422 VEHICLE_MODEL_NOT_FOUND.
        Контрольная цифра VIN не проверяется (VIN из ЕС), строчные буквы — 422 (ADR 0014).
        409 VIN_REGISTERED_TO_ANOTHER_ACCOUNT — VIN привязан к другому аккаунту (владелец
        не раскрывается); 409 VIN_ALREADY_ADDED — уже в этом аккаунте. Своё удалённое авто
        с тем же VIN восстанавливается вместе с историей работ (201, тот же id).
        429 RATE_LIMITED — лимит попыток добавления на пользователя (защита от перебора VIN),
        заголовок Retry-After. Уточнено и добавлено в 1.3.0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Автомобиль добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /vehicles/{vehicleId}:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicle]
      summary: Карточка автомобиля (марка/модель/пробег)
      operationId: getVehicle
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр авто (карточка)"]
      description: >
        Не включает статусы агрегатов — зона ответственности Aggregates
        Service (шаг 4). RBAC-роль сама по себе не даёт доступа к ЛЮБОМУ
        авто: client видит только свои (owner-check), engineer — только
        авто, связанное с тикетом в его работе (object-level check поверх
        роли, не только middleware RBAC) — иначе IDOR (см. Глава 25).
        admin — без ограничений.
        Уточнено в 1.3.0 (ADR 0014): engineer видит авто из тикетов, назначенных на него
        (любой статус), и из неназначенных тикетов в статусе new (очередь), в т. ч.
        удалённое (is_active=false); клиенту удалённое авто не видно. Невидимое авто — 404.
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Карточка автомобиля
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Vehicle]
      summary: Удалить авто из аккаунта (soft-delete, история сохраняется)
      operationId: deleteVehicle
      description: >
        Помечает автомобиль неактивным, не удаляя связанные записи (тикеты, история работ).
        client — только своё авто; уже удалённое — 404. Уточнено в 1.3.0.
        Повторное удаление: client — 404 (удалённое ему не видно), admin — 403 «Автомобиль
        удалён — изменения недоступны». Уточнено в 1.3.1 (ADR 0014).
      x-required-roles: [client, admin]
      x-rbac-action: ["Удаление авто (soft-delete)"]
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicleId}/mileage:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Vehicle]
      summary: Обновить пробег
      operationId: updateVehicleMileage
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Обновление пробега авто"]
      description: >
        Отдельный узкий эндпоинт вместо общего PATCH /vehicles/{id} — VIN и
        модель после создания не редактируются, менять можно только пробег.
        Уменьшение пробега запрещено (Глава 2) → 409, а не 422: это конфликт
        с текущим состоянием ресурса, не ошибка формата входных данных.
        Object-level (RBAC-01): client — только свой автомобиль; engineer — только
        автомобиль из назначенного ему тикета не в статусе resolved; admin — любой. Иначе 403
        (авто видно, менять нельзя) или 404 (авто не видно).
        Удалённое авто не изменяется: client — 404 (удалённое ему не видно), engineer/admin — 403
        «Автомобиль удалён — изменения недоступны». Уточнено в 1.3.1 (ADR 0014).
        409 MILEAGE_DECREASE — новый пробег меньше текущего (details.current_mileage).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MileageUpdateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Пробег обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }


  /vehicles/{vehicleId}/mileage-corrections:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Vehicle]
      summary: Исправить ошибочно введённый пробег (вниз)
      operationId: correctVehicleMileage
      x-required-roles: [admin]
      x-rbac-action: ["Исправление пробега вниз (с причиной, аудит)"]
      description: >
        Единственный способ уменьшить пробег (ADR 0006). Создаёт запись в append-only
        журнале VehicleMileageCorrection с причиной и автором; пробег меняется атомарно
        триггером БД. 409 MILEAGE_CORRECTION_STALE — expected_current_mileage не совпал с
        текущим; 409 MILEAGE_NOT_DECREASED — mileage не меньше текущего (для увеличения —
        updateVehicleMileage). Удалённое авто не изменяется — 403 «Автомобиль удалён —
        изменения недоступны». Уточнено в 1.3.1 (ADR 0014).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MileageCorrectionRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Пробег исправлен, запись аудита создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /vehicles/{vehicleId}/maintenance-records:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Vehicle]
      summary: История выполненных работ
      operationId: listMaintenanceRecords
      description: Постраничная история работ по автомобилю.
      x-required-roles: [client, engineer, admin]
      x-rbac-action: ["Просмотр авто (карточка)"]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '200':
          description: Страница истории ТО
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRecordList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Vehicle]
      summary: Зафиксировать выполненную работу
      operationId: createMaintenanceRecord
      x-required-roles: [engineer, admin]
      x-rbac-action: ["Фиксация замены агрегата"]
      description: >
        Клиент этим эндпоинтом не пользуется — история заполняется инженером/админом.
        engineer — только по своему тикету не в статусе resolved (иначе 403); запись
        связывается с последним таким тикетом. mileage_at_service выше текущего пробега
        поднимает пробег авто; записи задним числом допустимы. 422: PERFORMED_AT_IN_FUTURE
        (дата позже сегодняшней по Europe/Minsk), AGGREGATE_TYPE_NOT_FOUND,
        MAINTENANCE_SUBJECT_REQUIRED (нет ни агрегата, ни описания). Уточнено в 1.3.0.
        Удалённое авто не изменяется — 403 «Автомобиль удалён — изменения недоступны».
        Уточнено в 1.3.1 (ADR 0014). Запись с aggregate_type_code — работа по агрегату
        (осмотр, долив) и счётчик «светофора» НЕ сбрасывает; замена агрегата —
        replaceAggregateStatus. Уточнено в 1.3.2 (ADR 0016).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRecordCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/ServerError' }
        '201':
          description: Запись добавлена в историю
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===================== AGGREGATES & MAINTENANCE SERVICE (шаг 4) =====================
  /aggregate-types:
    get:
      tags: [Aggregates]

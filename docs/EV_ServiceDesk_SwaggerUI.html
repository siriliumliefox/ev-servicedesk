u043f\u0430\u0433\u0438\u043d\u0430\u0446\u0438\u0438 (\u0448\u0430\u0433 6) ---\n    PaginationMeta:\n      type: object\n      required: [page, page_size, total_items, total_pages]\n      properties:\n        page: { type: integer }\n        page_size: { type: integer }\n        total_items: { type: integer }\n        total_pages: { type: integer }\n\n    # --- Auth (\u0448\u0430\u0433 2) ---\n    PhoneE164:\n      type: string\n      pattern: '^\\+[1-9][0-9]{7,14}$'\n      maxLength: 16\n      example: \"+375291234567\"\n      description: \u0422\u0435\u043b\u0435\u0444\u043e\u043d \u0432 \u0444\u043e\u0440\u043c\u0430\u0442\u0435 E.164 (CHECK ck_app_user_phone_e164, \u0413\u043b\u0430\u0432\u0430 2). \u041f\u0414 \u043f\u043e N-07.\n\n    PhoneRequestCode:\n      type: object\n      required: [phone]\n      properties:\n        phone: { $ref: '#/components/schemas/PhoneE164' }\n\n    VerifyCodeRequest:\n      type: object\n      required: [phone, code]\n      properties:\n        phone: { $ref: '#/components/schemas/PhoneE164' }\n        code: { type: string, example: \"1234\" }\n        pd_policy_version:\n          type: string\n          maxLength: 20\n          nullable: true\n          example: \"2026-10\"\n          description: >-\n            \u0420\u0435\u0434\u0430\u043a\u0446\u0438\u044f \u043f\u043e\u043b\u0438\u0442\u0438\u043a\u0438 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0438 \u041f\u0414, \u0441 \u043a\u043e\u0442\u043e\u0440\u043e\u0439 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044c \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u043b\u0441\u044f \u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0438.\n            \u041e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u0430 \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u0439 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0438 \u043f\u0440\u0438 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0438 \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u044e\u0449\u0435\u0433\u043e \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u044f;\n            \u0444\u0438\u043a\u0441\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u0432 pd_consent \u0441 \u0434\u0430\u0442\u043e\u0439 (99-\u0417, \u0441\u0442. 5). \u0411\u0435\u0437 \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u044f \u2014 422 PD_CONSENT_REQUIRED.\n\n    RefreshRequest:\n      type: object\n      required: [refresh_token]\n      properties:\n        refresh_token: { type: string }\n\n    StaffLoginRequest:\n      type: object\n      required: [phone, password]\n      properties:\n        phone: { $ref: '#/components/schemas/PhoneE164' }\n        password: { type: string, format: password }\n\n    TelegramLinkRequest:\n      type: object\n      required: [telegram_id]\n      description: >\n        \u0414\u0430\u043d\u043d\u044b\u0435 Telegram Login Widget. auth_date \u0438 hash \u043d\u0435\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b \u0432 \u0441\u0445\u0435\u043c\u0435 (\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e\u0441\u0442\u044c 1.x),\n        \u043d\u043e \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b \u0434\u043b\u044f \u0441\u0435\u0440\u0432\u0435\u0440\u0430 (1.12.0, ADR 0029 \u043f. 16).\n      properties:\n        telegram_id: { type: string, description: \"\u041f\u043e\u043b\u0435 id \u0432\u0438\u0434\u0436\u0435\u0442\u0430\" }\n        auth_date: { type: integer, description: \"Unix-\u0432\u0440\u0435\u043c\u044f \u0430\u0432\u0442\u043e\u0440\u0438\u0437\u0430\u0446\u0438\u0438 \u0432 Telegram\" }\n        hash: { type: string, description: \"\u041f\u043e\u0434\u043f\u0438\u0441\u044c \u0432\u0438\u0434\u0436\u0435\u0442\u0430 (hex HMAC-SHA256)\" }\n        first_name: { type: string }\n        last_name: { type: string }\n        username: { type: string }\n        photo_url: { type: string }\n\n    StaffPasswordChangeRequest:\n      type: object\n      required: [current_password, new_password]\n      properties:\n        current_password: { type: string, format: password, minLength: 1, maxLength: 256 }\n        new_password: { type: string, format: password, minLength: 12, maxLength: 128 }\n\n    AuthTokens:\n      type: object\n      required: [access_token, refresh_token, expires_in]\n      properties:\n        access_token: { type: string }\n        refresh_token: { type: string }\n        expires_in: { type: integer, description: \"TTL access-\u0442\u043e\u043a\u0435\u043d\u0430, \u0441\u0435\u043a.\" }\n\n    UserPublic:\n      type: object\n      required: [id, phone, role, is_active, created_at]\n      properties:\n        id: { type: integer }\n        # \u0424\u043e\u0440\u043c\u0430\u0442 PhoneE164 \u2014 \u0431\u0435\u0437 allOf: \u0432 OpenAPI 3.0 nullable \u0440\u044f\u0434\u043e\u043c \u0441 allOf \u043d\u0435 \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 null.\n        phone:\n          type: string\n          nullable: true\n          pattern: '^\\+[1-9][0-9]{7,14}$'\n          maxLength: 16\n          example: \"+375291234567\"\n          description: >-\n            E.164 (\u043a\u0430\u043a PhoneE164); null \u2014 \u0430\u043d\u043e\u043d\u0438\u043c\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043d (\u041f\u0414 \u0443\u0434\u0430\u043b\u0435\u043d\u044b \u043f\u043e 99-\u0417, ADR 0006) \u0438\u043b\u0438 \u0441\u043a\u0440\u044b\u0442\n            \u043e\u0442 \u043a\u043b\u0438\u0435\u043d\u0442\u0430: \u0430\u0432\u0442\u043e\u0440-\u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a \u0432 TicketMessage.author (ADR 0017 \u043f. 12). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0.\n        role: { type: string, enum: [client, engineer, admin] }\n        is_active: { type: boolean, description: \"false \u2014 \u0432\u0445\u043e\u0434 \u0437\u0430\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0430\u043d \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c\" }\n        telegram_id:\n          type: string\n          nullable: true\n          description: >-\n            null \u2014 \u043d\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d, \u0430\u043d\u043e\u043d\u0438\u043c\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043d \u0438\u043b\u0438 \u0441\u043a\u0440\u044b\u0442 \u043e\u0442 \u043a\u043b\u0438\u0435\u043d\u0442\u0430: \u0430\u0432\u0442\u043e\u0440-\u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a \u0432\n            TicketMessage.author (ADR 0017 \u043f. 12). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0.\n        created_at: { type: string, format: date-time }\n\n    # --- Vehicle (\u0448\u0430\u0433 3) ---\n    # VehicleModel \u2014 \u0441 id, \u0434\u043b\u044f \u043f\u043e\u0438\u0441\u043a\u0430/\u0432\u044b\u0431\u043e\u0440\u0430 \u043c\u043e\u0434\u0435\u043b\u0438 \u0432\u0440\u0443\u0447\u043d\u0443\u044e (fallback VIN-\u0434\u0435\u043a\u043e\u0434\u0435\u0440\u0430).\n    VehicleModel:\n      type: object\n      required: [id, brand, model]\n      properties:\n        id: { type: integer }\n        brand: { type: string, example: \"Zeekr\" }\n        model: { type: string, example: \"001\" }\n        trim: { type: string, nullable: true }\n\n    # VehicleModelInfo \u2014 \u0431\u0435\u0437 id, \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043e\u0442\u043e\u0431\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u0432\u043d\u0443\u0442\u0440\u0438 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 Vehicle\n    # (\u043f\u043e\u0441\u043b\u0435 \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u044f \u043a\u043b\u0438\u0435\u043d\u0442\u0443 \u043d\u0435 \u043d\u0443\u0436\u043d\u043e \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e \u0441\u0441\u044b\u043b\u0430\u0442\u044c\u0441\u044f \u043d\u0430 \u043c\u043e\u0434\u0435\u043b\u044c \u043f\u043e id).\n    VehicleModelInfo:\n      type: object\n      required: [brand, model]\n      properties:\n        brand: { type: string }\n        model: { type: string }\n        trim: { type: string, nullable: true }\n\n    VehicleCreateRequest:\n      type: object\n      required: [vin]\n      properties:\n        vin:\n          type: string\n          minLength: 17\n          maxLength: 17\n          pattern: '^[A-HJ-NPR-Z0-9]{17}$'\n          example: \"LSVAU2183R2100001\"\n        vehicle_model_id:\n          type: integer\n          nullable: true\n          description: \u042f\u0432\u043d\u043e\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u0438\u0435 \u043c\u043e\u0434\u0435\u043b\u0438, \u0435\u0441\u043b\u0438 VIN-\u0434\u0435\u043a\u043e\u0434\u0435\u0440 \u043d\u0435 \u0441\u043c\u043e\u0433 \u0440\u0430\u0441\u043f\u043e\u0437\u043d\u0430\u0442\u044c \u0430\u0432\u0442\u043e\n\n    Vehicle:\n      type: object\n      required: [id, vin, mileage, vehicle_model_id, vehicle_model, is_active, created_at]\n      properties:\n        id: { type: integer }\n        vin: { type: string, minLength: 17, maxLength: 17 }\n        mileage: { type: integer, minimum: 0 }\n        is_active: { type: boolean }\n        vehicle_model_id:\n          type: integer\n          description: >\n            id \u043c\u043e\u0434\u0435\u043b\u0438 \u0430\u0432\u0442\u043e (VehicleModel) \u2014 \u0444\u0438\u043b\u044c\u0442\u0440 \u0441\u0442\u0430\u0442\u0435\u0439 \u0431\u0430\u0437\u044b \u0437\u043d\u0430\u043d\u0438\u0439 \u043f\u043e \u043c\u043e\u0434\u0435\u043b\u0438\n            (GET /knowledge-articles?vehicle_model_id=). \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.8.0 (\u0433\u043b\u0430\u0432\u0430 18, ADR 0022).\n        vehicle_model: { $ref: '#/components/schemas/VehicleModelInfo' }\n        current_firmware_version:\n          type: string\n          nullable: true\n          description: \u0412\u0435\u0440\u0441\u0438\u044f \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 \u0438\u0437 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0433\u043e \u0437\u0430\u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e FirmwareRelease (\u0441\u043c. PATCH /vehicles/{id}/firmware)\n        created_at: { type: string, format: date-time }\n\n    MileageUpdateRequest:\n      type: object\n      required: [mileage]\n      properties:\n        mileage: { type: integer, minimum: 0 }\n\n    MileageCorrectionRequest:\n      type: object\n      required: [expected_current_mileage, mileage, reason]\n      properties:\n        expected_current_mileage:\n          type: integer\n          minimum: 0\n          description: \u041f\u0440\u043e\u0431\u0435\u0433, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0432\u0438\u0434\u0435\u043b \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440 (\u0437\u0430\u0449\u0438\u0442\u0430 \u043e\u0442 \u0433\u043e\u043d\u043a\u0438 \u2192 409 \u043f\u0440\u0438 \u0440\u0430\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u0438).\n        mileage: { type: integer, minimum: 0, description: \"\u041d\u043e\u0432\u043e\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435, \u0441\u0442\u0440\u043e\u0433\u043e \u043c\u0435\u043d\u044c\u0448\u0435 \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e\" }\n        reason: { type: string, minLength: 1, maxLength: 500 }\n\n    # aggregate_type_code (\u043d\u0435 id) \u2014 \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u044b\u0439 \u043a\u043e\u043d\u0442\u0440\u0430\u043a\u0442 \u0441\u0441\u044b\u043b\u0430\u0435\u0442\u0441\u044f \u043d\u0430 \u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u044b\u0439\n    # \u0431\u0438\u0437\u043d\u0435\u0441-\u043a\u043b\u044e\u0447 \u0441\u043f\u0440\u0430\u0432\u043e\u0447\u043d\u0438\u043a\u0430 AggregateType, \u0430 \u043d\u0435 \u043d\u0430 \u0432\u043d\u0443\u0442\u0440\u0435\u043d\u043d\u0438\u0439 surrogate id (\u0413\u043b\u0430\u0432\u0430 2).\n    MaintenanceRecord:\n      type: object\n      required: [id, performed_at, mileage_at_service, kind]\n      properties:\n        id: { type: integer }\n        aggregate_type_code: { type: string, nullable: true }\n        performed_by: { $ref: '#/components/schemas/UserPublic' }\n        performed_at: { type: string, format: date }\n        mileage_at_service: { type: integer }\n        description: { type: string, nullable: true }\n        kind:\n          type: string\n          enum: [replacement, work]\n          description: >\n            replacement \u2014 \u0437\u0430\u043c\u0435\u043d\u0430 \u0430\u0433\u0440\u0435\u0433\u0430\u0442\u0430 (replaceAggregateStatus), \u0441\u0431\u0440\u043e\u0441\u0438\u043b\u0430 \u0432\u044b\u0440\u0430\u0431\u043e\u0442\u043a\u0443;\n            work \u2014 \u0440\u0430\u0431\u043e\u0442\u0430 (createMaintenanceRecord: \u043e\u0441\u043c\u043e\u0442\u0440, \u0434\u043e\u043b\u0438\u0432, \u0440\u0430\u0431\u043e\u0442\u0430 \u0431\u0435\u0437 \u0430\u0433\u0440\u0435\u0433\u0430\u0442\u0430),\n            \u0432\u044b\u0440\u0430\u0431\u043e\u0442\u043a\u0443 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442. \u0417\u0430\u043f\u0438\u0441\u0438 \u0434\u043e 1.9.0 \u2014 work. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.9.0 (\u0433\u043b\u0430\u0432\u0430 19, ADR 0023).\n\n    MaintenanceRecordCreateRequest:\n      type: object\n      required: [performed_at, mileage_at_service]\n      properties:\n        aggregate_type_code:\n          type: string\n          nullable: true\n          description: \u041a\u043e\u0434 \u0430\u0433\u0440\u0435\u0433\u0430\u0442\u0430 (\u0441\u043f\u0440\u0430\u0432\u043e\u0447\u043d\u0438\u043a AggregateType), \u043b\u0438\u0431\u043e null \u0434\u043b\u044f \u043e\u0431\u0449\u0435\u0439 \u0440\u0430\u0431\u043e\u0442\u044b\n        performed_at: { type: string, format: date }\n        mileage_at_service: { type: integer, minimum: 0 }\n        description: { type: string, nullable: true, maxLength: 255 }\n\n    MaintenanceRecordList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/MaintenanceRecord' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    # --- Aggregates & Maintenance (\u0448\u0430\u0433 4) ---\n    AggregateType:\n      type: object\n      required: [code, name]\n      properties:\n        code: { type: string, example: \"engine_oil\" }\n        name: { type: string, example: \"\u041c\u0430\u0441\u043b\u043e \u0432 \u0434\u0432\u0438\u0433\u0430\u0442\u0435\u043b\u0435\" }\n\n    AggregateTypeCreateRequest:\n      type: object\n      required: [code, name]\n      properties:\n        code: { type: string, maxLength: 50, pattern: '^[a-z][a-z0-9_]{1,49}$', example: \"brake_fluid\" }\n        name: { type: string, minLength: 1, maxLength: 100, example: \"\u0422\u043e\u0440\u043c\u043e\u0437\u043d\u0430\u044f \u0436\u0438\u0434\u043a\u043e\u0441\u0442\u044c\" }\n\n    MaintenanceRegulation:\n      type: object\n      required: [id, vehicle_model_id, aggregate_type_code, is_archived]\n      properties:\n        id: { type: integer }\n        vehicle_model_id: { type: integer }\n        aggregate_type_code: { type: string }\n        interval_km: { type: integer, nullable: true }\n        interval_months: { type: integer, nullable: true }\n        is_archived: { type: boolean }\n\n    MaintenanceRegulationCreateRequest:\n      type: object\n      required: [vehicle_model_id, aggregate_type_code]\n      description: \u041d\u0443\u0436\u043d\u043e \u0443\u043a\u0430\u0437\u0430\u0442\u044c interval_km \u0438/\u0438\u043b\u0438 interval_months \u2014 \u0445\u043e\u0442\u044f \u0431\u044b \u043e\u0434\u043d\u043e.\n      properties:\n        vehicle_model_id: { type: integer }\n        aggregate_type_code: { type: string }\n        interval_km: { type: integer, nullable: true, minimum: 1 }\n        interval_months: { type: integer, nullable: true, minimum: 1 }\n\n    AggregateStatus:\n      type: object\n      required: [aggregate_type_code, aggregate_type_name, status]\n      properties:\n        aggregate_type_code: { type: string }\n        aggregate_type_name: { type: string }\n        status:\n          type: string\n          enum: [green, yellow, red, unknown]\n          description: >\n            \u041f\u043e \u0442\u043e\u0447\u043d\u043e\u043c\u0443 \u043f\u0440\u043e\u0446\u0435\u043d\u0442\u0443 \u0432\u044b\u0440\u0430\u0431\u043e\u0442\u043a\u0438 p \u0438 \u043f\u043e\u0440\u043e\u0433\u0430\u043c (\u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e 70/100):\n            green p < 70, yellow 70 \u2264 p \u2264 100, red p > 100;\n            unknown \u2014 \u043d\u0435\u0442 \u0438\u0441\u0442\u043e\u0440\u0438\u0438 \u0437\u0430\u043c\u0435\u043d\u044b (\u043d\u0435 \u043e\u0448\u0438\u0431\u043a\u0430, \u0413\u043b\u0430\u0432\u0430 5) \u0438\u043b\u0438, \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u043e\u0442\u0432\u0435\u0442\u0435\n            replaceAggregateStatus, \u043d\u0435\u0442 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u0430 (1.3.2, ADR 0016).\n            \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u2014 docs/specs/AGGREGATE_STATUS_ALGORITHM.md.\n        percentage:\n          type: number\n          nullable: true\n          description: >\n            % \u0432\u044b\u0440\u0430\u0431\u043e\u0442\u043a\u0438 \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430 \u2014 \u0445\u0443\u0434\u0448\u0438\u0439 \u0438\u0437 \u043f\u0440\u043e\u0431\u0435\u0433\u0430 \u0438 \u0432\u0440\u0435\u043c\u0435\u043d\u0438, \u0443\u0441\u0435\u0447\u0451\u043d \u0432\u043d\u0438\u0437 \u0434\u043e 0.1\n            (\u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043f\u043e\u043a\u0430\u0437\u0430, \u0446\u0432\u0435\u0442 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442 status). null \u043f\u0440\u0438 status=unknown.\n        last_replaced_at: { type: string, format: date, nullable: true }\n        last_replaced_mileage: { type: integer, nullable: true }\n        remaining_km:\n          type: integer\n          nullable: true\n          description: \u041e\u0441\u0442\u0430\u0442\u043e\u043a \u0434\u043e \u043a\u043e\u043d\u0446\u0430 \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430 \u043f\u043e \u043f\u0440\u043e\u0431\u0435\u0433\u0443; < 0 \u2014 \u043f\u0435\u0440\u0435\u043f\u0440\u043e\u0431\u0435\u0433; null \u2014 \u043d\u0435\u0442 \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430/\u0434\u0430\u043d\u043d\u044b\u0445.\n        remaining_days:\n          type: integer\n          nullable: true\n          description: >\n            \u041e\u0441\u0442\u0430\u0442\u043e\u043a \u0434\u043e \u043a\u043e\u043d\u0446\u0430 \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430 \u043f\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u0432 \u0434\u043d\u044f\u0445; < 0 \u2014 \u043f\u0440\u043e\u0441\u0440\u043e\u0447\u0435\u043d\u043e; null \u2014 \u043d\u0435\u0442\n            \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430/\u0434\u0430\u043d\u043d\u044b\u0445. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.1.0.\n\n    AggregateStatusThresholds:\n      type: object\n      required: [yellow_from_percent, red_above_percent, updated_at, reminder_before_km, reminder_before_days]\n      properties:\n        yellow_from_percent: { type: integer, minimum: 1, maximum: 199, example: 70 }\n        red_above_percent: { type: integer, minimum: 2, maximum: 200, example: 100 }\n        updated_at: { type: string, format: date-time }\n        updated_by_user_id:\n          type: integer\n          nullable: true\n          description: \u041a\u0442\u043e \u0438\u0437\u043c\u0435\u043d\u0438\u043b \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u043c; null \u2014 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f \u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e \u0438\u0437 \u043c\u0438\u0433\u0440\u0430\u0446\u0438\u0438.\n        reminder_before_km:\n          type: integer\n          minimum: 1\n          maximum: 100000\n          example: 1000\n          description: >-\n            \u041d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u0435 \u043e \u0422\u041e, \u043a\u043e\u0433\u0434\u0430 \u0434\u043e \u043f\u043e\u0440\u043e\u0433\u0430 \u00ab\u0442\u0440\u0435\u0431\u0443\u0435\u0442\u0441\u044f \u0437\u0430\u043c\u0435\u043d\u0430\u00bb \u043e\u0441\u0442\u0430\u043b\u043e\u0441\u044c \u043d\u0435 \u0431\u043e\u043b\u044c\u0448\u0435 N \u043a\u043c\n            (N-10). \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.6.0 (ADR 0019 \u043f. 5).\n        reminder_before_days:\n          type: integer\n          minimum: 1\n          maximum: 365\n          example: 14\n          description: \u0422\u043e \u0436\u0435 \u043f\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u2014 \u043d\u0435 \u0431\u043e\u043b\u044c\u0448\u0435 N \u0434\u043d\u0435\u0439. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.6.0.\n\n    AggregateStatusThresholdsUpdateRequest:\n      type: object\n      required: [yellow_from_percent, red_above_percent]\n      description: >-\n        1 \u2264 yellow_from_percent < red_above_percent \u2264 200, \u0438\u043d\u0430\u0447\u0435 422. reminder_before_km \u0438\n        reminder_before_days \u043d\u0435\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b (\u043d\u0435 \u043f\u0435\u0440\u0435\u0434\u0430\u043d\u044b \u2014 \u043d\u0435 \u043c\u0435\u043d\u044f\u044e\u0442\u0441\u044f), \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u044b \u0432 1.6.0.\n      properties:\n        yellow_from_percent: { type: integer, minimum: 1, maximum: 199 }\n        red_above_percent: { type: integer, minimum: 2, maximum: 200 }\n        reminder_before_km: { type: integer, minimum: 1, maximum: 100000 }\n        reminder_before_days: { type: integer, minimum: 1, maximum: 365 }\n\n    AggregateReplaceRequest:\n      type: object\n      required: [replaced_at, mileage_at_replacement]\n      properties:\n        replaced_at: { type: string, format: date }\n        mileage_at_replacement: { type: integer, minimum: 0 }\n        description:\n          type: string\n          nullable: true\n          description: >-\n            \u041f\u0440\u043e\u0431\u0440\u0430\u0441\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0432 \u0441\u0432\u044f\u0437\u0430\u043d\u043d\u0443\u044e \u0437\u0430\u043f\u0438\u0441\u044c MaintenanceRecord; \u0434\u043e 255 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 (\u043a\u0430\u043a \u0443\n            MaintenanceRecord), \u0434\u043b\u0438\u043d\u043d\u0435\u0435 \u2014 422. \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.7.1.\n\n    # --- Uploads ---\n    PresignRequest:\n      type: object\n      required: [file_name, file_type]\n      properties:\n        file_name:\n          type: string\n          example: \"photo.jpg\"\n          description: >-\n            \u0418\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043d\u0438\u0435 \u2014 \u043a\u043b\u044e\u0447 \u043e\u0431\u044a\u0435\u043a\u0442\u0430 uploads/{user_id}/{uuid}{\u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043d\u0438\u0435};\n            \u0438\u043c\u044f \u043c\u043e\u0436\u0435\u0442 \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442\u044c \u041f\u0414 \u0438 \u043d\u0435 \u0445\u0440\u0430\u043d\u0438\u0442\u0441\u044f (ADR 0017). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0.\n        file_type: { type: string, enum: [photo, video] }\n\n    PresignResponse:\n      type: object\n      required: [upload_url, file_url, expires_at]\n      properties:\n        upload_url:\n          type: string\n          description: >-\n            PUT \u0441\u044e\u0434\u0430 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435 \u043d\u0430\u043f\u0440\u044f\u043c\u0443\u044e \u0432 S3. Presigned PUT, \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u0435\u0442 \u0434\u043e expires_at\n            (15 \u043c\u0438\u043d\u0443\u0442); MIME \u043a \u043f\u043e\u0434\u043f\u0438\u0441\u0438 \u043d\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d (\u0443\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0).\n        file_url:\n          type: string\n          description: >-\n            \u0418\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0442\u043e\u0440 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u043e\u0431\u044a\u0435\u043a\u0442\u0430 \u2014 \u043f\u0435\u0440\u0435\u0434\u0430\u0442\u044c \u0432 attachments. \u041d\u0435 \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u0430\u044f \u0441\u0441\u044b\u043b\u043a\u0430:\n            backend \u0445\u0440\u0430\u043d\u0438\u0442 \u043a\u043b\u044e\u0447 \u043e\u0431\u044a\u0435\u043a\u0442\u0430 S3 (ticket_attachment.object_key) \u0438 \u0432\u044b\u0434\u0430\u0451\u0442\n            presigned URL \u043f\u0440\u0438 \u0447\u0442\u0435\u043d\u0438\u0438 (ADR 0004).\n        expires_at: { type: string, format: date-time, description: \"\u0421\u0440\u043e\u043a \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f upload_url \u2014 15 \u043c\u0438\u043d\u0443\u0442\" }\n\n    # --- Tickets (\u0448\u0430\u0433 5) ---\n    TicketAttachmentInput:\n      type: object\n      required: [file_url, file_type]\n      properties:\n        file_url:\n          type: string\n          description: >-\n            file_url \u0438\u0437 PresignResponse. Backend \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442, \u0447\u0442\u043e \u043e\u0431\u044a\u0435\u043a\u0442 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d \u0442\u0435\u043a\u0443\u0449\u0438\u043c\n            \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u0435\u043c, \u0438 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442 \u043a\u043b\u044e\u0447 \u043e\u0431\u044a\u0435\u043a\u0442\u0430, MIME \u0438 \u0440\u0430\u0437\u043c\u0435\u0440 (ADR 0004).\n            \u0412 \u043e\u0442\u0432\u0435\u0442\u0430\u0445 (TicketDetail, TicketMessage) \u2014 presigned GET URL \u043d\u0430 15 \u043c\u0438\u043d\u0443\u0442 (ADR 0017,\n            \u0443\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0).\n        file_type: { type: string, enum: [photo, video] }\n\n    TicketCreateRequest:\n      type: object\n      required: [vehicle_id, category, description]\n      properties:\n        vehicle_id: { type: integer }\n        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }\n        description:\n          type: string\n          description: >-\n            1\u20264000 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 \u043f\u043e\u0441\u043b\u0435 \u043e\u0431\u0440\u0435\u0437\u043a\u0438 \u043f\u0440\u043e\u0431\u0435\u043b\u043e\u0432 \u043f\u043e \u043a\u0440\u0430\u044f\u043c, \u0438\u043d\u0430\u0447\u0435 422 (\u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u0441\u0435\u0440\u0432\u0435\u0440,\n            ADR 0017 \u043f. 13). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0.\n        source_article_id: { type: integer, nullable: true }\n        source_node_id: { type: integer, nullable: true }\n        attachments:\n          type: array\n          items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n        client_request_id: { $ref: '#/components/schemas/ClientRequestId' }\n\n    ClientRequestId:\n      type: string\n      format: uuid\n      nullable: true\n      description: >-\n        \u041a\u043b\u044e\u0447 \u043f\u043e\u0432\u0442\u043e\u0440\u0430: UUID, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043a\u043b\u0438\u0435\u043d\u0442 \u0441\u043e\u0437\u0434\u0430\u0451\u0442 \u0434\u043b\u044f \u0447\u0435\u0440\u043d\u043e\u0432\u0438\u043a\u0430 (\u0444\u043e\u0440\u043c\u0430 \u0442\u0438\u043a\u0435\u0442\u0430, \u043f\u043e\u043b\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f) \u0438\n        \u043f\u0435\u0440\u0435\u0434\u0430\u0451\u0442 \u0432\u043e \u0432\u0441\u0435\u0445 \u043f\u043e\u043f\u044b\u0442\u043a\u0430\u0445 \u0435\u0433\u043e \u043e\u0442\u043f\u0440\u0430\u0432\u043a\u0438, \u043f\u043e\u043a\u0430 \u043d\u0435 \u043f\u043e\u043b\u0443\u0447\u0438\u0442 \u043e\u0442\u0432\u0435\u0442. \u041f\u043e\u0432\u0442\u043e\u0440 \u043f\u043e\u0441\u043b\u0435 \u043e\u0431\u0440\u044b\u0432\u0430\n        \u0441\u0432\u044f\u0437\u0438 \u043d\u0435 \u0441\u043e\u0437\u0434\u0430\u0451\u0442 \u0434\u0443\u0431\u043b\u044c (#111). \u041d\u043e\u0432\u044b\u0439 \u0447\u0435\u0440\u043d\u043e\u0432\u0438\u043a \u0438\u043b\u0438 \u0438\u0437\u043c\u0435\u043d\u0451\u043d\u043d\u044b\u0439 \u0442\u0435\u043a\u0441\u0442 \u2014 \u043d\u043e\u0432\u044b\u0439 \u043a\u043b\u044e\u0447.\n        \u041e\u0431\u043b\u0430\u0441\u0442\u044c \u043a\u043b\u044e\u0447\u0430: \u0442\u0438\u043a\u0435\u0442 \u2014 \u0430\u0432\u0442\u043e, \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u2014 \u0442\u0438\u043a\u0435\u0442 \u0438 \u0430\u0432\u0442\u043e\u0440. null \u0438\u043b\u0438 \u043d\u0435\u0442 \u043f\u043e\u043b\u044f \u2014 \u043a\u0430\u0436\u0434\u044b\u0439\n        \u0437\u0430\u043f\u0440\u043e\u0441 \u0441\u043e\u0437\u0434\u0430\u0451\u0442 \u043d\u043e\u0432\u0443\u044e \u0437\u0430\u043f\u0438\u0441\u044c. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.13.0 (ADR 0031).\n\n    Ticket:\n      type: object\n      description: >-\n        \u042d\u043b\u0435\u043c\u0435\u043d\u0442 \u0441\u043f\u0438\u0441\u043a\u0430 \u0442\u0438\u043a\u0435\u0442\u043e\u0432. vehicle_model (\u043c\u043e\u0434\u0435\u043b\u044c \u0430\u0432\u0442\u043e \u0442\u0438\u043a\u0435\u0442\u0430) \u0438 summary \u2014 \u0434\u043b\u044f \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438\n        \u043a\u0430\u043d\u0431\u0430\u043d\u0430 \u0438 \u0441\u043f\u0438\u0441\u043a\u0430 \u043a\u043b\u0438\u0435\u043d\u0442\u0430; \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u044b \u0432 1.4.0 (ADR 0017, \u0437\u0430\u043a\u0440\u044b\u0432\u0430\u0435\u0442 ADR 0012 \u043f. 5).\n      required: [id, category, status, sla_due_at, is_overdue, created_at, vehicle_model, summary]\n      properties:\n        id: { type: integer }\n        vehicle_id: { type: integer }\n        vehicle_model: { $ref: '#/components/schemas/VehicleModelInfo' }\n        summary:\n          type: string\n          maxLength: 140\n          description: \u041f\u0435\u0440\u0432\u044b\u0435 140 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044f \u0442\u0438\u043a\u0435\u0442\u0430 (description). \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.4.0.\n        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }\n        status: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }\n        assigned_engineer_id: { type: integer, nullable: true }\n        sla_due_at:\n          type: string\n          format: date-time\n          description: >-\n            \u0421\u0440\u043e\u043a \u0440\u0435\u0448\u0435\u043d\u0438\u044f: created_at + \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 (\u0442\u0435\u0433 Tickets); \u0432\u044b\u0447\u0438\u0441\u043b\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u0438\n            \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u0438 \u0438 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f (ADR 0017). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0.\n        is_overdue: { type: boolean, description: \"\u0412\u044b\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u043e\u0435 \u043f\u043e\u043b\u0435: now() > sla_due_at \u0438 status != resolved\" }\n        created_at: { type: string, format: date-time }\n        resolved_at:\n          type: string\n          format: date-time\n          nullable: true\n          description: \u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u043e \u0442\u043e\u0433\u0434\u0430 \u0438 \u0442\u043e\u043b\u044c\u043a\u043e \u0442\u043e\u0433\u0434\u0430, \u043a\u043e\u0433\u0434\u0430 status = resolved (A-05).\n\n    VehicleContext:\n      type: object\n      description: \u0410\u0432\u0442\u043e\u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d\u043d\u044b\u0439 \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442 \u0430\u0432\u0442\u043e \u043d\u0430 \u043c\u043e\u043c\u0435\u043d\u0442 \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u044f \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u0442\u0438\u043a\u0435\u0442\u0430.\n      properties:\n        vehicle: { $ref: '#/components/schemas/Vehicle' }\n        aggregate_statuses:\n          type: array\n          items: { $ref: '#/components/schemas/AggregateStatus' }\n\n    TicketDetail:\n      allOf:\n        - $ref: '#/components/schemas/Ticket'\n        - type: object\n          required: [firmware_version_at_creation, source_article, client]\n          properties:\n            description: { type: string }\n            client:\n              allOf:\n                - $ref: '#/components/schemas/UserPublic'\n              description: >-\n                \u041a\u043b\u0438\u0435\u043d\u0442 \u2014 \u0432\u043b\u0430\u0434\u0435\u043b\u0435\u0446 \u0430\u0432\u0442\u043e \u0442\u0438\u043a\u0435\u0442\u0430: \u0438\u043d\u0436\u0435\u043d\u0435\u0440\u0443 \u0438 \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0443 \u2014 \u043a\u043e\u043c\u0443 \u043e\u043d\u0438 \u043e\u0442\u0432\u0435\u0447\u0430\u044e\u0442, \u043a\u043b\u0438\u0435\u043d\u0442\u0443 \u2014\n                \u043e\u043d \u0441\u0430\u043c. is_active=false \u2014 \u043a\u043b\u0438\u0435\u043d\u0442 \u0437\u0430\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0430\u043d \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c: \u0432\u043e\u0439\u0442\u0438 \u043e\u043d \u043d\u0435 \u043c\u043e\u0436\u0435\u0442,\n                \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u044f \u0435\u043c\u0443 \u043d\u0435 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u044e\u0442\u0441\u044f, \u0430 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0432 \u0447\u0430\u0442 \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u044e\u0442\u0441\u044f \u0438 \u0441\u0442\u0430\u043d\u0443\u0442 \u0432\u0438\u0434\u043d\u044b \u0435\u043c\u0443\n                \u043f\u043e\u0441\u043b\u0435 \u0440\u0430\u0437\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u043a\u0438 (\u0433\u043b\u043e\u0441\u0441\u0430\u0440\u0438\u0439 \u00ab\u0411\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u043a\u0430 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f\u00bb). phone=null \u2014 \u041f\u0414\n                \u0430\u043d\u043e\u043d\u0438\u043c\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043d\u044b. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.14.0 (#104, ADR 0032).\n            firmware_version_at_creation:\n              type: string\n              nullable: true\n              description: >-\n                \u0412\u0435\u0440\u0441\u0438\u044f \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 \u0430\u0432\u0442\u043e \u043d\u0430 \u043c\u043e\u043c\u0435\u043d\u0442 \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u044f \u0442\u0438\u043a\u0435\u0442\u0430 (\u0441\u043d\u0438\u043c\u043e\u043a, N-09); null \u2014 \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0430\n                \u043d\u0435 \u0431\u044b\u043b\u0430 \u0437\u0430\u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u0430. \u0422\u0435\u043a\u0443\u0449\u0430\u044f \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0430 \u2014 vehicle_context.vehicle.current_firmware_version.\n                \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.4.0 (ADR 0017).\n            source_article:\n              type: object\n              nullable: true\n              description: >-\n                \u00ab\u041f\u043e\u043c\u0435\u0442\u043a\u0430\u00bb \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u0438 \u0438\u0437 \u0434\u0435\u0440\u0435\u0432\u0430 \u0440\u0435\u0448\u0435\u043d\u0438\u0439: \u0441\u0442\u0430\u0442\u044c\u044f \u0432 \u0432\u0435\u0440\u0441\u0438\u0438 \u043d\u0430 \u043c\u043e\u043c\u0435\u043d\u0442 \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u0438\n                (ADR 0018 \u043f. 11); null \u2014 \u0442\u0438\u043a\u0435\u0442 \u0441\u043e\u0437\u0434\u0430\u043d \u043d\u0435 \u0438\u0437 \u0431\u0430\u0437\u044b \u0437\u043d\u0430\u043d\u0438\u0439. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0.\n              required: [id, title, version]\n              properties:\n                id: { type: integer }\n                title: { type: string, description: \u0417\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \u0432 \u044d\u0442\u043e\u0439 \u0432\u0435\u0440\u0441\u0438\u0438. }\n                version: { type: integer }\n            attachments:\n              type: array\n              items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n            vehicle_context: { $ref: '#/components/schemas/VehicleContext' }\n\n    TicketList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/Ticket' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    TicketMessageCreateRequest:\n      type: object\n      required: [body]\n      properties:\n        body:\n          type: string\n          description: >-\n            1\u20264000 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 \u043f\u043e\u0441\u043b\u0435 \u043e\u0431\u0440\u0435\u0437\u043a\u0438 \u043f\u0440\u043e\u0431\u0435\u043b\u043e\u0432 \u043f\u043e \u043a\u0440\u0430\u044f\u043c, \u0438\u043d\u0430\u0447\u0435 422 (\u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u0441\u0435\u0440\u0432\u0435\u0440,\n            ADR 0017 \u043f. 13). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0.\n        attachments:\n          type: array\n          items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n        client_request_id: { $ref: '#/components/schemas/ClientRequestId' }\n\n    TicketMessage:\n      type: object\n      description: >-\n        \u0421\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u0447\u0430\u0442\u0430 \u0442\u0438\u043a\u0435\u0442\u0430. \u041a\u043b\u0438\u0435\u043d\u0442\u0443 \u0430\u0432\u0442\u043e\u0440-\u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a (engineer/admin) \u043e\u0442\u0434\u0430\u0451\u0442\u0441\u044f \u0441 phone \u0438\n        telegram_id = null (ADR 0017 \u043f. 12). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0.\n      required: [id, author, body, created_at]\n      properties:\n        id: { type: integer }\n        author: { $ref: '#/components/schemas/UserPublic' }\n        body: { type: string }\n        attachments:\n          type: array\n          items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n        created_at: { type: string, format: date-time }\n\n    TicketMessageList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/TicketMessage' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    # --- Knowledge Base (\u0448\u0430\u0433 5) ---\n    KnowledgeArticleCreateRequest:\n      type: object\n      required: [article_type, title, content]\n      properties:\n        vehicle_model_id: { type: integer, nullable: true }\n        firmware_release_id:\n          type: integer\n          nullable: true\n          description: \u0421\u0442\u0430\u0442\u044c\u044f \u043f\u043e\u0434 \u0432\u0435\u0440\u0441\u0438\u044e \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 (C-06); \u0442\u0440\u0435\u0431\u0443\u0435\u0442 vehicle_model_id \u0442\u043e\u0439 \u0436\u0435 \u043c\u043e\u0434\u0435\u043b\u0438.\n        article_type: { type: string, enum: [guide, troubleshooting] }\n        category:\n          type: string\n          nullable: true\n          enum: [navigation, audio, sim, app_crash, maintenance, null]\n          description: \u041e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u0430 \u0434\u043b\u044f troubleshooting (\u0438\u043d\u0430\u0447\u0435 422). \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0.\n        title: { type: string, maxLength: 200 }\n        content:\n          type: string\n          description: Markdown (CommonMark) \u0431\u0435\u0437 HTML, \u0434\u043e 50 000 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 (\u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u0441\u0435\u0440\u0432\u0435\u0440, 1.5.0).\n\n    KnowledgeArticleUpdateRequest:\n      type: object\n      description: \u041c\u0435\u043d\u044f\u044e\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u0435\u0440\u0435\u0434\u0430\u043d\u043d\u044b\u0435 \u043f\u043e\u043b\u044f. \u0420\u0430\u0441\u0448\u0438\u0440\u0435\u043d\u043e \u0432 1.5.0.\n      properties:\n        title: { type: string, maxLength: 200 }\n        content: { type: string }\n        category:\n          type: string\n          nullable: true\n          enum: [navigation, audio, sim, app_crash, maintenance, null]\n          description: \u0423 troubleshooting \u043d\u0435 \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c null. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0.\n        vehicle_model_id: { type: integer, nullable: true, description: \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0. }\n        firmware_release_id: { type: integer, nullable: true, description: \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0. }\n        is_published: { type: boolean }\n\n    KnowledgeArticleRevisionSummary:\n      type: object\n      description: \u041e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u0430\u044f \u0440\u0435\u0434\u0430\u043a\u0446\u0438\u044f \u0441\u0442\u0430\u0442\u044c\u0438 \u0432 \u0438\u0441\u0442\u043e\u0440\u0438\u0438 \u0432\u0435\u0440\u0441\u0438\u0439. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0.\n      required: [version, title, published_at]\n      properties:\n        version: { type: integer }\n        title: { type: string }\n        published_at: { type: string, format: date-time }\n\n    KnowledgeArticleRevision:\n      description: >-\n        \u0421\u043d\u0438\u043c\u043e\u043a \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u043e\u0439 \u0440\u0435\u0434\u0430\u043a\u0446\u0438\u0438: \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u043d\u0438\u0435 \u0438 \u0434\u0435\u0440\u0435\u0432\u043e \u0440\u0435\u0448\u0435\u043d\u0438\u0439 \u043d\u0430 \u043c\u043e\u043c\u0435\u043d\u0442 \u043f\u0443\u0431\u043b\u0438\u043a\u0430\u0446\u0438\u0438.\n        \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0 (ADR 0018 \u043f. 1).\n      allOf:\n        - $ref: '#/components/schemas/KnowledgeArticleRevisionSummary'\n        - type: object\n          required:\n            [article_id, content, category, vehicle_model_id, firmware_release_id, decision_tree]\n          properties:\n            article_id: { type: integer }\n            content: { type: string }\n            category:\n              type: string\n              nullable: true\n              enum: [navigation, audio, sim, app_crash, maintenance, null]\n            vehicle_model_id: { type: integer, nullable: true }\n            firmware_release_id: { type: integer, nullable: true }\n            decision_tree:\n              type: array\n              items: { $ref: '#/components/schemas/DecisionTreeNode' }\n\n    KnowledgeArticleRevisionList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/KnowledgeArticleRevisionSummary' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    KnowledgeArticle:\n      type: object\n      required: [id, article_type, category, title, version, is_published, updated_at]\n      properties:\n        id: { type: integer }\n        vehicle_model_id: { type: integer, nullable: true }\n        firmware_release_id:\n          type: integer\n          nullable: true\n          description: \u0421\u0442\u0430\u0442\u044c\u044f \u043f\u043e\u0434 \u0432\u0435\u0440\u0441\u0438\u044e \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 (C-06); \u0442\u0440\u0435\u0431\u0443\u0435\u0442 vehicle_model_id \u0442\u043e\u0439 \u0436\u0435 \u043c\u043e\u0434\u0435\u043b\u0438.\n        article_type: { type: string, enum: [guide, troubleshooting] }\n        category:\n          type: string\n          nullable: true\n          enum: [navigation, audio, sim, app_crash, maintenance, null]\n          description: >-\n            \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f \u043e\u0448\u0438\u0431\u043a\u0438 (= \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f \u0442\u0438\u043a\u0435\u0442\u0430 \u043f\u0440\u0438 \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u0438); \u0443 troubleshooting \u0432\u0441\u0435\u0433\u0434\u0430\n            \u0437\u0430\u0434\u0430\u043d\u0430. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0.\n        title: { type: string }\n        content: { type: string, description: Markdown (CommonMark) \u0431\u0435\u0437 HTML. }\n        version:\n          type: integer\n          description: >-\n            \u041d\u043e\u043c\u0435\u0440 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0439 \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u043e\u0439 \u0440\u0435\u0434\u0430\u043a\u0446\u0438\u0438; \u0443 \u0447\u0435\u0440\u043d\u043e\u0432\u0438\u043a\u0430 \u0431\u0435\u0437 \u043f\u0443\u0431\u043b\u0438\u043a\u0430\u0446\u0438\u0439 \u2014 1.\n            \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.5.0 (ADR 0018).\n        is_published: { type: boolean }\n        updated_at: { type: string, format: date-time, description: \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.5.0. }\n\n    KnowledgeArticleList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/KnowledgeArticle' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    DecisionTreeOption:\n      type: object\n      required: [label, next_node_id]\n      properties:\n        label: { type: string, example: \"\u042d\u043a\u0440\u0430\u043d \u0432\u0441\u0451 \u0435\u0449\u0451 \u0437\u0430\u0432\u0438\u0441\" }\n        next_node_id:\n          type: integer\n          nullable: true\n          description: >-\n            \u0423\u0437\u0435\u043b \u044d\u0442\u043e\u0439 \u0436\u0435 \u0441\u0442\u0430\u0442\u044c\u0438. \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.5.0 (ADR 0018 \u043f. 3): null \u0441\u0435\u0440\u0432\u0435\u0440 \u043e\u0442\u043a\u043b\u043e\u043d\u044f\u0435\u0442 (422) \u2014\n            \u0443\u0437\u0435\u043b \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u0438 \u2014 \u0444\u0438\u043d\u0430\u043b \u0441 \u043a\u043d\u043e\u043f\u043a\u043e\u0439 \u00ab\u0421\u043e\u0437\u0434\u0430\u0442\u044c \u043e\u0431\u0440\u0430\u0449\u0435\u043d\u0438\u0435\u00bb, \u0435\u0433\u043e \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u044b \u0432\u0435\u0434\u0443\u0442 \u043a \u0443\u0437\u043b\u0430\u043c;\n            \u0432 \u043e\u0442\u0432\u0435\u0442\u0430\u0445 null \u043d\u0435 \u0431\u044b\u0432\u0430\u0435\u0442.\n\n    DecisionTreeNodeCreateRequest:\n      type: object\n      required: [question_text, is_root, is_escalation]\n      properties:\n        question_text: { type: string }\n        options:\n          type: array\n          items: { $ref: '#/components/schemas/DecisionTreeOption' }\n        is_root: { type: boolean }\n        is_escalation: { type: boolean }\n\n    DecisionTreeNode:\n      allOf:\n        - $ref: '#/components/schemas/DecisionTreeNodeCreateRequest'\n        - type: object\n          required: [id, article_id]\n          properties:\n            id: { type: integer }\n            article_id: { type: integer }\n\n    DecisionTreeValidationResult:\n      type: object\n      required: [is_valid, issues]\n      properties:\n        is_valid: { type: boolean }\n        issues:\n          type: array\n          items:\n            type: object\n            required: [problem]\n            properties:\n              node_id:\n                type: integer\n                description: \u041e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u0435\u0442 \u0443 \u043f\u0440\u043e\u0431\u043b\u0435\u043c \u0434\u0435\u0440\u0435\u0432\u0430 \u0446\u0435\u043b\u0438\u043a\u043e\u043c (NO_ROOT, NO_ESCALATION).\n              problem:\n                type: string\n                enum:\n                  [DEAD_END, UNREACHABLE, MULTIPLE_ROOTS, BROKEN_REFERENCE, NO_ROOT, NO_ESCALATION]\n                description: NO_ROOT \u0438 NO_ESCALATION \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u044b \u0432 1.5.0 (ADR 0018 \u043f. 4).\n\n    # --- Notifications & Firmware (\u0448\u0430\u0433 5) ---\n    NotificationCreateRequest:\n      type: object\n      required: [type, message]\n      properties:\n        type: { type: string, enum: [firmware, maintenance, news, promo] }\n        target_vehicle_model_id: { type: integer, nullable: true, description: \"null = \u0432\u0441\u0435 \u043c\u043e\u0434\u0435\u043b\u0438\" }\n        firmware_release_id: { type: integer, nullable: true }\n        message: { type: string }\n\n    Notification:\n      type: object\n      required: [id, type, message, created_at]\n      properties:\n        id: { type: integer }\n        type: { type: string, enum: [firmware, maintenance, news, promo] }\n        target_vehicle_model_id: { type: integer, nullable: true }\n        firmware_release_id: { type: integer, nullable: true }\n        vehicle_id:\n          type: integer\n          nullable: true\n          description: \u0410\u0432\u0442\u043e \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u044f \u043e \u0422\u041e (type=maintenance), \u0438\u043d\u0430\u0447\u0435 null. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.6.0.\n        aggregate_type_id:\n          type: integer\n          nullable: true\n          description: \u0410\u0433\u0440\u0435\u0433\u0430\u0442 \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u044f \u043e \u0422\u041e (type=maintenance), \u0438\u043d\u0430\u0447\u0435 null. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.6.0.\n        message: { type: string }\n        created_at: { type: string, format: date-time }\n\n    NotificationListItem:\n      allOf:\n        - $ref: '#/components/schemas/Notification'\n        - type: object\n          properties:\n            read_at: { type: string, format: date-time, nullable: true, description: \"NotificationRecipient.read_at\" }\n\n    NotificationList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/NotificationListItem' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    NotificationOpenedRequest:\n      type: object\n      required: [token]\n      properties:\n        token: { type: string, minLength: 1, maxLength: 4096, description: \"FCM-\u0442\u043e\u043a\u0435\u043d \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430, \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u043e\u043c \u043e\u0442\u043a\u0440\u044b\u0442 push\" }\n\n    NotificationDeliveryStats:\n      type: object\n      required: [recipients, delivered, failed, opened, read]\n      description: \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.6.0 (ADR 0019 \u043f. 12).\n      properties:\n        recipients: { type: integer, description: \u041a\u043b\u0438\u0435\u043d\u0442\u043e\u0432 \u0432 \u0430\u0443\u0434\u0438\u0442\u043e\u0440\u0438\u0438 }\n        delivered: { type: integer, description: \"\u0414\u043e\u0441\u0442\u0430\u0432\u043e\u043a, \u043f\u0440\u0438\u043d\u044f\u0442\u044b\u0445 FCM\" }\n        failed:\n          type: integer\n          description: >-\n            \u0414\u043e\u0441\u0442\u0430\u0432\u043e\u043a \u0441 \u043e\u043a\u043e\u043d\u0447\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u043e\u0448\u0438\u0431\u043a\u043e\u0439, \u0432 \u0442\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u043e\u0442\u043c\u0435\u043d\u0451\u043d\u043d\u044b\u0445 \u0431\u0435\u0437 \u043e\u0442\u043f\u0440\u0430\u0432\u043a\u0438: \u0442\u043e\u043a\u0435\u043d \u043e\u0442\u043e\u0437\u0432\u0430\u043d\n            (TOKEN_REVOKED) \u0438\u043b\u0438 \u043f\u043e\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u044c \u0431\u043e\u043b\u044c\u0448\u0435 \u043d\u0435 \u0432\u043f\u0440\u0430\u0432\u0435 \u043f\u043e\u043b\u0443\u0447\u0430\u0442\u044c \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435\n            (RECIPIENT_NOT_ELIGIBLE, ADR 0021 \u043f. 5). \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.7.1.\n        opened: { type: integer, description: \"\u0414\u043e\u0441\u0442\u0430\u0432\u043e\u043a, \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0445 \u043d\u0430 \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0435\" }\n        read: { type: integer, description: \"\u041a\u043b\u0438\u0435\u043d\u0442\u043e\u0432, \u043f\u0440\u043e\u0447\u0438\u0442\u0430\u0432\u0448\u0438\u0445 \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435\" }\n\n    PublishedNotification:\n      allOf:\n        - $ref: '#/components/schemas/Notification'\n        - type: object\n          required: [stats]\n          properties:\n            stats: { $ref: '#/components/schemas/NotificationDeliveryStats' }\n\n    PublishedNotificationList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/PublishedNotification' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    NotificationAudiencePreview:\n      type: object\n      required: [recipients, devices]\n      description: \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.6.0 (ADR 0019 \u043f. 12, U-45).\n      properties:\n        recipients: { type: integer, description: \u041a\u043b\u0438\u0435\u043d\u0442\u043e\u0432 \u043f\u043e\u043b\u0443\u0447\u0430\u0442 \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435 \u0432 \u043b\u0435\u043d\u0442\u0443 }\n        devices: { type: integer, description: \u0410\u043a\u0442\u0438\u0432\u043d\u044b\u0445 push-\u0442\u043e\u043a\u0435\u043d\u043e\u0432 \u044d\u0442\u0438\u0445 \u043a\u043b\u0438\u0435\u043d\u0442\u043e\u0432 }\n\n    FirmwareReleaseCreateRequest:\n      type: object\n      required: [vehicle_model_id, version, released_at]\n      properties:\n        vehicle_model_id: { type: integer }\n        version: { type: string, minLength: 1, maxLength: 50, example: \"2.4.1\" }\n        released_at: { type: string, format: date }\n\n    FirmwareRelease:\n      type: object\n      required: [id, vehicle_model_id, version, released_at]\n      properties:\n        id: { type: integer }\n        vehicle_model_id: { type: integer }\n        version: { type: string }\n        released_at: { type: string, format: date }\n\n    # --- \u041a\u043e\u043b\u043b\u0435\u043a\u0446\u0438\u0438 \u0441 \u0435\u0434\u0438\u043d\u043e\u0439 \u043f\u0430\u0433\u0438\u043d\u0430\u0446\u0438\u0435\u0439 (\u0413\u043b\u0430\u0432\u0430 3: \u043f\u0430\u0433\u0438\u043d\u0430\u0446\u0438\u044f \u043d\u0430 \u0432\u0441\u0435\u0445 \u043a\u043e\u043b\u043b\u0435\u043a\u0446\u0438\u044f\u0445) ---\n    VehicleModelList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/VehicleModel' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    VehicleList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/Vehicle' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    AggregateTypeList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/AggregateType' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    MaintenanceRegulationList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/MaintenanceRegulation' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    AggregateStatusList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/AggregateStatus' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    DecisionTreeNodeList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/DecisionTreeNode' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    FirmwareReleaseList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/FirmwareRelease' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    UserList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/UserPublic' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    # --- \u0422\u0435\u043b\u0430 \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432, \u0440\u0430\u043d\u0435\u0435 \u043e\u043f\u0438\u0441\u0430\u043d\u043d\u044b\u0435 inline ---\n    TicketStatusUpdateRequest:\n      type: object\n      required: [status]\n      properties:\n        status: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }\n\n    TicketAssignRequest:\n      type: object\n      required: [assigned_engineer_id]\n      properties:\n        assigned_engineer_id: { type: integer, nullable: true, description: \"null \u2014 \u0441\u043d\u044f\u0442\u044c \u0438\u043d\u0436\u0435\u043d\u0435\u0440\u0430\" }\n\n    PushTokenRegisterRequest:\n      type: object\n      required: [token]\n      properties:\n        token: { type: string, minLength: 1, maxLength: 4096 }\n\n    VehicleFirmwareUpdateRequest:\n      type: object\n      required: [firmware_release_id]\n      properties:\n        firmware_release_id: { type: integer, description: \"\u0420\u0435\u043b\u0438\u0437 \u0442\u043e\u0439 \u0436\u0435 \u043c\u043e\u0434\u0435\u043b\u0438, \u0447\u0442\u043e \u0438 \u0430\u0432\u0442\u043e (\u0438\u043d\u0430\u0447\u0435 422)\" }\n\n    # --- Users (A-04) ---\n    StaffUserCreateRequest:\n      type: object\n      required: [phone, role, password]\n      properties:\n        phone: { $ref: '#/components/schemas/PhoneE164' }\n        role: { type: string, enum: [engineer, admin] }\n        password: { type: string, format: password, minLength: 12, maxLength: 128 }\n\n    UserPasswordResetRequest:\n      type: object\n      required: [password]\n      properties:\n        password: { type: string, format: password, minLength: 12, maxLength: 128 }\n\n    UserUpdateRequest:\n      type: object\n      minProperties: 1\n      properties:\n        role: { type: string, enum: [engineer, admin] }\n        is_active: { type: boolean }\n\n    # --- Analytics (A-05, A-06) ---\n    TicketResolutionStats:\n      type: object\n      required: [date_from, date_to, tickets_created, tickets_resolved, tickets_resolved_overdue,\n                 avg_first_response_hours, avg_resolution_hours, median_resolution_hours,\n                 computed_at]\n      properties:\n        date_from: { type: string, format: date }\n        date_to: { type: string, format: date }\n        tickets_created: { type: integer, minimum: 0 }\n        tickets_resolved: { type: integer, minimum: 0 }\n        tickets_resolved_overdue: { type: integer, minimum: 0, description: \"resolved_at > sla_due_at\" }\n        avg_first_response_hours: { type: number, nullable: true }\n        avg_resolution_hours: { type: number, nullable: true, description: \"\u0421\u0440\u0435\u0434\u043d\u0435\u0435 resolved_at \u2212 created_at (A-05)\" }\n        median_resolution_hours: { type: number, nullable: true }\n        computed_at: { $ref: '#/components/schemas/AnalyticsComputedAt' }\n\n    AnalyticsComputedAt:\n      type: string\n      format: date-time\n      description: >\n        \u041c\u043e\u043c\u0435\u043d\u0442, \u043f\u043e \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044e \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0432\u0438\u0442\u0440\u0438\u043d\u0430 \u0430\u043d\u0430\u043b\u0438\u0442\u0438\u043a\u0438 \u0443\u0447\u043b\u0430 \u0434\u0430\u043d\u043d\u044b\u0435 (ADR 0020, 1.7.0);\n        \u043e\u0442\u0441\u0442\u0430\u0432\u0430\u043d\u0438\u0435 \u2014 \u0434\u043e \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430 \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u044f worker.\n\n    TicketCategoryCount:\n      type: object\n      required: [category, count]\n      properties:\n        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }\n        count: { type: integer, minimum: 0 }\n\n    ProblemModelStats:\n      type: object\n      required: [vehicle_model, tickets_total, vehicles_total, by_category]\n      properties:\n        vehicle_model: { $ref: '#/components/schemas/VehicleModel' }\n        tickets_total: { type: integer, minimum: 0 }\n        vehicles_total: { type: integer, minimum: 0, description: \"\u0410\u043a\u0442\u0438\u0432\u043d\u044b\u0435 \u0430\u0432\u0442\u043e \u043c\u043e\u0434\u0435\u043b\u0438 \u043d\u0430 \u043c\u043e\u043c\u0435\u043d\u0442 computed_at \u2014 \u0434\u043b\u044f \u043d\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f\" }\n        by_category:\n          type: array\n          description: \u0412\u0441\u0435 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0442\u0438\u043a\u0435\u0442\u043e\u0432, \u0432 \u0442\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u0441 count = 0\n          items: { $ref: '#/components/schemas/TicketCategoryCount' }\n\n    ProblemModelStatsList:\n      type: object\n      required: [items, meta, computed_at]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/ProblemModelStats' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n        computed_at: { $ref: '#/components/schemas/AnalyticsComputedAt' }\n\n    MaintenanceConversionStats:\n      type: object\n      required: [date_from, date_to, tickets_total, tickets_with_maintenance, ticket_to_maintenance_rate,\n                 notifications_recipients, notifications_opened, recipients_with_maintenance,\n                 notification_to_maintenance_rate, computed_at]\n      properties:\n        date_from: { type: string, format: date }\n        date_to: { type: string, format: date }\n        tickets_total: { type: integer, minimum: 0 }\n        tickets_with_maintenance: { type: integer, minimum: 0 }\n        ticket_to_maintenance_rate: { type: number, minimum: 0, maximum: 1, nullable: true }\n        notifications_recipients: { type: integer, minimum: 0, description: \"\u041f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u0439 \u043e \u0422\u041e (type=maintenance): \u043f\u0430\u0440\u044b \u00ab\u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u0435, \u043f\u043e\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u044c\u00bb\" }\n        notifications_opened: { type: integer, minimum: 0 }\n        recipients_with_maintenance: { type: integer, minimum: 0 }\n        notification_to_maintenance_rate: { type: number, minimum: 0, maximum: 1, nullable: true }\n        computed_at: { $ref: '#/components/schemas/AnalyticsComputedAt' }\n\n  responses:\n    BadRequest:\n      description: \u041d\u0435\u043a\u043e\u0440\u0440\u0435\u043a\u0442\u043d\u044b\u0439 \u0437\u0430\u043f\u0440\u043e\u0441\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    Unauthorized:\n      description: \u041d\u0435 \u0430\u0432\u0442\u043e\u0440\u0438\u0437\u043e\u0432\u0430\u043d (\u043d\u0435\u0442/\u043f\u0440\u043e\u0441\u0440\u043e\u0447\u0435\u043d \u0442\u043e\u043a\u0435\u043d \u0438\u043b\u0438 \u0443\u0447\u0451\u0442\u043d\u0430\u044f \u0437\u0430\u043f\u0438\u0441\u044c \u0437\u0430\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0430\u043d\u0430)\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    Forbidden:\n      description: \u041d\u0435\u0442 \u0434\u043e\u0441\u0442\u0443\u043f\u0430 (RBAC)\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    NotFound:\n      description: \u0420\u0435\u0441\u0443\u0440\u0441 \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    Conflict:\n      description: \u041a\u043e\u043d\u0444\u043b\u0438\u043a\u0442 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044f (\u043d\u0430\u043f\u0440. VIN \u0443\u0436\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d)\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    ValidationError:\n      description: \u041e\u0448\u0438\u0431\u043a\u0430 \u0432\u0430\u043b\u0438\u0434\u0430\u0446\u0438\u0438 \u0432\u0445\u043e\u0434\u043d\u044b\u0445 \u0434\u0430\u043d\u043d\u044b\u0445\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    RateLimited:\n      description: \u041f\u0440\u0435\u0432\u044b\u0448\u0435\u043d \u043b\u0438\u043c\u0438\u0442 \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432 (\u043d\u0430\u043f\u0440. \u043f\u043e\u043f\u044b\u0442\u043a\u0438 SMS-\u043a\u043e\u0434\u0430)\n      headers:\n        Retry-After:\n          description: \u0421\u0435\u043a\u0443\u043d\u0434 \u0434\u043e \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u0439 \u043f\u043e\u043f\u044b\u0442\u043a\u0438 (\u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.2.0)\n          schema: { type: integer, minimum: 1 }\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    ServerError:\n      description: \u0412\u043d\u0443\u0442\u0440\u0435\u043d\u043d\u044f\u044f \u043e\u0448\u0438\u0431\u043a\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0430\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n";

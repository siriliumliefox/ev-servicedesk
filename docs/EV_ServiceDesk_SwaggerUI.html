const OPENAPI_YAML = "openapi: 3.0.3\ninfo:\n  title: EV-ServiceDesk API\n  version: \"1.0.0-rc3\"\n  description: >\n    API \u0434\u0438\u043f\u043b\u043e\u043c\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430 \u00abEV-ServiceDesk\u00bb (\u041e\u041e\u041e \u00ab\u0415\u0422\u0421\u0430\u0432\u0442\u043e\u0413\u043e\u043c\u0435\u043b\u044c\u00bb).\n    \u041a\u043e\u043d\u0442\u0440\u0430\u043a\u0442\u044b \u0441\u0435\u0440\u0432\u0438\u0441\u043e\u0432: Auth, Vehicle, Aggregates & Maintenance, Tickets,\n    Knowledge Base, Notifications, Analytics.\n  contact:\n    name: Sirilium / EV-ServiceDesk\n    email: dev@ev-servicedesk.example.com\n\nservers:\n  - url: https://api.ev-servicedesk.example.com/v1\n    description: Production\n  - url: https://staging-api.ev-servicedesk.example.com/v1\n    description: Staging\n\nsecurity:\n  - bearerAuth: []\n\ntags:\n  - name: Auth\n  - name: Vehicle\n  - name: Aggregates\n  - name: Uploads\n  - name: Tickets\n  - name: KnowledgeBase\n  - name: Notifications\n\npaths:\n  # ===================== AUTH SERVICE (\u0448\u0430\u0433 2) =====================\n  # \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u0438 \u043b\u043e\u0433\u0438\u043d \u043e\u0431\u044a\u0435\u0434\u0438\u043d\u0435\u043d\u044b \u0432 \u0435\u0434\u0438\u043d\u044b\u0439 passwordless-\u0444\u043b\u043e\u0443 \u043f\u043e \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0443:\n  # request-code -> verify-code. \u041e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0433\u043e /auth/register \u043d\u0435\u0442 \u043d\u0430\u043c\u0435\u0440\u0435\u043d\u043d\u043e \u2014\n  # verify-code \u0441\u0430\u043c \u0441\u043e\u0437\u0434\u0430\u0451\u0442 User \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u043c \u0432\u0445\u043e\u0434\u0435 (is_new_user \u0432 \u043e\u0442\u0432\u0435\u0442\u0435).\n  /auth/phone/request-code:\n    post:\n      tags: [Auth]\n      summary: \u0417\u0430\u043f\u0440\u043e\u0441\u0438\u0442\u044c SM u044e\u0449\u0435\u0433\u043e access-\u0442\u043e\u043a\u0435\u043d\u0430.\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/RefreshRequest' }\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '200':\n          description: \u041d\u043e\u0432\u0430\u044f \u043f\u0430\u0440\u0430 \u0442\u043e\u043a\u0435\u043d\u043e\u0432\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/AuthTokens' }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n\n  /auth/logout:\n    post:\n      tags: [Auth]\n      summary: \u041e\u0442\u043e\u0437\u0432\u0430\u0442\u044c refresh-\u0442\u043e\u043a\u0435\u043d (\u0432\u044b\u0445\u043e\u0434 \u0441 \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430)\n      operationId: logout\n      description: \u0418\u043d\u0432\u0430\u043b\u0438\u0434\u0438\u0440\u0443\u0435\u0442 refresh-\u0442\u043e\u043a\u0435\u043d \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/RefreshRequest' }\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '204': { description: \u0422\u043e\u043a\u0435\u043d \u043e\u0442\u043e\u0437\u0432\u0430\u043d }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n\n  /auth/pd-consent:\n    delete:\n      tags: [Auth]\n      summary: \u041e\u0442\u043e\u0437\u0432\u0430\u0442\u044c \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u0435 \u043d\u0430 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0443 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u043b\u044c\u043d\u044b\u0445 \u0434\u0430\u043d\u043d\u044b\u0445\n      operationId: withdrawPdConsent\n      x-required-roles: [client]\n      description: >\n        99-\u0417, \u0441\u0442. 10: \u043e\u0442\u0437\u044b\u0432 \u0432 \u043b\u044e\u0431\u043e\u0435 \u0432\u0440\u0435\u043c\u044f \u0438 \u0432 \u0442\u043e\u0439 \u0436\u0435 \u0444\u043e\u0440\u043c\u0435, \u0432 \u043a\u043e\u0442\u043e\u0440\u043e\u0439 \u0434\u0430\u043d\u043e \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u0435\n        (\u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0438). \u0424\u0438\u043a\u0441\u0438\u0440\u0443\u0435\u0442 pd_consent.withdrawn_at, \u043e\u0442\u0437\u044b\u0432\u0430\u0435\u0442 \u0432\u0441\u0435 refresh-\u0442\u043e\u043a\u0435\u043d\u044b \u0438\n        \u0441\u0442\u0430\u0432\u0438\u0442 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f \u0432 \u043e\u0447\u0435\u0440\u0435\u0434\u044c \u0430\u043d\u043e\u043d\u0438\u043c\u0438\u0437\u0430\u0446\u0438\u0438: \u0443\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u041f\u0414 \u0438 \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435\n        \u0441\u0443\u0431\u044a\u0435\u043a\u0442\u0430 \u043d\u0435 \u043f\u043e\u0437\u0434\u043d\u0435\u0435 15 \u0434\u043d\u0435\u0439, \u0435\u0441\u043b\u0438 \u043d\u0435\u0442 \u0438\u043d\u044b\u0445 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u0445 \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0439.\n        409 PD_CONSENT_NOT_ACTIVE \u2014 \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u044e\u0449\u0435\u0433\u043e \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u044f \u043d\u0435\u0442 (\u0443\u0436\u0435 \u043e\u0442\u043e\u0437\u0432\u0430\u043d\u043e).\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '202': { description: \"\u0421\u043e\u0433\u043b\u0430\u0441\u0438\u0435 \u043e\u0442\u043e\u0437\u0432\u0430\u043d\u043e, \u0443\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u041f\u0414 \u0437\u0430\u043f\u043b\u0430\u043d\u0438\u0440\u043e\u0432\u0430\u043d\u043e\" }\n        '401': { $ref: '#/com ror' }\n        '200':\n          description: \u041e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u043e\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/DecisionTreeNode' }\n        '403': { $ref: '#/components/responses/Forbidden' }\n    delete:\n      tags: [KnowledgeBase]\n      summary: \u0423\u0434\u0430\u043b\u0438\u0442\u044c \u0443\u0437\u0435\u043b\n      operationId: deleteDecisionTreeNode\n      description: \u041e\u0442\u043a\u043b\u043e\u043d\u044f\u0435\u0442\u0441\u044f \u0441 409, \u0435\u0441\u043b\u0438 \u043d\u0430 \u0443\u0437\u0435\u043b \u0441\u0441\u044b\u043b\u0430\u044e\u0442\u0441\u044f \u0434\u0440\u0443\u0433\u0438\u0435 \u0443\u0437\u043b\u044b.\n      x-required-roles: [admin]\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '204': { description: \u0423\u0434\u0430\u043b\u0451\u043d }\n        '403': { $ref: '#/components/responses/Forbidden' }\n        '409':\n          description: \u041d\u0430 \u0443\u0437\u0435\u043b \u0441\u0441\u044b\u043b\u0430\u044e\u0442\u0441\u044f \u0434\u0440\u0443\u0433\u0438\u0435 \u0443\u0437\u043b\u044b \u2014 \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u043e\u0431\u043d\u043e\u0432\u0438\u0442\u0435 \u0438\u0445 options\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/Error' }\n\n  # ===================== NOTIFICATIONS SERVICE (\u0448\u0430\u0433 5) =====================\n  /push-tokens:\n    post:\n      tags: [Notifications]\n      summary: \u0417\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c FCM push-\u0442\u043e\u043a\u0435\u043d \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430\n      operationId: registerPushToken\n      description: \u0421\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442 \u0442\u043e\u043a\u0435\u043d \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430 \u0434\u043b\u044 u0435 \u043f\u0440\u043e\u0448\u043b\u043e \u0432\u0430\u043b\u0438\u0434\u0430\u0446\u0438\u044e)\n\n    # --- \u0415\u0434\u0438\u043d\u044b\u0439 \u0444\u043e\u0440\u043c\u0430\u0442 \u043f\u0430\u0433\u0438\u043d\u0430\u0446\u0438\u0438 (\u0448\u0430\u0433 6) ---\n    PaginationMeta:\n      type: object\n      required: [page, page_size, total_items, total_pages]\n      properties:\n        page: { type: integer }\n        page_size: { type: integer }\n        total_items: { type: integer }\n        total_pages: { type: integer }\n\n    # --- Auth (\u0448\u0430\u0433 2) ---\n    PhoneE164:\n      type: string\n      pattern: '^\\+[1-9][0-9]{7,14}$'\n      maxLength: 16\n      example: \"+375291234567\"\n      description: \u0422\u0435\u043b\u0435\u0444\u043e\u043d \u0432 \u0444\u043e\u0440\u043c\u0430\u0442\u0435 E.164 (CHECK ck_app_user_phone_e164, \u0413\u043b\u0430\u0432\u0430 2). \u041f\u0414 \u043f\u043e N-07.\n\n    PhoneRequestCode:\n      type: object\n      required: [phone]\n      properties:\n        phone: { $ref: '#/components/schemas/PhoneE164' }\n\n    VerifyCodeRequest:\n      type: object\n      required: [phone, code]\n      properties:\n        phone: { $ref: '#/components/schemas/PhoneE164' }\n        code: { type: string, example: \"1234\" }\n        pd_policy_version:\n          type: string\n          maxLength: 20\n          nullable: true\n          example: \"2026-10\"\n          description: >-\n            \u0420\u0435\u0434\u0430\u043a\u0446\u0438\u044f \u043f\u043e\u043b\u0438\u0442\u0438\u043a\u0438 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0438 \u041f\u0414, \u0441 \u043a\u043e\u0442\u043e\u0440\u043e\u0439 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044c \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u043b\u0441\u044f \u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0438.\n            \u041e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u0430 \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u0439 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0438 \u043f\u0440\u0438 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0438 \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u044e\u0449\u0435\u0433\u043e \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u044f;\n            \u0444\u0438\u043a\u0441\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u0432 pd_consent \u0441 \u0434\u0430\u0442\u043e\u0439 (99-\u0417, \u0441\u0442. 5). \u0411\u0435\u0437 \u0441\u043e\u0433\u043b\u0430\u0441\u0438\u044f \u2014 422 PD_CONSENT_REQUIRED.\n\n    RefreshRequest:\n      type: object\n      required: [refresh_token]\n      properties:\n        refresh_token: { type: string }\n\n    StaffLoginRequest:\n      type: object\n      required: [phone, password]\n      properties:\n        phone: { $ref: '#/components/schemas/PhoneE164' }\n        password: { type: string, format: password }\n\n    TelegramLinkRequest:\n      type: object\n      required: [telegram_id]\n      properties:\n        telegram_id: { type: string }\n\n    AuthTokens:\n      type: object\n      required: [access_token, refresh_token, expires_in]\n      properties:\n        access_token: { type: string }\n        refresh_token: { type: string }\n        expires_in: { type: integer, description: \"TTL access-\u0442\u043e\u043a\u0435\u043d\u0430, \u0441\u0435\u043a.\" }\n\n    UserPublic:\n      type: object\n      required: [id, phone, role, created_at]\n      properties:\n        id: { type: integer }\n        phone:\n          allOf:\n            - $ref: '#/components/schemas/PhoneE164'\n          nullable: true\n          description: E.164; null \u2014 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044c \u0430\u043d\u043e\u043d\u0438\u043c\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043d (\u041f\u0414 \u0443\u0434\u0430\u043b\u0435\u043d\u044b \u043f\u043e 99-\u0417, ADR 0006).\n        role: { type: string, enum: [client, engineer, admin] }\n        telegram_id: { type: string, nullable: true }\n        created_at: { type: string, format: date-time }\n\n    # --- Vehicle (\u0448\u0430\u0433 3) ---\n    # VehicleModel \u2014 \u0441 id, \u0434\u043b\u044f \u043f\u043e\u0438\u0441\u043a\u0430/\u0432\u044b\u0431\u043e\u0440\u0430 \u043c\u043e\u0434\u0435\u043b\u0438 \u0432\u0440\u0443\u0447\u043d\u0443\u044e (fallback VIN-\u0434\u0435\u043a\u043e\u0434\u0435\u0440\u0430).\n    VehicleModel:\n      type: object\n      required: [id, brand, model]\n      properties:\n        id: { type: integer }\n        brand: { type: string, example: \"Zeekr\" }\n        model: { type: string, example: \"001\" }\n        trim: { type: string, nullable: true }\n\n    # VehicleModelInfo \u2014 \u0431\u0435\u0437 id, \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043e\u0442\u043e\u0431\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u0432\u043d\u0443\u0442\u0440\u0438 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 Vehicle\n    # (\u043f\u043e\u0441\u043b\u0435 \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u044f \u043a\u043b\u0438\u0435\u043d\u0442\u0443 \u043d\u0435 \u043d\u0443\u0436\u043d\u043e \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e \u0441\u0441\u044b\u043b\u0430\u0442\u044c\u0441\u044f \u043d\u0430 \u043c\u043e\u0434\u0435\u043b\u044c \u043f\u043e id).\n    VehicleModelInfo:\n      type: object\n      required: [brand, model]\n      properties:\n        brand: { type: string }\n        model: { type: string }\n        trim: { type: string, nullable: true }\n\n    VehicleCreateRequest:\n      type: object\n      required: [vin]\n      properties:\n        vin:\n          type: string\n          minLength: 17\n          maxLength: 17\n          pattern: '^[A-HJ-NPR-Z0-9]{17}$'\n          example: \"LSVAU2183R2100001\"\n        vehicle_model_id:\n          type: integer\n          nullable: true\n          description: \u042f\u0432\u043d\u043e\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u0438\u0435 \u043c\u043e\u0434\u0435\u043b\u0438, \u0435\u0441\u043b\u0438 VIN-\u0434\u0435\u043a\u043e\u0434\u0435\u0440 \u043d\u0435 \u0441\u043c\u043e\u0433 \u0440\u0430\u0441\u043f\u043e\u0437\u043d\u0430\u0442\u044c \u0430\u0432\u0442\u043e\n\n    Vehicle:\n      type: object\n      required: [id, vin, mileage, vehicle_model, is_active, created_at]\n      properties:\n        id: { type: integer }\n        vin: { type: string, minLength: 17, maxLength: 17 }\n        mileage: { type: integer, minimum: 0 }\n        is_active: { type: boolean }\n        vehicle_model: { $ref: '#/components/schemas/VehicleModelInfo' }\n        current_firmware_version:\n          type: string\n          nullable: true\n          description: \u0412\u0435\u0440\u0441\u0438\u044f \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 \u0438\u0437 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0433\u043e \u0437\u0430\u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e FirmwareRelease (\u0441\u043c. PATCH /vehicles/{id}/firmware)\n        created_at: { type: string, format: date-time }\n\n    MileageUpdateRequest:\n      type: object\n      required: [mileage]\n      properties:\n        mileage: { type: integer, minimum: 0 }\n\n    MileageCorrectionRequest:\n      type: object\n      required: [expected_current_mileage, mileage, reason]\n      properties:\n        expected_current_mileage:\n          type: integer\n          minimum: 0\n          description: \u041f\u0440\u043e\u0431\u0435\u0433, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0432\u0438\u0434\u0435\u043b \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440 (\u0437\u0430\u0449\u0438\u0442\u0430 \u043e\u0442 \u0433\u043e\u043d\u043a\u0438 \u2192 409 \u043f\u0440\u0438 \u0440\u0430\u0441\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u0438).\n        mileage: { type: integer, minimum: 0, description: \"\u041d\u043e\u0432\u043e\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435, \u0441\u0442\u0440\u043e\u0433\u043e \u043c\u0435\u043d\u044c\u0448\u0435 \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e\" }\n        reason: { type: string, minLength: 1, maxLength: 500 }\n\n    # aggregate_type_code (\u043d\u0435 id) \u2014 \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u044b\u0439 \u043a\u043e\u043d\u0442\u0440\u0430\u043a\u0442 \u0441\u0441\u044b\u043b\u0430\u0435\u0442\u0441\u044f \u043d\u0430 \u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u044b\u0439\n    # \u0431\u0438\u0437\u043d\u0435\u0441-\u043a\u043b\u044e\u0447 \u0441\u043f\u0440\u0430\u0432\u043e\u0447\u043d\u0438\u043a\u0430 AggregateType, \u0430 \u043d\u0435 \u043d\u0430 \u0432\u043d\u0443\u0442\u0440\u0435\u043d\u043d\u0438\u0439 surrogate id (\u0413\u043b\u0430\u0432\u0430 2).\n    MaintenanceRecord:\n      type: object\n      required: [id, performed_at, mileage_at_service]\n      properties:\n        id: { type: integer }\n        aggregate_type_code: { type: string, nullable: true }\n        performed_by: { $ref: '#/components/schemas/UserPublic' }\n        performed_at: { type: string, format: date }\n        mileage_at_service: { type: integer }\n        description: { type: string, nullable: true }\n\n    MaintenanceRecordCreateRequest:\n      type: object\n      required: [performed_at, mileage_at_service]\n      properties:\n        aggregate_type_code:\n          type: string\n          nullable: true\n          description: \u041a\u043e\u0434 \u0430\u0433\u0440\u0435\u0433\u0430\u0442\u0430 (\u0441\u043f\u0440\u0430\u0432\u043e\u0447\u043d\u0438\u043a AggregateType), \u043b\u0438\u0431\u043e null \u0434\u043b\u044f \u043e\u0431\u0449\u0435\u0439 \u0440\u0430\u0431\u043e\u0442\u044b\n        performed_at: { type: string, format: date }\n        mileage_at_service: { type: integer, minimum: 0 }\n        description: { type: string, nullable: true, maxLength: 255 }\n\n    MaintenanceRecordList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/MaintenanceRecord' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    # --- Aggregates & Maintenance (\u0448\u0430\u0433 4) ---\n    AggregateType:\n      type: object\n      required: [code, name]\n      properties:\n        code: { type: string, example: \"engine_oil\" }\n        name: { type: string, example: \"\u041c\u0430\u0441\u043b\u043e \u0432 \u0434\u0432\u0438\u0433\u0430\u0442\u0435\u043b\u0435\" }\n\n    AggregateTypeCreateRequest:\n      type: object\n      required: [code, name]\n      properties:\n        code: { type: string, example: \"brake_fluid\" }\n        name: { type: string, example: \"\u0422\u043e\u0440\u043c\u043e\u0437\u043d\u0430\u044f \u0436\u0438\u0434\u043a\u043e\u0441\u0442\u044c\" }\n\n    MaintenanceRegulation:\n      type: object\n      required: [id, vehicle_model_id, aggregate_type_code, is_archived]\n      properties:\n        id: { type: integer }\n        vehicle_model_id: { type: integer }\n        aggregate_type_code: { type: string }\n        interval_km: { type: integer, nullable: true }\n        interval_months: { type: integer, nullable: true }\n        is_archived: { type: boolean }\n\n    MaintenanceRegulationCreateRequest:\n      type: object\n      required: [vehicle_model_id, aggregate_type_code]\n      description: \u041d\u0443\u0436\u043d\u043e \u0443\u043a\u0430\u0437\u0430\u0442\u044c interval_km \u0438/\u0438\u043b\u0438 interval_months \u2014 \u0445\u043e\u0442\u044f \u0431\u044b \u043e\u0434\u043d\u043e.\n      properties:\n        vehicle_model_id: { type: integer }\n        aggregate_type_code: { type: string }\n        interval_km: { type: integer, nullable: true, minimum: 1 }\n        interval_months: { type: integer, nullable: true, minimum: 1 }\n\n    AggregateStatus:\n      type: object\n      required: [aggregate_type_code, aggregate_type_name, status]\n      properties:\n        aggregate_type_code: { type: string }\n        aggregate_type_name: { type: string }\n        status:\n          type: string\n          enum: [green, yellow, red, unknown]\n          description: >\n            green <70% \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430, yellow 70\u2013100%, red >100%,\n            unknown \u2014 \u043d\u0435\u0442 \u0438\u0441\u0442\u043e\u0440\u0438\u0438 \u0437\u0430\u043c\u0435\u043d\u044b (\u043d\u0435 \u043e\u0448\u0438\u0431\u043a\u0430, \u0413\u043b\u0430\u0432\u0430 5).\n        percentage:\n          type: number\n          nullable: true\n          description: \"% \u0432\u044b\u0440\u0430\u0431\u043e\u0442\u043a\u0438 \u0438\u043d\u0442\u0435\u0440\u0432\u0430\u043b\u0430, null \u043f\u0440\u0438 status=unknown\"\n        last_replaced_at: { type: string, format: date, nullable: true }\n        last_replaced_mileage: { type: integer, nullable: true }\n        remaining_km: { type: integer, nullable: true }\n\n    AggregateReplaceRequest:\n      type: object\n      required: [replaced_at, mileage_at_replacement]\n      properties:\n        replaced_at: { type: string, format: date }\n        mileage_at_replacement: { type: integer, minimum: 0 }\n        description:\n          type: string\n          nullable: true\n          description: \u041f\u0440\u043e\u0431\u0440\u0430\u0441\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0432 \u0441\u0432\u044f\u0437\u0430\u043d\u043d\u0443\u044e \u0437\u0430\u043f\u0438\u0441\u044c MaintenanceRecord\n\n    # --- Uploads ---\n    PresignRequest:\n      type: object\n      required: [file_name, file_type]\n      properties:\n        file_name: { type: string, example: \"photo.jpg\" }\n        file_type: { type: string, enum: [photo, video] }\n\n    PresignResponse:\n      type: object\n      required: [upload_url, file_url, expires_at]\n      properties:\n        upload_url: { type: string, description: \"PUT \u0441\u044e\u0434\u0430 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435 \u043d\u0430\u043f\u0440\u044f\u043c\u0443\u044e \u0432 S3\" }\n        file_url:\n          type: string\n          description: >-\n            \u0418\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0442\u043e\u0440 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u043e\u0431\u044a\u0435\u043a\u0442\u0430 \u2014 \u043f\u0435\u0440\u0435\u0434\u0430\u0442\u044c \u0432 attachments. \u041d\u0435 \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u0430\u044f \u0441\u0441\u044b\u043b\u043a\u0430:\n            backend \u0445\u0440\u0430\u043d\u0438\u0442 \u043a\u043b\u044e\u0447 \u043e\u0431\u044a\u0435\u043a\u0442\u0430 S3 (ticket_attachment.object_key) \u0438 \u0432\u044b\u0434\u0430\u0435\u0308\u0442\n            presigned URL \u043f\u0440\u0438 \u0447\u0442\u0435\u043d\u0438\u0438 (ADR 0004).\n        expires_at: { type: string, format: date-time }\n\n    # --- Tickets (\u0448\u0430\u0433 5) ---\n    TicketAttachmentInput:\n      type: object\n      required: [file_url, file_type]\n      properties:\n        file_url:\n          type: string\n          description: >-\n            file_url \u0438\u0437 PresignResponse. Backend \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442, \u0447\u0442\u043e \u043e\u0431\u044a\u0435\u043a\u0442 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d \u0442\u0435\u043a\u0443\u0449\u0438\u043c\n            \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u0435\u043c, \u0438 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442 \u043a\u043b\u044e\u0447 \u043e\u0431\u044a\u0435\u043a\u0442\u0430, MIME \u0438 \u0440\u0430\u0437\u043c\u0435\u0440 (ADR 0004).\n        file_type: { type: string, enum: [photo, video] }\n\n    TicketCreateRequest:\n      type: object\n      required: [vehicle_id, category, description]\n      properties:\n        vehicle_id: { type: integer }\n        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }\n        description: { type: string }\n        source_article_id: { type: integer, nullable: true }\n        source_node_id: { type: integer, nullable: true }\n        attachments:\n          type: array\n          items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n\n    Ticket:\n      type: object\n      required: [id, category, status, sla_due_at, is_overdue, created_at]\n      properties:\n        id: { type: integer }\n        vehicle_id: { type: integer }\n        category: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }\n        status: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }\n        assigned_engineer_id: { type: integer, nullable: true }\n        sla_due_at: { type: string, format: date-time }\n        is_overdue: { type: boolean, description: \"\u0412\u044b\u0447\u0438\u0441\u043b\u044f\u0435\u043c\u043e\u0435 \u043f\u043e\u043b\u0435: now() > sla_due_at \u0438 status != resolved\" }\n        created_at: { type: string, format: date-time }\n        resolved_at:\n          type: string\n          format: date-time\n          nullable: true\n          description: \u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u043e \u0442\u043e\u0433\u0434\u0430 \u0438 \u0442\u043e\u043b\u044c\u043a\u043e \u0442\u043e\u0433\u0434\u0430, \u043a\u043e\u0433\u0434\u0430 status = resolved (A-05).\n\n    VehicleContext:\n      type: object\n      description: \u0410\u0432\u0442\u043e\u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d\u043d\u044b\u0439 \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442 \u0430\u0432\u0442\u043e \u043d\u0430 \u043c\u043e\u043c\u0435\u043d\u0442 \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u044f \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u0442\u0438\u043a\u0435\u0442\u0430.\n      properties:\n        vehicle: { $ref: '#/components/schemas/Vehicle' }\n        aggregate_statuses:\n          type: array\n          items: { $ref: '#/components/schemas/AggregateStatus' }\n\n    TicketDetail:\n      allOf:\n        - $ref: '#/components/schemas/Ticket'\n        - type: object\n          properties:\n            description: { type: string }\n            attachments:\n              type: array\n              items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n            vehicle_context: { $ref: '#/components/schemas/VehicleContext' }\n\n    TicketList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/Ticket' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    TicketMessageCreateRequest:\n      type: object\n      required: [body]\n      properties:\n        body: { type: string }\n        attachments:\n          type: array\n          items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n\n    TicketMessage:\n      type: object\n      required: [id, author, body, created_at]\n      properties:\n        id: { type: integer }\n        author: { $ref: '#/components/schemas/UserPublic' }\n        body: { type: string }\n        attachments:\n          type: array\n          items: { $ref: '#/components/schemas/TicketAttachmentInput' }\n        created_at: { type: string, format: date-time }\n\n    TicketMessageList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/TicketMessage' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    # --- Knowledge Base (\u0448\u0430\u0433 5) ---\n    KnowledgeArticleCreateRequest:\n      type: object\n      required: [article_type, title, content]\n      properties:\n        vehicle_model_id: { type: integer, nullable: true }\n        firmware_release_id:\n          type: integer\n          nullable: true\n          description: \u0421\u0442\u0430\u0442\u044c\u044f \u043f\u043e\u0434 \u0432\u0435\u0440\u0441\u0438\u044e \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 (C-06); \u0442\u0440\u0435\u0431\u0443\u0435\u0442 vehicle_model_id \u0442\u043e\u0438\u0306 \u0436\u0435 \u043c\u043e\u0434\u0435\u043b\u0438.\n        article_type: { type: string, enum: [guide, troubleshooting] }\n        title: { type: string, maxLength: 200 }\n        content: { type: string }\n\n    KnowledgeArticleUpdateRequest:\n      type: object\n      properties:\n        title: { type: string }\n        content: { type: string }\n        is_published: { type: boolean }\n\n    KnowledgeArticle:\n      type: object\n      required: [id, article_type, title, version, is_published]\n      properties:\n        id: { type: integer }\n        vehicle_model_id: { type: integer, nullable: true }\n        firmware_release_id:\n          type: integer\n          nullable: true\n          description: \u0421\u0442\u0430\u0442\u044c\u044f \u043f\u043e\u0434 \u0432\u0435\u0440\u0441\u0438\u044e \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 (C-06); \u0442\u0440\u0435\u0431\u0443\u0435\u0442 vehicle_model_id \u0442\u043e\u0438\u0306 \u0436\u0435 \u043c\u043e\u0434\u0435\u043b\u0438.\n        article_type: { type: string, enum: [guide, troubleshooting] }\n        title: { type: string }\n        content: { type: string }\n        version: { type: integer }\n        is_published: { type: boolean }\n\n    KnowledgeArticleList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/KnowledgeArticle' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    DecisionTreeOption:\n      type: object\n      required: [label, next_node_id]\n      properties:\n        label: { type: string, example: \"\u042d\u043a\u0440\u0430\u043d \u0432\u0441\u0451 \u0435\u0449\u0451 \u0437\u0430\u0432\u0438\u0441\" }\n        next_node_id: { type: integer, nullable: true, description: \"null \u0434\u043e\u043f\u0443\u0441\u0442\u0438\u043c \u0442\u043e\u043b\u044c\u043a\u043e \u0435\u0441\u043b\u0438 is_escalation=true \u043d\u0430 \u0442\u0435\u043a\u0443\u0449\u0435\u043c \u0443\u0437\u043b\u0435\" }\n\n    DecisionTreeNodeCreateRequest:\n      type: object\n      required: [question_text, is_root, is_escalation]\n      properties:\n        question_text: { type: string }\n        options:\n          type: array\n          items: { $ref: '#/components/schemas/DecisionTreeOption' }\n        is_root: { type: boolean }\n        is_escalation: { type: boolean }\n\n    DecisionTreeNode:\n      allOf:\n        - $ref: '#/components/schemas/DecisionTreeNodeCreateRequest'\n        - type: object\n          required: [id, article_id]\n          properties:\n            id: { type: integer }\n            article_id: { type: integer }\n\n    DecisionTreeValidationResult:\n      type: object\n      required: [is_valid, issues]\n      properties:\n        is_valid: { type: boolean }\n        issues:\n          type: array\n          items:\n            type: object\n            properties:\n              node_id: { type: integer }\n              problem:\n                type: string\n                enum: [DEAD_END, UNREACHABLE, MULTIPLE_ROOTS, BROKEN_REFERENCE]\n\n    # --- Notifications & Firmware (\u0448\u0430\u0433 5) ---\n    NotificationCreateRequest:\n      type: object\n      required: [type, message]\n      properties:\n        type: { type: string, enum: [firmware, maintenance, news, promo] }\n        target_vehicle_model_id: { type: integer, nullable: true, description: \"null = \u0432\u0441\u0435 \u043c\u043e\u0434\u0435\u043b\u0438\" }\n        firmware_release_id: { type: integer, nullable: true }\n        message: { type: string }\n\n    Notification:\n      type: object\n      required: [id, type, message, created_at]\n      properties:\n        id: { type: integer }\n        type: { type: string, enum: [firmware, maintenance, news, promo] }\n        target_vehicle_model_id: { type: integer, nullable: true }\n        firmware_release_id: { type: integer, nullable: true }\n        message: { type: string }\n        created_at: { type: string, format: date-time }\n\n    NotificationListItem:\n      allOf:\n        - $ref: '#/components/schemas/Notification'\n        - type: object\n          properties:\n            read_at: { type: string, format: date-time, nullable: true, description: \"NotificationRecipient.read_at\" }\n\n    NotificationList:\n      type: object\n      required: [items, meta]\n      properties:\n        items:\n          type: array\n          items: { $ref: '#/components/schemas/NotificationListItem' }\n        meta: { $ref: '#/components/schemas/PaginationMeta' }\n\n    FirmwareReleaseCreateRequest:\n      type: object\n      required: [vehicle_model_id, version, released_at]\n      properties:\n        vehicle_model_id: { type: integer }\n        version: { type: string, example: \"2.4.1\" }\n        released_at: { type: string, format: date }\n\n    FirmwareRelease:\n      type: object\n      required: [id, vehicle_model_id, version, released_at]\n      properties:\n        id: { type: integer }\n        vehicle_model_id: { type: integer }\n        version: { type: string }\n        released_at: { type: string, format: date }\n\n  responses:\n    BadRequest:\n      description: \u041d\u0435\u043a\u043e\u0440\u0440\u0435\u043a\u0442\u043d\u044b\u0439 \u0437\u0430\u043f\u0440\u043e\u0441\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    Unauthorized:\n      description: \u041d\u0435 \u0430\u0432\u0442\u043e\u0440\u0438\u0437\u043e\u0432\u0430\u043d (\u043d\u0435\u0442/\u043f\u0440\u043e\u0441\u0440\u043e\u0447\u0435\u043d \u0442\u043e\u043a\u0435\u043d)\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    Forbidden:\n      description: \u041d\u0435\u0442 \u0434\u043e\u0441\u0442\u0443\u043f\u0430 (RBAC)\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    NotFound:\n      description: \u0420\u0435\u0441\u0443\u0440\u0441 \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    Conflict:\n      description: \u041a\u043e\u043d\u0444\u043b\u0438\u043a\u0442 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044f (\u043d\u0430\u043f\u0440. VIN \u0443\u0436\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d)\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    ValidationError:\n      description: \u041e\u0448\u0438\u0431\u043a\u0430 \u0432\u0430\u043b\u0438\u0434\u0430\u0446\u0438\u0438 \u0432\u0445\u043e\u0434\u043d\u044b\u0445 \u0434\u0430\u043d\u043d\u044b\u0445\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    RateLimited:\n      description: \u041f\u0440\u0435\u0432\u044b\u0448\u0435\u043d \u043b\u0438\u043c\u0438\u0442 \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432 (\u043d\u0430\u043f\u0440. \u043f\u043e\u043f\u044b\u0442\u043a\u0438 SMS-\u043a\u043e\u0434\u0430)\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n    ServerError:\n      description: \u0412\u043d\u0443\u0442\u0440\u0435\u043d\u043d\u044f\u044f \u043e\u0448\u0438\u0431\u043a\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0430\n      content:\n        application/json:\n          schema: { $ref: '#/components/schemas/Error' }\n";
</script>

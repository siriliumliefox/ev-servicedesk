const OPENAPI_YAML = "openapi: 3.0.3\ninfo:\n  title: EV-ServiceDesk API\n  version: \"1.14.0\"\n  description: >\n    API \u0434\u0438\u043f\u043b\u043e\u043c\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430 \u00abEV-ServiceDesk\u00bb (\u041e\u041e\u041e \u00ab\u0415\u0422\u0421\u0430\u0432\u0442\u043e\u0413\u043e\u043c\u0435\u043b\u044c\u00bb).\n    \u041a\u043e\u043d\u0442\u0440\u0430\u043a\u0442\u044b \u0441\u0435\u0440\u0432\u0438\u0441\u043e\u0432: Auth, Vehicle, Aggregates & Maintenance, Tickets,\n    Knowledge Base, Notifications, Analytics.\n  contact:\n    name: Sirilium / EV-ServiceDesk\n    email: dev@ev-servicedesk.example.com\n\nservers:\n  - url: https://api.ev-servicedesk.example.com/v1\n    description: Production\n  - url: https://staging-api.ev-servicedesk.example.com/v1\n    description: Staging\n  - url: http://localhost:4010\n    description: Local mock (Prism, `npm run mock`) \u2014 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u0430\u044f \u0440\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u043a\u043b\u0438\u0435\u043d\u0442\u043e\u0432\n  - url: http://localhost:8000/v1\n    description: Local backend (uvicorn)\n\nsecurity:\n  - bearerAuth: []\n\ntags:\n  - name: Auth\n  - name: Vehicle\n  - name: Aggregates\n    description: >\n      Aggregates & Maintenance Service: \u0441\u043f\u0440\u0430\u0432\u043e\u0447\u043d\u0438\u043a \u0430\u0433\u0440\u0435\u0433\u0430\u0442\u043e\u0432, \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u044b \u0422\u041e, \u043f\u043e\u0440\u043e\u0433\u0438 \u0438\n      \u0441\u0442\u0430\u0442\u0443\u0441\u044b \u00ab\u0441\u0432\u0435\u0442\u043e\u0444\u043e\u0440\u00bb. \u0421\u043f\u0435\u0446\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044f \u0430\u043b\u0433\u043e\u0440\u0438\u0442\u043c\u0430 \u0438 \u0442\u0430\u0431\u043b\u0438\u0446\u0430 \u0442\u0435\u0441\u0442\u043e\u0432\u044b\u0445 \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0435\u0432 (\u0413\u043b\u0430\u0432\u0430 5,\n      ADR 0009): docs/specs/AGGREGATE_STATUS_ALGORITHM.md,\n      docs/specs/aggregate_status_scenarios.yaml.\n    externalDocs:\n      description: \u0421\u043f\u0435\u0446\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044f \u0430\u043b\u0433\u043e\u0440\u0438\u0442\u043c\u0430 \u00ab\u0441\u0432\u0435\u0442\u043e\u0444\u043e\u0440\u00bb \u0438 \u0442\u0435\u0441\u0442\u043e\u0432\u044b\u0435 \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0438 (\u0413\u043b\u0430\u0432\u0430 5)\n      url: https://github.com/siriliumliefox/ev-servicedesk/blob/develop/docs/specs/AGGREGATE_STATUS_ALGORITHM.md\n  - name: Uploads\n    description: >\n      \u0412\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u0442\u0438\u043a\u0435\u0442\u043e\u0432 \u0438 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439: presigned PUT \u0432 S3 \u0438 \u043f\u0440\u0438\u0432\u044f\u0437\u043a\u0430 \u043f\u043e file_url (ADR 0004, ADR 0017).\n  - name: Tickets\n    description: >\n      Tickets Service (\u0413\u043b\u0430\u0432\u0430 13, ADR 0017). SLA \u2014 \u0441\u0440\u043e\u043a \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u0442\u0438\u043a\u0435\u0442\u0430: sla_due_at = created_at +\n      \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 (app_crash \u2014 4 \u0447, navigation \u2014 8 \u0447, sim \u2014 8 \u0447, audio \u2014 24 \u0447, maintenance \u2014\n      48 \u0447; \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u043d\u043e\u0435 \u0432\u0440\u0435\u043c\u044f 24/7); \u0432\u044b\u0447\u0438\u0441\u043b\u044f\u0435\u0442\u0441\u044f \u043e\u0434\u0438\u043d \u0440\u0430\u0437 \u043f\u0440\u0438 \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u0438 \u0438 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f (\u043d\u0438\n      \u043f\u0435\u0440\u0435\u043e\u0442\u043a\u0440\u044b\u0442\u0438\u0435\u043c, \u043d\u0438 \u043e\u0436\u0438\u0434\u0430\u043d\u0438\u0435\u043c \u0432\u0435\u043d\u0434\u043e\u0440\u0430). \u041f\u0435\u0440\u0432\u0438\u0447\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442 \u2014 \u043c\u0435\u0442\u0440\u0438\u043a\u0430 \u0430\u043d\u0430\u043b\u0438\u0442\u0438\u043a\u0438, \u043d\u0435 \u0441\u0440\u043e\u043a.\n      \u0413\u0440\u0430\u0444 \u0441\u0442\u0430\u0442\u0443\u0441\u043e\u0432 \u2014 updateTicketStatus, \u0432\u0438\u0434\u0438\u043c\u043e\u0441\u0442\u044c \u0442\u0438\u043a\u0435\u0442\u043e\u0432 \u2014 getTicket. \u0420\u0435\u0430\u043b-\u0442\u0430\u0439\u043c \u0434\u043e\u0441\u0442\u0430\u0432\u043a\u0430\n      \u0441\u043e\u0431\u044b\u0442\u0438\u0439 \u0442\u0438\u043a\u0435\u0442\u0430 \u2014 WebSocket /v1/tickets/{ticketId}/ws, \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u0435 \u2014 docs/asyncapi.yaml\n      (AsyncAPI 3.0). \u041f\u043e\u0432\u0442\u043e\u0440 \u043f\u043e\u0441\u043b\u0435 \u043e\u0431\u0440\u044b\u0432\u0430 \u0441\u0432\u044f\u0437\u0438: createTicket \u0438 createTicketMessage \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u044e\u0442\n      client_request_id \u2014 \u043a\u043b\u044e\u0447 \u043f\u043e\u0432\u0442\u043e\u0440\u0430 (UUID \u0447\u0435\u0440\u043d\u043e\u0432\u0438\u043a\u0430, 1.13.0, ADR 0031).\n    externalDocs:\n      description: \u0421\u043e\u0431\u044b\u0442\u0438\u044f \u0442\u0438\u043a\u0435\u0442\u0430 \u043f\u043e WebSocket \u2014 AsyncAPI 3.0 (\u0413\u043b\u0430\u0432\u0430 13, ADR 0017)\n      url: https://github.com/siriliumliefox/ev-servicedesk/blob/develop/docs/asyncapi.yaml\n  - name: KnowledgeBase\n    description: >\n      Knowledge Base Service (\u0413\u043b\u0430\u0432\u0430 14, ADR 0018). \u0421\u0442\u0430\u0442\u044c\u044f \u2014 \u00ab\u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0441\u0442\u0432\u043e\u00bb (guide) \u0438\u043b\u0438\n      \u00ab\u0443\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u0435 \u043d\u0435\u043f\u043e\u043b\u0430\u0434\u043e\u043a\u00bb (troubleshooting) \u0441 \u0434\u0435\u0440\u0435\u0432\u043e\u043c \u0440\u0435\u0448\u0435\u043d\u0438\u0439 \u0438 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0435\u0439 \u043e\u0448\u0438\u0431\u043a\u0438 (= \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f\n      \u0442\u0438\u043a\u0435\u0442\u0430). \u0412\u0435\u0440\u0441\u0438\u044f \u2014 \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u0430\u044f \u0440\u0435\u0434\u0430\u043a\u0446\u0438\u044f: \u0441\u043d\u0438\u043c\u043e\u043a \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043a\u0430, \u0442\u0435\u043a\u0441\u0442\u0430, \u043f\u0440\u0438\u0432\u044f\u0437\u043a\u0438 \u0438 \u0434\u0435\u0440\u0435\u0432\u0430\n      (listKnowledgeArticleRevisions); \u0447\u0435\u0440\u043d\u043e\u0432\u0438\u043a \u0434\u043e \u043f\u0435\u0440\u0432\u043e\u0439 \u043f\u0443\u0431\u043b\u0438\u043a\u0430\u0446\u0438\u0438 \u0432\u0435\u0440\u0441\u0438\u0439 \u043d\u0435 \u0438\u043c\u0435\u0435\u0442. \u041a\u043b\u0438\u0435\u043d\u0442 \u0438\n      \u0438\u043d\u0436\u0435\u043d\u0435\u0440 \u0432\u0438\u0434\u044f\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0441\u0442\u0430\u0442\u044c\u0438 (\u0447\u0435\u0440\u043d\u043e\u0432\u0438\u043a \u2014 404), admin \u2014 \u0432\u0441\u0435 (RBAC-05).\n      \u0423\u0437\u043b\u044b \u0434\u0435\u0440\u0435\u0432\u0430: \u0432\u043e\u043f\u0440\u043e\u0441 (\u043e\u0442 1 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430), \u0440\u0435\u0448\u0435\u043d\u0438\u0435 (\u0431\u0435\u0437 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u043e\u0432, is_escalation=false),\n      \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u044f (is_escalation=true, \u00ab\u0421\u043e\u0437\u0434\u0430\u0442\u044c \u043e\u0431\u0440\u0430\u0449\u0435\u043d\u0438\u0435\u00bb \u2014 createTicket \u0441 source_article_id \u0438\n      source_node_id). Content \u2014 Markdown (CommonMark) \u0431\u0435\u0437 HTML: HTML-\u0442\u0435\u0433\u0438, \u043a\u043e\u043c\u043c\u0435\u043d\u0442\u0430\u0440\u0438\u0438 \u0438\n      \u043e\u0431\u044a\u044f\u0432\u043b\u0435\u043d\u0438\u044f \u0441\u0435\u0440\u0432\u0435\u0440 \u043e\u0442\u043a\u043b\u043e\u043d\u044f\u0435\u0442 \u2014 422 VALIDATION_ERROR \u043f\u043e \u043f\u043e\u043b\u044e content (1.12.0, ADR 0029 \u043f. 10).\n  - name: Notifications\n    description: >\n      \u0423\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u044f \u043a\u043b\u0438\u0435\u043d\u0442\u0430: \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438, \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u044f \u043e \u0422\u041e, \u043d\u043e\u0432\u043e\u0441\u0442\u0438 \u0438 \u0430\u043a\u0446\u0438\u0438 (ADR 0019). \u0410\u0443\u0434\u0438\u0442\u043e\u0440\u0438\u044f\n      \u0444\u0438\u043a\u0441\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u0432 \u043c\u043e\u043c\u0435\u043d\u0442 \u043f\u0443\u0431\u043b\u0438\u043a\u0430\u0446\u0438\u0438; push \u2014 \u0434\u043e\u0441\u0442\u0430\u0432\u043a\u0430 \u0447\u0435\u0440\u0435\u0437 FCM \u0438\u0437 \u0438\u0441\u0445\u043e\u0434\u044f\u0449\u0435\u0439 \u043e\u0447\u0435\u0440\u0435\u0434\u0438\n      (notification_delivery), \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u0435 push \u2014 markNotificationOpened. \u0422\u0435\u043a\u0441\u0442\u044b push \u0431\u0435\u0437 \u041f\u0414.\n  - name: Users\n    description: >\n      \u041f\u0440\u043e\u0444\u0438\u043b\u044c (/me) \u0438 \u0443\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f\u043c\u0438 \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c (\u0413\u043b\u0430\u0432\u0430 17, ADR 0021 \u043f. 3):\n      \u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a\u0438 \u0441\u043e\u0437\u0434\u0430\u044e\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 createStaffUser (\u043f\u0435\u0440\u0432\u044b\u0439 \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440 \u0441\u0440\u0435\u0434\u044b \u2014 CLI \u043e\u0431\u0440\u0430\u0437\u0430\n      `python -m app.cli create-admin`), \u043a\u043b\u0438\u0435\u043d\u0442\u044b \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u0443\u044e\u0442\u0441\u044f \u0441\u0430\u043c\u0438. \u0411\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u043a\u0430\n      (is_active=false) \u2014 \u0433\u043b\u043e\u0441\u0441\u0430\u0440\u0438\u0439 \u00ab\u0411\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u043a\u0430 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f\u00bb. \u0420\u0435\u0430\u043b\u0438\u0437\u043e\u0432\u0430\u043d\u043e \u0432 1.7.1. \u0421\u0431\u0440\u043e\u0441 \u043f\u0430\u0440\u043e\u043b\u044f\n      \u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a\u0430 \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c (resetUserPassword) \u2014 1.11.0 (\u0433\u043b\u0430\u0432\u0430 22, ADR 0026); \u0441\u043c\u0435\u043d\u0430 \u043f\u0430\u0440\u043e\u043b\u044f\n      \u0441\u0430\u043c\u0438\u043c \u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a\u043e\u043c (changeStaffPassword) \u2014 1.12.0 (\u0433\u043b\u0430\u0432\u0430 25, ADR 0029).\n  - name: Analytics\n    description: >\n      \u0414\u0430\u0448\u0431\u043e\u0440\u0434 \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430 (A-05, A-06; ADR 0020). \u041f\u043e\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u0438 \u0441\u0447\u0438\u0442\u0430\u044e\u0442\u0441\u044f \u043f\u043e \u0432\u0438\u0442\u0440\u0438\u043d\u0435 \u0444\u0430\u043a\u0442\u043e\u0432,\n      \u043a\u043e\u0442\u043e\u0440\u0443\u044e \u0444\u043e\u043d\u043e\u0432\u044b\u0439 worker \u043e\u0431\u043d\u043e\u0432\u043b\u044f\u0435\u0442 \u0440\u0430\u0437 \u0432 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u043c\u0438\u043d\u0443\u0442: computed_at \u2014 \u043c\u043e\u043c\u0435\u043d\u0442, \u043f\u043e\n      \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044e \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0443\u0447\u0442\u0435\u043d\u044b \u0434\u0430\u043d\u043d\u044b\u0435. \u041f\u0435\u0440\u0438\u043e\u0434 [date_from, date_to] \u2014 \u0434\u0430\u0442\u044b \u043f\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u041c\u0438\u043d\u0441\u043a\u0430\n      (Europe/Minsk) \u0432\u043a\u043b\u044e\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u043e; \u0442\u0438\u043a\u0435\u0442 \u0438 \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u0435 \u043e \u0422\u041e \u043e\u0442\u043d\u043e\u0441\u044f\u0442\u0441\u044f \u043a \u043f\u0435\u0440\u0438\u043e\u0434\u0443 \u043f\u043e \u0434\u0430\u0442\u0435\n      \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u044f. 422 \u2014 date_from > date_to (INVALID_PERIOD) \u0438\u043b\u0438 \u043f\u0435\u0440\u0438\u043e\u0434 \u0434\u043b\u0438\u043d\u043d\u0435\u0435 366 \u0434\u043d\u0435\u0439\n      (PERIOD_TOO_LONG). \u0427\u0430\u0441\u044b \u043e\u043a\u0440\u0443\u0433\u043b\u044f\u044e\u0442\u0441\u044f \u0434\u043e 0,01, \u0434\u043e\u043b\u0438 \u2014 \u0434\u043e 0,0001.\n\npaths:\n  # ===================== AUTH SERVICE (\u0448\u0430\u0433 2) =====================\n  # \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u0438 \u043b\u043e\u0433\u0438\u043d \u043e\u0431\u044a\u0435\u0434\u0438\u043d\u0435\u043d\u044b \u0432 \u0435\u0434\u0438\u043d\u044b\u0439 passwordless-\u0444\u043b\u043e\u0443 \u043f\u043e \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0443:\n  # request-code -> verify-code. \u041e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0433\u043e /auth/register \u043d\u0435\u0442 \u043d\u0430\u043c\u0435\u0440\u0435\u043d\u043d\u043e \u2014\n  # verify-code \u0441\u0430\u043c \u0441\u043e\u0437\u0434\u0430\u0451\u0442 User \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u043c \u0432\u0445\u043e\u0434\u0435 (is_new_user \u0432 \u043e\u0442\u0432\u0435\u0442\u0435).\n  /auth/phone/request-code:\n    post:\n      tags: [Auth]\n      summary: \u0417\u0430\u043f\u0440\u043e\u0441\u0438\u0442\u044c SMS-\u043a\u043e\u0434 \u0434\u043b\u044f \u0432\u0445\u043e\u0434\u0430/\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u043f\u043e \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0443\n      operationId: requestPhoneCode\n      description: >\n        \u041e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 SMS \u0441 \u043e\u0434\u043d\u043e\u0440\u0430\u0437\u043e\u0432\u044b\u043c \u043a\u043e\u0434\u043e\u043c \u043d\u0430 \u0443\u043a\u0430\u0437\u0430\u043d\u043d\u044b\u0439 \u043d\u043e\u043c\u0435\u0440 (\u043a\u043e\u0434 4\u20138 \u0446\u0438\u0444\u0440, \u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e 4;\n        TTL \u2014 ttl_seconds). 429 RATE_LIMITED \u2014 \u043f\u0430\u0443\u0437\u0430 \u043c\u0435\u0436\u0434\u0443 \u0437\u0430\u043f\u0440\u043e\u0441\u0430\u043c\u0438 \u0438 \u043b\u0438\u043c\u0438\u0442\u044b \u043d\u0430 \u043d\u043e\u043c\u0435\u0440 \u0438\n        \u0430\u0434\u0440\u0435\u0441 (\u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a Retry-After); 422 PHONE_NOT_SUPPORTED \u2014 SMS \u043d\u0430 \u043d\u043e\u043c\u0435\u0440 \u043d\u0435 \u0434\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f;\n        503 SMS_UNAVAILABLE (\u0447\u0435\u0440\u0435\u0437 default) \u2014 \u043f\u0440\u043e\u0432\u0430\u0439\u0434\u0435\u0440 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d. \u041a\u043e\u0434\u044b \u043e\u0448\u0438\u0431\u043e\u043a \u0443\u0442\u043e\u0447\u043d\u0435\u043d\u044b \u0432 1.2.0.\n        \u041d\u043e\u043c\u0435\u0440 \u0437\u0430\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e \u043a\u043b\u0438\u0435\u043d\u0442\u0430 \u0438 \u043d\u043e\u043c\u0435\u0440 \u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a\u0430 \u043f\u043e\u043b\u0443\u0447\u0430\u044e\u0442 \u0442\u043e\u0442 \u0436\u0435 \u043e\u0442\u0432\u0435\u0442 200, \u043d\u043e \u043a\u043e\u0434 \u043d\u0435\n        \u0441\u043e\u0437\u0434\u0430\u0451\u0442\u0441\u044f \u0438 SMS \u043d\u0435 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f: \u043e\u0442\u0432\u0435\u0442 \u043d\u0435 \u0440\u0430\u0441\u043a\u0440\u044b\u0432\u0430\u0435\u0442, \u0447\u0435\u0439 \u043d\u043e\u043c\u0435\u0440 (1.12.0, ADR 0029 \u043f. 15).\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/PhoneRequestCode' }\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '200':\n          description: \u041a\u043e\u0434 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u0435\u043d\n          content:\n            application/json:\n              schema:\n                type: object\n                properties:\n                  ttl_seconds: { type: integer, example: 120 }\n        '400': { $ref: '#/components/responses/ValidationError' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n        '429': { $ref: '#/components/responses/RateLimited' }\n\n  /auth/phone/verify-code:\n    post:\n      tags: [Auth]\n      summary: \u041f\u043e\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u044c SMS-\u043a\u043e\u0434 \u2014 \u0432\u0445\u043e\u0434 \u0438\u043b\u0438 \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u0435 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0430 (role=client)\n      operationId: verifyPhoneCode\n      description: >\n        \u041f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u043a\u043e\u0434; \u0441\u043e\u0437\u0434\u0430\u0451\u0442 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u043c \u043e\u0431\u0440\u0430\u0449\u0435\u043d\u0438\u0438.\n        422 PD_CONSENT_REQUIRED \u2014 \u043d\u0435\u0442 \u0434\u0435\u0439\u0441\u 0\u0435\u0437 VIN-\u0434\u0435\u043a\u043e\u0434\u0435\u0440 (\u0438\u043b\u0438 \u043c\u043e\u043a).\n        \u0415\u0441\u043b\u0438 \u0434\u0435\u043a\u043e\u0434\u0435\u0440 \u043d\u0435 \u0441\u043c\u043e\u0433 \u0440\u0430\u0441\u043f\u043e\u0437\u043d\u0430\u0442\u044c VIN \u2014 422 \u0441 \u043a\u043e\u0434\u043e\u043c VIN_DECODE_FAILED,\n        \u0438 \u043a\u043b\u0438\u0435\u043d\u0442 \u0434\u043e\u043b\u0436\u0435\u043d \u043f\u0435\u0440\u0435\u0434\u0430\u0442\u044c vehicle_model_id \u0432\u0440\u0443\u0447\u043d\u0443\u044e \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u044b\u043c \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u043c\n        (Vehicle \u0431\u0435\u0437 VehicleModel \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u043d\u0435\u043b\u044c\u0437\u044f \u2014 FK NOT NULL, \u0413\u043b\u0430\u0432\u0430 2);\n        \u043d\u0435\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u044e\u0449\u0438\u0439 vehicle_model_id \u2014 422 VEHICLE_MODEL_NOT_FOUND.\n        \u041a\u043e\u043d\u0442\u0440\u043e\u043b\u044c\u043d\u0430\u044f \u0446\u0438\u0444\u0440\u0430 VIN \u043d\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442\u0441\u044f (VIN \u0438\u0437 \u0415\u0421), \u0441\u0442\u0440\u043e\u0447\u043d\u044b\u0435 \u0431\u0443\u043a\u0432\u044b \u2014 422 (ADR 0014).\n        409 VIN_REGISTERED_TO_ANOTHER_ACCOUNT \u2014 VIN \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d \u043a \u0434\u0440\u0443\u0433\u043e\u043c\u0443 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0443 (\u0432\u043b\u0430\u0434\u0435\u043b\u0435\u0446\n        \u043d\u0435 \u0440\u0430\u0441\u043a\u0440\u044b\u0432\u0430\u0435\u0442\u0441\u044f); 409 VIN_ALREADY_ADDED \u2014 \u0443\u0436\u0435 \u0432 \u044d\u0442\u043e\u043c \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0435. \u0421\u0432\u043e\u0451 \u0443\u0434\u0430\u043b\u0451\u043d\u043d\u043e\u0435 \u0430\u0432\u0442\u043e\n        \u0441 \u0442\u0435\u043c \u0436\u0435 VIN \u0432\u043e\u0441\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0432\u043c\u0435\u0441\u0442\u0435 \u0441 \u0438\u0441\u0442\u043e\u0440\u0438\u0435\u0439 \u0440\u0430\u0431\u043e\u0442 (201, \u0442\u043e\u0442 \u0436\u0435 id).\n        429 RATE_LIMITED \u2014 \u043b\u0438\u043c\u0438\u0442 \u043f\u043e\u043f\u044b\u0442\u043e\u043a \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u043d\u0430 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f (\u0437\u0430\u0449\u0438\u0442\u0430 \u043e\u0442 \u043f\u0435\u0440\u0435\u0431\u043e\u0440\u0430 VIN),\n        \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a Retry-After. \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0438 \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.3.0.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/VehicleCreateRequest' }\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '201':\n          description: \u0410\u0432\u0442\u043e\u043c\u043e\u0431\u0438\u043b\u044c \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/Vehicle' }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n        '403': { $ref: '#/components/responses/Forbidden' }\n        '409': { $ref: '#/components/responses/Conflict' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n        '429': { $ref: '#/components/responses/RateLimited' }\n\n  /vehicles/{vehicleId}:\n    parameters:\n      - { name: vehicleId, in: path, required: true, schema: { type: integer } }\n    get:\n      tags: [Vehicle]\n      summary: \u041a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u0430\u0432\u0442\u043e\u043c\u043e\u0431\u0438\u043b\u044f (\u043c\u0430\u0440\u043a\u0430/\u043c\u043e\u0434\u0435\u043b\u044c/\u043f\u0440\u043e\u0431\u0435\u  [Uploads]\n      summary: \u041f\u043e\u043b\u0443\u0447\u0438\u0442\u044c presigned URL \u0434\u043b\u044f \u043f\u0440\u044f\u043c\u043e\u0439 \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0438 \u0444\u0430\u0439\u043b\u0430 \u0432 S3\n      operationId: createPresignedUpload\n      x-required-roles: [client, engineer, admin]\n      x-rbac-action: [\"\u0421\u043e\u0437\u0434\u0430\u043d\u0438\u0435 \u0442\u0438\u043a\u0435\u0442\u0430\", \"\u0421\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0432 \u0447\u0430\u0442\u0435 \u0442\u0438\u043a\u0435\u0442\u0430\"]\n      description: >\n        \u041a\u043b\u0438\u0435\u043d\u0442 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442 \u0444\u0430\u0439\u043b \u043d\u0430\u043f\u0440\u044f\u043c\u0443\u044e \u0432 S3 \u043f\u043e upload_url, \u043c\u0438\u043d\u0443\u044f API-\u0441\u0435\u0440\u0432\u0435\u0440\n        (\u043d\u0435 \u0433\u043e\u043d\u044f\u0435\u043c \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435 \u0447\u0435\u0440\u0435\u0437 backend). file_url \u0437\u0430\u0442\u0435\u043c \u043f\u0435\u0440\u0435\u0434\u0430\u0451\u0442\u0441\u044f\n        \u0432 \u0442\u0435\u043b\u0435 \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u044f \u0442\u0438\u043a\u0435\u0442\u0430/\u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u043a\u0430\u043a \u0441\u0441\u044b\u043b\u043a\u0430 \u043d\u0430 \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u0435.\n        \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0 (ADR 0017): upload_url \u2014 presigned PUT \u043d\u0430 15 \u043c\u0438\u043d\u0443\u0442 (expires_at) \u0432\n        uploads/{user_id}/{uuid}{\u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043d\u0438\u0435}; \u0438\u0437 file_name \u0431\u0435\u0440\u0451\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043d\u0438\u0435 (\u0438\u043c\u044f \u043c\u043e\u0436\u0435\u0442\n        \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442\u044c \u041f\u0414 \u0438 \u043d\u0435 \u0445\u0440\u0430\u043d\u0438\u0442\u0441\u044f); MIME \u043a \u043f\u043e\u0434\u043f\u0438\u0441\u0438 \u043d\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d. admin \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442 \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u0434\u043b\u044f\n        \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439 \u0432 \u0447\u0430\u0442\u0435 \u043b\u044e\u0431\u043e\u0433\u043e \u0442\u0438\u043a\u0435\u0442\u0430 (RBAC-04). \u041f\u0440\u0438 \u043f\u0440\u0438\u0432\u044f\u0437\u043a\u0435 \u043a \u0442\u0438\u043a\u0435\u0442\u0443 \u0438\u043b\u0438\n        \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044e backend \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u043e\u0431\u044a\u0435\u043a\u0442 \u0432 S3 (HEAD): \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d \u0442\u0435\u043a\u0443\u0449\u0438\u043c \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u0435\u043c, MIME \u0438\n        \u0440\u0430\u0437\u043c\u0435\u0440 \u2014 \u0438\u0437 S3, \u0430 \u043d\u0435 \u0441\u043e \u0441\u043b\u043e\u0432 \u043a\u043b\u0438\u0435\u043d\u0442\u0430; \u0437\u0430\u0442\u0435\u043c \u043a\u043e\u043f\u0438\u0440\u0443\u0435\u0442 \u0432 \u0445\u0440\u0430\u043d\u0438\u043b\u0438\u0449\u0435 \u0442\u0438\u043a\u0435\u0442\u0430 \u0440\u043e\u0432\u043d\u043e\n        \u043f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u043d\u0443\u044e \u0432\u0435\u0440\u0441\u0438\u044e \u043e\u0431\u044a\u0435\u043a\u0442\u0430 (ETag) \u0441 \u043f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u043d\u044b\u043c MIME. \u0414\u043e\u043f\u0443\u0441\u0442\u0438\u043c\u043e:\n        photo \u2014 image/jpeg, image/png, image/heic, image/webp \u0434\u043e 20 \u041c\u0411; video \u2014 video/mp4,\n        video/quicktime \u0434\u043e 200 \u041c\u0411; \u0434\u043e 10 \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u0439 \u043d\u0430 \u0442\u0438\u043a\u0435\u0442 \u0438\u043b\u0438 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435. \u041e\u0448\u0438\u0431\u043a\u0438 \u043f\u0440\u0438\u0432\u044f\u0437\u043a\u0438 (422\n        \u0443 createTicket \u0438 createTicketMessage): ATTACHMENT_NOT_FOUND \u2014 \u043e\u0431\u044a\u0435\u043a\u0442 \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d \u0441\u0440\u0435\u0434\u0438\n        \u0437\u0430\u0433\u0440\u0443\u0437\u043e\u043a \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f \u0438\u043b\u0438 \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0438\u0441\u0430\u043d \u043f\u043e\u0441\u043b\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0438; ATTACHMENT_ALREADY_USED \u2014\n        \u043e\u0431\u044a\u0435\u043a\u0442 \u0443\u0436\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d (\u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u044b\u0439 \u0437\u0430\u043f\u0440\u043e\u0441, \u043f\u0440\u043e\u0438\u0433\u0440\u0430\u0432\u0448\u0438\u0439 \u043f\u0440\u0438\u0432\u044f\u0437\u043a\u0443, \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u044d\u0442\u043e\u0442 \u043a\u043e\u0434 \u0438\u043b\u0438\n        ATTACHMENT_NOT_FOUND, \u0435\u0441\u043b\u0438 \u0438\u0441\u0445\u043e\u0434\u043d\u044b\u0439 \u043e\u0431\u044a\u0435\u043a\u0442 \u0443\u0436\u0435 \u0443\u0434\u0430\u043b\u0451\u043d \u043f\u043e\u0441\u043b\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u043a\u0438);\n        ATTACHMENT_TYPE_NOT_ALLOWED \u2014 MIME \u043d\u0435 \u0438\u0437 \u0441\u043f\u0438\u0441\u043a\u0430 \u0438\u043b\u0438 \u043d\u0435 \u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0443\u0435\u0442 file_type;\n        ATTACHMENT_TOO_LARGE \u2014 \u0440\u0430\u0437\u043c\u0435\u0440 \u0431\u043e\u043b\u044c\u0448\u0435 \u043b\u0438\u043c\u0438\u0442\u0430; TOO_MANY_ATTACHMENTS \u2014 \u0431\u043e\u043b\u044c\u0448\u0435 10 \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u0439.\n        \u041d\u0435\u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d\u043d\u044b\u0435 \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0438 \u0443\u0434\u0430\u043b\u044f\u044e\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 24 \u0447. \u041f\u0440\u0438 \u0447\u0442\u0435\u043d\u0438\u0438 file_url \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u2014 presigned GET\n        \u043d\u0430 15 \u043c\u0438\u043d\u0443\u0442; Content-Type \u043e\u0442\u0432\u0435\u0442\u0430 \u2014 \u043f\u0440\u043e\u0432\u0435\u0440\u0435\u043d\u043d\u044b\u0439 MIME \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u044f (\u0432\u0445\u043e\u0434\u0438\u0442 \u0432 \u043f\u043e\u0434\u043f\u0438\u0441\u044c).\n        429 RATE_LIMITED \u2014 \u0431\u043e\u043b\u044c\u0448\u0435 60 \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432 \u0432 \u0447\u0430\u0441 \u043d\u0430 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f, \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a Retry-After.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/PresignRequest' }\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '200':\n          description: URL \u0434\u043b\u044f \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0438\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/PresignResponse' }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n        '403': { $ref: '#/components/responses/Forbidden' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n        '429': { $ref: '#/components/responses/RateLimited' }\n\n  # ===================== TICKETS SERVICE (\u0448\u0430\u0433 5) =====================\n  /tickets:\n    get:\n      tags: [Tickets]\n      summary: \u0421\u043f\u0438\u0441\u043e\u043a \u0442\u0438\u043a\u0435\u0442\u043e\u0432 (\u043a\u0430\u043d\u0431\u0430\u043d-\u0434\u043e\u0441\u043a\u0430 \u0438\u043d\u0436\u0435\u043d\u0435\u0440\u0430 / \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u043a\u043b\u0438\u0435\u043d\u0442\u0430)\n      operationId: listTickets\n      x-required-roles: [client, engineer, admin]\n      x-rbac-action: [\"\u041f\u0440\u043e\u0441\u043c\u043e\u0442\u0440 \u0442\u0438\u043a\u0435\u0442\u0430\"]\n      description: >\n        client \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0432\u043e\u0438 \u0442\u0438\u043a\u0435\u0442\u044b. engineer/admin \u2014 \u0444\u0438\u043b\u044c\u0442\u0440\u044b \u043f\u043e\n        status/category/overdue \u0434\u043b\u044f \u043a\u0430\u043d\u0431\u0430\u043d\u0430 (\u0413\u043b\u0430\u0432\u0430 21).\n        \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0 (ADR 0017, RBAC-04): client \u2014 \u0442\u0438\u043a\u0435\u0442\u044b \u0441\u0432\u043e\u0438\u0445 \u0430\u0432\u0442\u043e; engineer \u2014 \u043e\u0447\u0435\u0440\u0435\u0434\u044c\n        (status=new \u0431\u0435\u0437 \u0438\u0441\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044f) \u0438 \u0442\u0438\u043a\u0435\u0442\u044b, \u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044b\u0435 \u0435\u043c\u0443; admin \u2014 \u0432\u0441\u0435. \u0424\u0438\u043b\u044c\u0442\u0440\u044b \u0441\u0443\u0436\u0430\u044e\u0442\n        \u0432\u0438\u0434\u0438\u043c\u0443\u044e \u0432\u044b\u0431\u043e\u0440\u043a\u0443. \u041f\u043e\u0440\u044f\u0434\u043e\u043a: engineer/admin \u2014 \u043f\u043e sla_due_at \u043f\u043e \u0432\u043e\u0437\u0440\u0430\u0441\u0442\u0430\u043d\u0438\u044e (\u043f\u0440\u0438\u043e\u0440\u0438\u0442\u0435\u0442\n        \u0441\u043b\u0435\u0434\u0443\u0435\u0442 \u0438\u0437 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0447\u0435\u0440\u0435\u0437 \u0441\u0440\u043e\u043a SLA), client \u2014 \u043f\u043e created_at \u043f\u043e \u0443\u0431\u044b\u0432\u0430\u043d\u0438\u044e. \u041f\u0440\u043e\u0441\u0440\u043e\u0447\u043a\u0430\n        (is_overdue, \u0444\u0438\u043b\u044c\u0442\u0440 overdue) \u0432\u044b\u0447\u0438\u0441\u043b\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u0447\u0442\u0435\u043d\u0438\u0438: now() > sla_due_at \u0438 \u0441\u0442\u0430\u0442\u0443\u0441 \u043d\u0435\n        resolved. \u042d\u043b\u0435\u043c\u0435\u043d\u0442 \u0441\u043f\u0438\u0441\u043a\u0430 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442 vehicle_model \u0438 summary \u2014 \u0434\u043b\u044f \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u043a\u0430\u043d\u0431\u0430\u043d\u0430\n        (\u0437\u0430\u043a\u0440\u044b\u0432\u0430\u0435\u0442 ADR 0012 \u043f. 5).\n      parameters:\n        - name: status\n          in: query\n          schema: { type: string, enum: [new, in_progress, waiting_vendor, resolved] }\n        - name: category\n          in: query\n          schema: { type: string, enum: [navigation, audio, sim, app_crash, maintenance] }\n        - name: assigned_engineer_id\n          in: query\n          schema: { type: integer }\n        - name: overdue\n          in: query\n          schema: { type: boolean }\n          description: \u0422\u043e\u043b\u044c\u043a\u043e \u0442\u0438\u043a\u0435\u0442\u044b \u0441 \u043f\u0440\u043e\u0441\u0440\u043e\u0447\u0435\u043d\u043d\u044b\u043c SLA\n        - name: resolved_since\n          in: query\n          schema: { type: string, format: date-time }\n          description: >-\n            \u0422\u043e\u043b\u044c\u043a\u043e \u0442\u0438\u043a\u0435\u0442\u044b, \u0440\u0435\u0448\u0451\u043d\u043d\u044b\u0435 \u043d\u0435 \u0440\u0430\u043d\u044c\u0448\u0435 \u044d\u0442\u043e\u0433\u043e \u043c\u043e\u043c\u0435\u043d\u0442\u0430 (resolved_at >= resolved_since) \u2014 \u043a\u043e\u043b\u043e\u043d\u043a\u0430\n            \u00ab\u0420\u0435\u0448\u0435\u043d\u043e\u00bb \u043a\u0430\u043d\u0431\u0430\u043d\u0430. \u041f\u0435\u0440\u0435\u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u0442\u0438\u043a\u0435\u0442 (resolved_at = null) \u043d\u0435 \u043f\u043e\u043f\u0430\u0434\u0430\u0435\u0442. \u0412\u0440\u0435\u043c\u044f \u2014 \u0441\u043e\n            \u0441\u043c\u0435\u0449\u0435\u043d\u0438\u0435\u043c (RFC 3339), \u0431\u0435\u0437 \u043d\u0435\u0433\u043e \u0438\u043b\u0438 \u0432 \u043d\u0435\u0432\u0435\u0440\u043d\u043e\u043c \u0444\u043e\u0440\u043c\u0430\u0442\u0435 \u2014 422; \u043c\u043e\u043c\u0435\u043d\u0442 \u0432 \u0431\u0443\u0434\u0443\u0449\u0435\u043c \u2014\n            \u043f\u0443\u0441\u0442\u0430\u044f \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0430. \u041f\u043e\u0440\u044f\u0434\u043e\u043a \u0432\u044b\u0434\u0430\u0447\u0438 \u043f\u0440\u0435\u0436\u043d\u0438\u0439. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.10.0 (\u0433\u043b\u0430\u0432\u0430 21, ADR 0025).\n        - $ref: '#/components/parameters/PageParam'\n        - $ref: '#/components/parameters/PageSizeParam'\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '200':\n          description: \u0421\u0442\u0440\u0430\u043d\u0438\u0446\u0430 \u0442\u0438\u043a\u0435\u0442\u043e\u0432\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/TicketList' }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n    post:\n      tags: [Tickets]\n      summary: \u0421\u043e\u0437\u0434\u0430\u0442\u044c \u0442\u0438\u043a\u0435\u0442\n      operationId: createTicket\n      x-required-roles: [client]\n      x-rbac-action: [\"\u0421\u043e\u0437\u0434\u0430\u043d\u0438\u0435 \u0442\u0438\u043a\u0435\u0442\u0430\"]\n      description: >\n        source_article_id/source_node_id \u2014 \u043f\u0440\u0438 \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u0438 \u0438\u0437 \u0434\u0435\u0440\u0435\u0432\u0430 \u0440\u0435\u0448\u0435\u043d\u0438\u0439\n        (Knowledge Base), \u0438\u043d\u0430\u0447\u0435 null. \u0412\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u2014 \u0447\u0435\u0440\u0435\u0437 /uploads/presign\n        \u0437\u0430\u0440\u0430\u043d\u0435\u0435.\n        \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0 (ADR 0017): \u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430 \u0441\u0432\u043e\u0451 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0435 \u0430\u0432\u0442\u043e, \u0438\u043d\u0430\u0447\u0435 404. \u0422\u0438\u043a\u0435\u0442 \u0441\u043e\u0437\u0434\u0430\u0451\u0442\u0441\u044f \u0432\n        \u0441\u0442\u0430\u0442\u0443\u0441\u0435 new \u0431\u0435\u0437 \u0438\u0441\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044f (\u043e\u0447\u0435\u0440\u0435\u0434\u044c); sla_due_at = created_at + \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 (\u0442\u0435\u0433\n        Tickets); firmware_version_at_creation \u2014 \u0441\u043d\u0438\u043c\u043e\u043a \u0442\u0435\u043a\u0443\u0449\u0435\u0439 \u043f\u0440\u043e\u0448\u0438\u0432\u043a\u0438 \u0430\u0432\u0442\u043e (N-09).\n        description \u2014 1\u20264000 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 \u043f\u043e\u0441\u043b\u0435 \u043e\u0431\u0440\u0435\u0437\u043a\u0438 \u043f\u0440\u043e\u0431\u0435\u043b\u043e\u0432 \u043f\u043e \u043a\u0440\u0430\u044f\u043c. \u0421\u0442\u0430\u0442\u044c\u044f \u0438 \u0443\u0437\u0435\u043b \u0434\u043e\u043b\u0436\u043d\u044b\n        \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043e\u0432\u0430\u0442\u044c, \u0443\u0437\u0435\u043b \u2014 \u043f\u0440\u0438\u043d\u0430\u0434\u043b\u0435\u0436\u0430\u0442\u044c \u0441\u0442\u0430\u0442\u044c\u0435, \u0443\u0437\u0435\u043b \u0431\u0435\u0437 \u0441\u0442\u0430\u0442\u044c\u0438 \u0437\u0430\u043f\u0440\u0435\u0449\u0451\u043d \u2014 \u0438\u043d\u0430\u0447\u0435\n        422 INVALID_SOURCE_REFERENCE. \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.5.0 (ADR 0018 \u043f. 11): \u0443 \u0441\u0442\u0430\u0442\u044c\u0438 \u0434\u043e\u043b\u0436\u043d\u0430 \u0431\u044b\u0442\u044c\n        \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u0430\u044f \u0432\u0435\u0440\u0441\u0438\u044f (\u0441\u0435\u0439\u0447\u0430\u0441 \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c \u0441\u043d\u044f\u0442\u0430 \u0441 \u043f\u0443\u0431\u043b\u0438\u043a\u0430\u0446\u0438\u0438), source_node_id \u2014 \u0443\u0437\u0435\u043b\n        \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u0438 (is_escalation=true); \u0443\u0434\u0430\u043b\u0451\u043d\u043d\u044b\u0439 \u0443\u0437\u0435\u043b \u2014 422, \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u0442\u0435 \u0431\u0435\u0437 source_node_id.\n        \u0412 \u0442\u0438\u043a\u0435\u0442\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442\u0441\u044f \u0432\u0435\u0440\u0441\u0438\u044f \u0441\u0442\u0430\u0442\u044c\u0438 \u2014 TicketDetail.source_article. \u0412\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u2014 \u0434\u043e 10, \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u0438 \u043a\u043e\u0434\u044b \u043e\u0448\u0438\u0431\u043e\u043a 422 \u2014\n        createPresignedUpload. 429 RATE_LIMITED \u2014 \u0431\u043e\u043b\u044c\u0448\u0435 10 \u0442\u0438\u043a\u0435\u0442\u043e\u0432 \u0432 \u0447\u0430\u0441 \u043d\u0430 \u043a\u043b\u0438\u0435\u043d\u0442\u0430, \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a\n        Retry-After. \u041e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u0438\u044f \u043d\u0430 \u0447\u0438\u0441\u043b\u043e \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0445 \u0442\u0438\u043a\u0435\u0442\u043e\u0432 \u043d\u0435\u0442.\n        \u041f\u043e\u0432\u0442\u043e\u0440 (1.13.0, ADR 0031): \u0437\u0430\u043f\u0440\u043e\u0441 \u0441 client_request_id, \u0441 \u043a\u043e\u0442\u043e\u0440\u044b\u043c \u043d\u0430 \u044d\u0442\u043e \u0430\u0432\u0442\u043e \u0442\u0438\u043a\u0435\u0442 \u0443\u0436\u0435\n        \u0441\u043e\u0437\u0434\u0430\u043d, \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 201 \u0441 \u044d\u0442\u0438\u043c \u0442\u0438\u043a\u0435\u0442\u043e\u043c \u2014 \u0431\u0435\u0437 \u043d\u043e\u0432\u043e\u0433\u043e \u0442\u0438\u043a\u0435\u0442\u0430 \u0438 \u0431\u0435\u0437 \u0443\u0447\u0451\u0442\u0430 \u0432 \u043b\u0438\u043c\u0438\u0442\u0435;\n        \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u043f\u043e\u0432\u0442\u043e\u0440\u0430 \u043d\u0435 \u043f\u0440\u0438\u0432\u044f\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f (\u0438\u0445 \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043b \u0438\u0441\u0445\u043e\u0434\u043d\u044b\u0439 \u0437\u0430\u043f\u0440\u043e\u0441). \u0422\u043e\u0442 \u0436\u0435 \u043a\u043b\u044e\u0447 \u0441 \u0434\u0440\u0443\u0433\u0438\u043c\u0438\n        category \u0438\u043b\u0438 description \u2014 422 CLIENT_REQUEST_ID_REUSED.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/TicketCreateRequest' }\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '201':\n          description: \u0422\u0438\u043a\u0435\u0442 \u0441\u043e\u0437\u0434\u0430\u043d\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/TicketDetail' }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n        '403': { $ref: '#/components/responses/Forbidden' }\n        '404': { $ref: '#/components/responses/NotFound' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n        '429': { $ref: '#/components/responses/RateLimited' }\n\n  /tickets/{ticketId}:\n    parameters:\n      - { name: ticketId, in: path, required: true, schema: { type: integer } }\n    get:\n      tags: [Tickets]\n      summary: \u041a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u0442\u0438\u043a\u0435\u0442\u0430 \u0441 \u0430\u0432\u0442\u043e\u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d\u043d\u044b\u043c \u043a\u043e\u 47\u0435\u043d\u0438\u0435 \u043d\u0430 \u0442\u0438\u043a\u0435\u0442 \u0432 \u0441\u0442\u0430\u0442\u0443\u0441\u0435 new \u043f\u0435\u0440\u0435\u0432\u043e\u0434\u0438\u0442\n        \u0435\u0433\u043e \u0432 in_progress; \u043f\u0435\u0440\u0435\u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435 \u0441\u0442\u0430\u0442\u0443\u0441 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442; null \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u043d\u0435\u0440\u0435\u0448\u0451\u043d\u043d\u044b\u0439 \u0442\u0438\u043a\u0435\u0442 \u0432\n        new (\u0432 \u043e\u0447\u0435\u0440\u0435\u0434\u044c). \u0420\u0435\u0448\u0451\u043d\u043d\u044b\u0439 \u0442\u0438\u043a\u0435\u0442 (status=resolved) \u2014 409 TICKET_RESOLVED. \u041f\u043e\u0434\u043f\u0438\u0441\u0447\u0438\u043a\u0438\n        WebSocket \u043f\u043e\u043b\u0443\u0447\u0430\u044e\u0442 ticket.updated; \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0435 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f, \u043f\u043e\u0442\u0435\u0440\u044f\u0432\u0448\u0438\u0435 \u0434\u043e\u0441\u0442\u0443\u043f \u043a \u0442\u0438\u043a\u0435\u0442\u0443,\n        \u0437\u0430\u043a\u0440\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u0441 \u043a\u043e\u0434\u043e\u043c 4403 (docs/asyncapi.yaml).\n      x-required-roles: [admin]\n      x-rbac-action: [\"\u041d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435 \u0442\u0438\u043a\u0435\u0442\u0430 \u0438\u043d\u0436\u0435\u043d\u0435\u0440\u0443\"]\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/TicketAssignRequest' }\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '200':\n          description: \u041f\u0435\u0440\u0435\u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u043e\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/TicketDetail' }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n        '403': { $ref: '#/components/responses/Forbidden' }\n        '404': { $ref: '#/components/responses/NotFound' }\n        '409': { $ref: '#/components/responses/Conflict' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n\n  /tickets/{ticketId}/messages:\n    parameters:\n      - { name: ticketId, in: path, required: true, schema: { type: integer } }\n    get:\n      tags: [Tickets]\n      summary: \u0418\u0441\u0442\u043e\u0440\u0438\u044f \u0447\u0430\u0442\u0430 \u0442\u0438\u043a\u0435\u0442\u0430\n      operationId: listTicketMessages\n      x-required-roles: [client, engineer, admin]\n      x-rbac-action: [\"\u0421\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0432 \u0447\u0430\u0442\u0435 \u0442\u0438\u043a\u0435\u0442\u0430\"]\n      description: >\n        REST \u2014 \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u0430\u044f \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u0438 fallback (long-polling). \u0420\u0435\u0430\u043b-\u0442\u0430\u0439\u043c\n        \u0434\u043e\u0441\u0442\u0430\u0432\u043a\u0430 \u2014 \u043f\u043e WebSocket /v1/tickets/{ticketId}/ws (\u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0435\u0440\u0432\u0435\u0440 \u2192 \u043a\u043b\u0438\u0435\u043d\u0442),\n        \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u0435 \u2014 docs/asyncapi.yaml (AsyncAPI 3.0, \u0413\u043b\u0430\u0432\u0430 13).\n        \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0 (ADR 0017): \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u2014 \u043f\u043e id \u043f\u043e \u0432\u043e\u0437\u0440\u0430\u0441\u0442\u0430\u043d\u0438\u044e; after_id \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f\n        \u0441 id > after_id (\u0434\u043e\u0433\u0440\u0443\u0437\u043a\u0430 \u043f\u043e\u0441\u043b\u0435 \u043f\u0435\u0440\u0435\u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f WebSocket), page/page_size \u2014 \u043a\n        \u043e\u0442\u0444\u0438\u043b\u044c\u0442\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0439 \u0432\u044b\u0431\u043e\u0440\u043a\u0435. \u0414\u043e\u0441\u0442\u0443\u043f \u2014 \u043a\u0430\u043a \u0443 getTicket (engineer \u0447\u0438\u0442\u0430\u0435\u0442 \u0438 \u0442\u0438\u043a\u0435\u0442 \u0438\u0437 \u043e\u0447\u0435\u0440\u0435\u0434\u0438),\n        \u043d\u0435\u0432\u0438\u0434\u0438\u043c\u044b\u0439 \u0442\u0438\u043a\u0435\u0442 \u2014 404. \u041a\u043b\u0438\u0435\u043d\u0442\u0443 \u0430\u0432\u0442\u043e\u0440-\u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a \u043e\u0442\u0434\u0430\u0451\u0442\u0441\u044f \u0441 phone \u0438 telegram_id = null\n        (ADR 0017 \u043f. 12). file_url \u0432\u043b\u043e\u0436\u0435\u043d\u0438\u0439 \u2014 presigned GET \u043d\u0430 15 \u043c\u0438\u043d\u0443\u0442.\n      parameters:\n        - name: after_id\n          in: query\n          required: false\n          schema: { type: integer, minimum: 0 }\n          description: >-\n            \u0422\u043e\u043b\u044c\u043a\u043e \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0441 id > after_id, \u043f\u043e \u0432\u043e\u0437\u0440\u0430\u0441\u0442\u0430\u043d\u0438\u044e id \u2014 \u0434\u043e\u0433\u0440\u0443\u0437\u043a\u0430 \u043f\u0440\u043e\u043f\u0443\u0449\u0435\u043d\u043d\u043e\u0433\u043e \u043f\u043e\u0441\u043b\u0435\n            \u043f\u0435\u0440\u0435\u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f WebSocket. \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u043e \u0432 1.4.0.\n        - $ref: '#/components/parameters/PageParam'\n        - $ref: '#/components/parameters/PageSizeParam'\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '200':\n          description: \u0421\u0442\u0440\u0430\u043d\u0438\u0446\u0430 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439\n          content:\n            application/json:\n              schema: { $ref: '#/components/schemas/TicketMessageList' }\n        '401': { $ref: '#/components/responses/Unauthorized' }\n        '404': { $ref: '#/components/responses/NotFound' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n    post:\n      tags: [Tickets]\n      summary: \u041e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u0432 \u0442\u0438\u043a\u0435\u0442\n      operationId: createTicketMessage\n      description: >\n        \u0414\u043e\u0431\u0430\u0432\u043b\u044f\u0435\u0442 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u0432 \u0447\u0430\u0442 \u0442\u0438\u043a\u0435\u0442\u0430; \u0434\u043e\u0441\u0442\u0443\u043f\u043d\u043e \u0432\u0441\u0435\u043c \u0441\u0442\u043e\u0440\u043e\u043d\u0430\u043c \u0434\u0438\u0430\u043b\u043e\u0433\u0430.\n        \u0423\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.4.0 (ADR 0017): \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u0441\u043f\u043e\u0441\u043e\u0431 \u043e\u0442\u043f\u0440\u0430\u0432\u043a\u0438 (WebSocket \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043e\u0441\u0442\u0430\u0432\u043a\u0430).\n        client \u2014 \u0432 \u0442\u0438\u043a\u0435\u0442 \u0441\u0432\u043e\u0435\u0433\u043e \u0430\u0432\u0442\u043e (\u0432 \u0442. \u0447. \u0432 \u0441\u0442\u0430\u0442\u0443\u0441\u0435 new); engineer \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044b\u0439\n        \u0435\u043c\u0443 \u0442\u0438\u043a\u0435\u0442 (\u0442\u0438\u043a\u0435\u0442 \u0438\u0437 \u043e\u0447\u0435\u0440\u0435\u0434\u0438 \u2014 \u0441\u043d\u0430\u0447\u0430\u043b\u0430 claimTicket, \u0438\u043d\u0430\u0447\u0435 403); admin \u2014 \u0432 \u043b\u044e\u0431\u043e\u0439.\n        \u041d\u0435\u0432\u0438\u0434\u0438\u043c\u044b\u0439 \u0442\u0438\u043a\u0435\u0442 \u2014 404. \u0412 \u0440\u0435\u0448\u0451\u043d\u043 onents/responses/Unauthorized' }\n        '403': { $ref: '#/components/responses/Forbidden' }\n        '404': { $ref: '#/components/responses/NotFound' }\n        '409': { $ref: '#/components/responses/Conflict' }\n        '422': { $ref: '#/components/responses/ValidationError' }\n    delete:\n      tags: [KnowledgeBase]\n      summary: \u0421\u043d\u044f\u0442\u044c \u0441\u0442\u0430\u0442\u044c\u044e \u0441 \u043f\u0443\u0431\u043b\u0438\u043a\u0430\u0446\u0438\u0438\n      operationId: unpublishKnowledgeArticle\n      x-required-roles: [admin]\n      x-rbac-action: [\"CRUD \u0441\u0442\u0430\u0442\u0435\u0439 \u0431\u0430\u0437\u044b \u0437\u043d\u0430\u043d\u0438\u0439\"]\n      description: >\n        Soft \u2014 is_published=false; \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u044b\u0439 \u0432\u044b\u0437\u043e\u0432 \u2014 \u0442\u043e\u0436\u0435 204. \u0416\u0451\u0441\u0442\u043a\u043e\u0435 \u0443\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043d\u0435\n        \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043e (Ticket.source_article_id \u0441\u0441\u044b\u043b\u0430\u0435\u0442\u0441\u044f \u043d\u0430 \u0441\u0442\u0430\u0442\u044c\u0438). \u0412\u0435\u0440\u0441\u0438\u0438 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u044e\u0442\u0441\u044f;\n        \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u044f \u0438\u0437 \u0441\u0442\u0430\u0442\u044c\u0438, \u0443 \u043a\u043e\u0442\u043e\u0440\u043e\u0439 \u0435\u0441\u0442\u044c \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u0430\u044f \u0432\u0435\u0440\u0441\u0438\u044f, \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0439\n        (\u0443\u0442\u043e\u0447\u043d\u0435\u043d\u043e \u0432 1.5.0, ADR 0018 \u043f. 11).\n      responses:\n        default: { $ref: '#/components/responses/ServerError' }\n        '204': { description: \u0421\u043d\u044f\u0442\u043e \u0441 \u043f\u0443\u0431\u043b\u0438\u0

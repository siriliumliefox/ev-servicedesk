# Матрица пользовательских сценариев EV-ServiceDesk (глава 23, ADR 0027 п. 1, 2, 15, 16).
#
# Сценарий: id E2E-NN, название, роли (client / engineer / admin), приоритет P0 / P1 / P2, требования бэклога
# (docs/requirements/BACKLOG.md), тесты. Тест — уровень и ссылка «файл::имя»: имя — подстрока объявления теста в
# файле (test('…'), testWidgets('…'), def test_…, шаг step("…") сценария backend).
# Уровни E2E: backend (сценарий на стеке из образа), mobile-api (Dart-клиент против стека), mobile-ui (Flutter
# integration_test), web (Playwright одного приложения), system (Playwright, межролевой: system-e2e/).
# Прочие уровни: unit, widget, tokens — для Must, которые сквозным тестом не проверить (ADR 0027 п. 16).
# P0 — Must, обязательно хотя бы один тест уровня E2E (ADR 0027 п. 2); у P1/P2 вместо тестов может быть
# `check` — как проверяется (exploratory — исследовательское тестирование, manual — ручная проверка,
# chapter-NN — в другой главе, not-implemented — не входит в MVP).
# Страж: scripts/check_e2e_matrix.py (job e2e-matrix в ci.yml, на каждом PR).

scenarios:
  # ---------------------------------------------------------------- P0 — критичные сценарии
  - id: E2E-01
    title: Вход клиента по SMS с согласием на ПД, сессия без повторного кода, выход, лимит попыток
    roles: [client]
    priority: P0
    requirements: [C-01, N-06, N-07]
    tests:
      - { level: mobile-ui, ref: "mobile/integration_test/app_flow_test.dart::регистрация → авто по VIN → карточка → перезапуск без SMS → выход" }
      - { level: mobile-api, ref: "mobile/test_api_e2e/api_e2e_test.dart::регистрация → авто → карточка → сессия" }
      - { level: backend, ref: "backend/scripts/e2e_backend.py::регистрация клиента по SMS-коду, согласие ПД, push-токен" }

  - id: E2E-02

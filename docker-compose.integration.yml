# Интеграционный стек главы 17 (ADR 0021 п. 1): все сервисы backend из ОДНОГО образа-кандидата
# (BACKEND_IMAGE) в режиме ENVIRONMENT=staging — API, worker'ы, миграции, PostgreSQL, Redis, MinIO.
# Запускается scripts/integration_stack.sh (CI: backend-ci job integration, cd-staging) под
# отдельным именем проекта: свои тома и сеть, порты PostgreSQL и Redis наружу не публикуются —
# стек не пересекается с локальным окружением разработчика. API — на INTEGRATION_PORT, MinIO — на
# INTEGRATION_S3_PORT: клиент загружает вложения по presigned URL напрямую в S3 (глава 20, ADR 0024 п. 2).

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !override
      - "${INTEGRATION_BIND:-127.0.0.1}:${INTEGRATION_S3_PORT:-19000}:9000"
  backend:
    pull_policy: never
    ports: !override
      # INTEGRATION_BIND=0.0.0.0 — для iPhone в локальной сети (mobile/scripts/device_run.sh, глава 18).
      - "${INTEGRATION_BIND:-127.0.0.1}:${INTEGRATION_PORT:-18080}:8000"
  migrate:
    pull_policy: never
  notifications-worker:
    pull_policy: never
  analytics-worker:
    pull_policy: never

# nginx окружения (глава 26, ADR 0030 п. 18): TLS, статика кабинетов, прокси /v1 и WebSocket.
# Серверы — conf.d/ev.conf из templates/ev.conf.template (envsubst официального образа, только
# переменные EV_*: NGINX_ENVSUBST_FILTER).
worker_processes auto;
pid /var/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Push-токен — в пути DELETE /v1/push-tokens/{token}: в журнал — шаблон (ADR 0029 п. 17).
    map $uri $ev_log_uri {
        ~^/v1/push-tokens/ "/v1/push-tokens/{token}";
        default $uri;
    }
    # JSON-журнал без строки запроса ($uri, не $request_uri): в ней телефоны поиска (99-З п. 2).
    log_format ev_json escape=json
        '{"ts":"$time_iso8601","logger":"nginx","host":"$host","method":"$request_method",'
        '"uri":"$ev_log_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time_s":$request_time,"upstream_time_s":"$upstream_response_time",'
        '"ip":"$remote_addr","ua":"$http_user_agent"}';
    access_log /dev/stdout ev_json;

    # WebSocket чата тикета (ADR 0017 п. 9): Upgrade только когда клиент его просит.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/ev.conf;
}

# Прокси в backend. X-Forwarded-For перезаписывается адресом клиента (не дописывается): backend
# доверяет только nginx (FORWARDED_ALLOW_IPS), подделать адрес для лимитов N-06 нельзя.
proxy_pass http://ev_backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Тайм-ауты чтения и записи — по умолчанию nginx (60 с); WebSocket задаёт свои (1 ч).
proxy_connect_timeout 5s;
client_max_body_size 1m;

# pgBackRest (глава 26, ADR 0030 п. 9). Секреты и адреса — переменные окружения контейнера
# PGBACKREST_* (ключи S3, пароль шифрования, адрес SFTP): pgBackRest читает их как опции.
# repo1 — S3 окружения (Timeweb, Санкт-Петербург); repo2 — внешняя площадка по SFTP (staging-ВМ в
# Москве), включается переменными PGBACKREST_REPO2_*.
[global]
log-path=/var/log/pgbackrest
lock-path=/tmp/pgbackrest
spool-path=/var/lib/pgbackrest
log-level-console=info
log-level-file=info
start-fast=y
compress-type=zst
process-max=2
archive-async=y

repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# Полных бэкапов храним 2 (раз в неделю) — PITR за ~14 дней; WAL — к ним же.
repo1-retention-full=2
repo1-retention-full-type=count

[global:archive-push]
compress-level=3

[ev]
pg1-path=/var/lib/postgresql/data
pg1-user=ev

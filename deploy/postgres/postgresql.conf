# PostgreSQL production и staging (глава 26, ADR 0030 п. 9; ADR 0028 п. 15 — настройки под 2 ГБ).
# Полный файл вместо postgresql.conf каталога данных: хранится в git и одинаков на окружениях.
listen_addresses = '*'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

# Соединения: процессы API × (пул + переполнение) + worker'ы + экспортёр + запас (ADR 0028 п. 15):
# 2 × (5 + 10) + 3 × 5 + 2 + 10 ≈ 60.
max_connections = 80

# Память под контейнер 2 ГБ.
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
random_page_cost = 1.1
effective_io_concurrency = 200

# Журнал запросов: медленные — в журнал (без параметров: в них ПД).
log_min_duration_statement = 500
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

# Архив WAL — pgBackRest (RPO ≤ 5 мин: переключение сегмента не реже раза в минуту).
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=ev archive-push %p'
archive_timeout = 60
max_wal_size = 2GB
min_wal_size = 256MB
wal_compression = on

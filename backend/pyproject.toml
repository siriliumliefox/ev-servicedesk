[tool.poetry]
package-mode = false

[project]
name = "ev-servicedesk-backend"
version = "0.1.0"
description = "EV-ServiceDesk backend (Auth, Vehicle, Aggregates, Tickets, KnowledgeBase, Notifications)"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.136.3,<0.137)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "redis (>=5.2.0,<6.0.0)",
    "pyjwt[crypto] (>=2.9,<3)",
    "argon2-cffi (>=23.1,<26)",
    "httpx (>=0.27,<0.28)",
    "boto3 (>=1.43.114,<2.0)",
    "zxcvbn (>=4.5,<5)",
    "starlette (>=1.3.1,<2)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.17.1"
openapi-spec-validator = "^0.7"
pyyaml = "^6.0"
fakeredis = {version = ">=2.40.0,<3", extras = ["lua"]}
openapi-schema-validator = ">=0.6,<0.7"
pytest-cov = "^6.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

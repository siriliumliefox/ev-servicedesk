line-length = 100
target-version = "py312"

[lint]
# S — правила bandit (Глава 25, ADR 0029 п. 9): исключения — noqa с объяснением.
select = ["E", "F", "I", "UP", "S"]

[lint.per-file-ignores]
# Миграции генерируются autogenerate: длинные строки op.create_table не переносим. SQL миграций —
# константы модуля (имена таблиц, тексты функций), пользовательского ввода нет.
"alembic/versions/*" = ["E501", "S608"]
# Тесты: assert, фиктивные пароли и токены, SQL из констант, псевдослучайные данные,
# urlopen по presigned URL тестового S3 — по назначению.
"tests/*" = ["S101", "S105", "S106", "S107", "S310", "S311", "S608"]

[lint.isort]
# backend/alembic — каталог миграций, а не пакет: импорты alembic — сторонняя библиотека
# (ruff 0.17 иначе делит `from alembic import …` и `alembic.<модуль>` по разным секциям).
known-third-party = ["alembic"]
